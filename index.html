<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GREENHOLD: Meadow Defense</title>
<style>
  /* The two faces are served from this origin rather than from Google. A
     stylesheet link to fonts.googleapis.com hands every player's address and
     browser to a third party on the first paint, before anyone has agreed to
     anything and even in a single-player run, which is the exact arrangement a
     Munich court ruled against in 2022. Self-hosting also drops two DNS
     lookups and two TLS handshakes off the critical path.

     Both files are the variable cut, so one file per subset covers every
     weight the page asks for. Greek and Vietnamese are not downloaded: this
     game is English and Russian. Licences sit next to the files. */
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 800;
    font-display: swap; src: url(assets/fonts/jetbrainsmono-cyrillic-ext.woff2) format('woff2');
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 800;
    font-display: swap; src: url(assets/fonts/jetbrainsmono-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 800;
    font-display: swap; src: url(assets/fonts/jetbrainsmono-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 800;
    font-display: swap; src: url(assets/fonts/jetbrainsmono-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400 700;
    font-display: swap; src: url(assets/fonts/oswald-cyrillic-ext.woff2) format('woff2');
    unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F; }
  @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400 700;
    font-display: swap; src: url(assets/fonts/oswald-cyrillic.woff2) format('woff2');
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400 700;
    font-display: swap; src: url(assets/fonts/oswald-latin-ext.woff2) format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 400 700;
    font-display: swap; src: url(assets/fonts/oswald-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    /* A summer meadow at midday: parchment, timber and grass. Nothing glows —
       the only cold colour in the game belongs to the machines. */
    --bg: #e7dcc2; --panel: #f4ecda; --line: rgba(120,92,58,.26);
    --text: #38291a; --muted: #7d6b53; --ice: #3c7d52;
    --danger: #bf4433; --gold: #cf8a24; --good: #5d9c41; --violet: #8a6fb0;
    --wood: #b5834f; --wood-dk: #86603a; --stone: #a3a9a4;
    --steel: #8b96a3; --rust: #a9633a; --lens: #e0503f;
    --grass: #6f9f4a; --grass-dk: #4c7733; --sky: #9fd2e8;
    /* The palette above is paint: it names materials and draws them. Text has
       its own set, darkened until every one of these clears 4.5:1 on the
       parchment cards (#fcf7ea / #f4ecda). Never set body copy from the paint
       tokens — a stone-grey heading on parchment reads at 2.3:1. */
    --ink-good: #3c6b28; --ink-danger: #a8341f; --ink-gold: #8a5a12;
    --ink-ice: #2f6440; --ink-dim: #5f5140;
    /* Oswald = stencilled field signage. JetBrains Mono = the station terminal. */
    --f-display: "Oswald", "Arial Narrow", Impact, sans-serif;
    --f-ui: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; color: var(--text);
    background: linear-gradient(180deg, #cfe6ef 0%, #e7dcc2 38%, #dfd2b4 100%);
    font-family: var(--f-ui); display: flex; justify-content: center;
    align-items: flex-start; }
  /* The body is a flex item of <html>, so without a width of its own it sized
     itself to its content, and part of that content is the canvas, whose
     natural width is its own pixel buffer. resize() sized the buffer from the
     page, the page from the buffer: the field crept wider a few pixels a frame,
     the HUD wrapped and unwrapped, the field height flipped with it, and every
     flip cleared the canvas. On some windows the field sat blank. A definite
     width breaks the loop. The game takes the whole window: the camera below
     decides how much of that width the yard fills. */
  body { width: 100%; }
  /* The padding runs through these three so a media query can retune the
     numbers without dropping the safe-area insets underneath them. The insets
     are zero on everything except a notched phone, so the desktop padding is
     the same 10/16/14 it always was. */
  .app { --pad-x: 16px; --pad-t: 10px; --pad-b: 14px;
    width: 100%; min-width: 0; display: flex; flex-direction: column; gap: 10px;
    padding: calc(var(--pad-t) + env(safe-area-inset-top))
             calc(var(--pad-x) + env(safe-area-inset-right))
             calc(var(--pad-b) + env(safe-area-inset-bottom))
             calc(var(--pad-x) + env(safe-area-inset-left)); }

  .hud { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .hud h1 { margin: 0; font-family: var(--f-display); font-size: 27px; font-weight: 600;
    letter-spacing: 4px; line-height: 1; color: #4a6b2f;
    text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .sector { font-size: 10px; font-weight: 700; letter-spacing: 1.4px; color: var(--ice); margin-top: 3px;
    text-transform: uppercase; }

  .stats { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .stat { display: flex; flex-direction: column; gap: 0; min-width: 44px; }
  .stat span:first-child { font-size: 11px; color: #5f5140; text-transform: uppercase; letter-spacing: 1px; }
  .stat span:last-child { font-family: var(--f-display); font-size: 22px; font-weight: 600;
    font-variant-numeric: tabular-nums; line-height: 1.15; letter-spacing: .5px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 11px; border: 1px solid var(--line); border-radius: 9px;
    background: rgba(181,131,79,.16); color: var(--text); font-family: var(--f-ui); font-size: 11.5px;
    cursor: pointer; transition: .15s; font-weight: 700; white-space: nowrap;
    text-transform: uppercase; letter-spacing: .8px; }
  .btn:hover:not(:disabled) { background: rgba(181,131,79,.3); border-color: rgba(120,92,58,.5); }
  .btn:disabled { opacity: .32; cursor: not-allowed; }
  /* `display` on a class outranks the browser's own rule for the hidden
     attribute, so setting el.hidden on one of these did nothing and Skip sat
     on the finished training card offering to skip what had just been done.
     The same patch exists on .half and .linkwarn further down. */
  button[hidden] { display: none; }
  .btn.gold { border-color: rgba(207,138,36,.5); color: #7a4e0c; background: rgba(207,138,36,.16); }
  .btn.gold:hover:not(:disabled) { background: rgba(207,138,36,.3); }
  .btn.good { border-color: rgba(93,156,65,.5); color: #345e22; background: rgba(93,156,65,.16); }
  .btn.good:hover:not(:disabled) { background: rgba(93,156,65,.3); }
  .btn.ghost { border-color: rgba(191,68,51,.45); color: #9c2f1b; background: rgba(191,68,51,.1); }
  .btn.ghost:hover:not(:disabled) { background: rgba(191,68,51,.22); }
  .btn.sel { background: rgba(60,125,82,.28); border-color: var(--ice); color: #24492f; }

  /* the game draws every mark it uses, on canvas and in the HUD alike, so a
     bell stays a bell instead of whatever glyph the operating system ships */
  .ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ico .f { fill: currentColor; stroke: none; }
  .btn.ico-only { padding: 7px 9px; }
  .btn .warn, .btn .off { display: none; }
  .btn.warn .warn { display: block; color: var(--danger); }
  .btn.muted .off, .btn.paused .off { display: block; }
  .btn.muted .on, .btn.paused .on { display: none; }
  .btn.full .off { display: block; }
  .btn.full .on { display: none; }
  /* a keyboard player currently sees nothing at all move while tabbing */
  .btn:focus-visible, .abil:focus-visible, .mbtn:focus-visible, .card:focus-visible {
    outline: 2px solid var(--ice); outline-offset: 2px; }

  .barwrap { width: 100%; height: 8px; background: rgba(56,41,26,.14); border-radius: 5px;
    overflow: hidden; margin-top: 8px; }
  /* scaleX instead of width: animating width relayouts the bar every frame */
  .barfill { height: 100%; background: var(--good); width: 100%; transform-origin: left center;
    transition: transform .18s, background .3s; box-shadow: 0 0 12px currentColor; }

  /* a real <button>: it calls the wave, so it has to be one for the keyboard
     and the screen reader. Everything below just undoes the UA button styling. */
  .wavebar { position: relative; width: 100%; height: 56px; border-radius: 13px; overflow: hidden;
    border: 2px solid rgba(207,138,36,.6); background: rgba(207,138,36,.14);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font: inherit; color: inherit; padding: 0; text-align: center; -webkit-appearance: none;
    transition: border-color .2s, background .2s, transform .08s; user-select: none; }
  .wavebar:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  .wavebar:disabled { cursor: default; }
  .wavebar.fight { border-color: rgba(191,68,51,.6); background: rgba(191,68,51,.1); cursor: default; }
  .wavebar.over  { border-color: rgba(120,92,58,.35); background: rgba(120,92,58,.08); cursor: pointer; }
  .wavebar:not(.fight):hover { background: rgba(207,138,36,.26); border-color: rgba(207,138,36,.95); }
  .wavebar:not(.fight):active { transform: scale(.993); }
  .wavefill { position: absolute; inset: 0 auto 0 0; width: 100%; background: rgba(207,138,36,.24);
    transform: scaleX(0); transform-origin: left center; transition: transform .12s linear; }
  .wavebar.fight .wavefill { background: rgba(191,68,51,.2); }
  .wavetext { position: relative; text-align: center; line-height: 1.15; padding: 0 10px; }
  .wavemain { display: block; font-family: var(--f-display); font-size: 23px; font-weight: 600;
    letter-spacing: 2px; color: #8a5a12; text-shadow: 0 1px 0 rgba(255,255,255,.5); }
  .wavebar.fight .wavemain { color: var(--danger); text-shadow: 0 1px 0 rgba(255,255,255,.4); }
  .wavebar.over .wavemain { color: var(--muted); text-shadow: none; }
  .wavesub { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 3px;
    letter-spacing: .3px; }
  .wavebar:not(.fight):not(.over) .wavemain { animation: pulseGold 1.6s ease-in-out infinite; }
  @keyframes pulseGold { 0%,100% { opacity: 1 } 50% { opacity: .6 } }

  /* ------------------------- ability bar -------------------------------- */
  .abils { display: flex; gap: 7px; }
  .abil { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    padding: 7px 30px 7px 10px; border: 1px solid var(--line); border-radius: 10px;
    background: rgba(252,247,234,.86); color: var(--text); text-align: left;
    font-family: var(--f-ui); transition: .14s; }
  .abil:hover:not(:disabled) { background: #fffdf5; border-color: rgba(93,156,65,.7); }
  .abil:disabled { cursor: not-allowed; }
  .abil .nm { display: block; font-family: var(--f-display); font-size: 14px; font-weight: 500;
    letter-spacing: 1.4px; text-transform: uppercase; line-height: 1.1; }
  .abil .sb { display: block; font-size: 11px; color: #5f5140; margin-top: 2px;
    letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abil .ico { width: 19px; height: 19px; }
  .abil .tx { flex: 1; min-width: 0; }
  .abil .kc { position: absolute; right: 7px; top: 6px; font-size: 11px; color: #5f5140;
    border: 1px solid rgba(120,92,58,.3); border-radius: 4px; padding: 1px 4px; }
  /* the cooldown sweeps across the button from the left */
  .abil .cd { position: absolute; inset: 0 auto 0 0; width: 100%; transform: scaleX(0);
    transform-origin: left center;
    background: rgba(120,92,58,.3); pointer-events: none; transition: transform .1s linear; }
  .abil.ready { border-color: rgba(93,156,65,.6); background: rgba(233,245,222,.95); }
  .abil.ready .nm, .abil.ready .ico { color: #3c6b28; }
  .abil.hot { border-color: rgba(207,138,36,.8); background: rgba(255,240,205,.95); }
  .abil.hot .nm, .abil.hot .ico { color: #8a5a12; }

  /* ---------------------- on-screen piece controls ----------------------- */
  /* Rotate, hold and drop exist only on the keyboard otherwise, which makes the
     whole game unplayable on a tablet. Shown wherever the pointer is coarse,
     or when the player switches them on by hand. */
  .touchbar { display: none; gap: 6px; }
  html.touchctl .touchbar, .touchbar.on { display: flex; }
  .tbtn { flex: 1 1 0; min-width: 0; min-height: 46px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; padding: 5px 4px;
    border: 1px solid var(--line); border-radius: 10px; background: rgba(252,247,234,.9);
    color: var(--text); font-family: var(--f-ui); font-size: 9px; font-weight: 700;
    letter-spacing: .6px; text-transform: uppercase; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  .tbtn .ico { width: 19px; height: 19px; }
  .tbtn:disabled { opacity: .32; cursor: not-allowed; }
  .tbtn:active:not(:disabled) { background: rgba(93,156,65,.22); border-color: rgba(93,156,65,.7); }
  .tbtn:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

  .stage { position: relative; display: flex; justify-content: center; border-radius: 16px;
    overflow: hidden; flex: none; width: 100%; min-width: 0; gap: 0;
    border: 1px solid rgba(120,92,58,.3);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); }
  .half { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }
  .half[hidden] { display: none; }
  /* the seam between the two fields, so neither looks like it bleeds into the
     other; only drawn when there is actually a second field */
  .half + .half:not([hidden]) { border-left: 2px solid rgba(120,92,58,.45); }
  canvas { display: block; background: #9fd2e8; width: 100%; min-width: 0;
    touch-action: none; user-select: none; cursor: default; }
  canvas.hold { cursor: grab; }
  canvas.hold:active { cursor: grabbing; }

  /* name plate over each field */
  .halfbar { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 5px 9px; background: linear-gradient(180deg, rgba(252,247,234,.94), rgba(252,247,234,0));
    pointer-events: none; }
  .halfbar[hidden] { display: none; }
  .halfbar .who { font-family: var(--f-display); font-size: 14px; font-weight: 600;
    letter-spacing: 1.6px; text-transform: uppercase; color: var(--ink-ice);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .halfbar .st { font-size: 10px; font-weight: 700; letter-spacing: .8px;
    color: var(--ink-dim); white-space: nowrap; }
  .halfbar.out .who { color: var(--ink-danger); }
  .halfbar.lead .st { color: var(--ink-good); }
  /* shown over the opponent's field when their packets stop arriving */
  .linkwarn { position: absolute; inset: auto 0 0 0; z-index: 4; padding: 7px 10px;
    text-align: center; font-size: 10px; letter-spacing: .6px; font-weight: 700;
    color: var(--ink-danger); background: rgba(252,247,234,.9); }
  .linkwarn[hidden] { display: none; }

  /* Overlay stacking order, in one place. Everything that can cover the field
     is listed here so a new layer cannot quietly slip under an older one:
     coach card 12 < pause sheet 20 < story card 30 < upgrade choice 40. The
     coach floats over the empty sky on a wide field and is a row under it on
     a narrow one; either way every sheet covers it. */
  .modal   { z-index: 20 }
  .sectorcard { z-index: 30 }
  .choice  { z-index: 40 }

  /* pause / game over sheet */
  .modal { position: absolute; inset: 0; background: rgba(231,220,194,.92); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 12px; }
  .modal[hidden] { display: none; }
  .sheet { width: min(370px, 100%); background: linear-gradient(180deg, #fbf5e6, #f0e5cd);
    border: 1px solid rgba(120,92,58,.35); border-radius: 16px; padding: 22px 20px;
    display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(80,60,35,.35);
    /* the stage clips its children, so every sheet scrolls inside itself */
    max-height: 100%; overflow-y: auto; overscroll-behavior: contain; }
  .sheet h2 { margin: 0; font-family: var(--f-display); font-size: 30px; font-weight: 600;
    letter-spacing: 3px; text-align: center; }
  .sheet p { margin: 0; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .row .lbl { font-size: 11px; color: #5f5140; text-transform: uppercase; letter-spacing: 1px; }
  .sheet .btn { flex: 1 1 auto; text-align: center; padding: 10px 14px; font-size: 11.5px; }
  /* these take focus when a dialog opens, so it starts at the top instead of
     scrolled down to whichever button came first; they are not tab stops */
  [data-autofocus]:focus { outline: none; }
  /* the sheet is already the card; its rows must not draw boxes of their own */
  .sheet .row { border: 0; background: none; }

  /* the controls crib sheet, folded away inside the pause sheet */
  .sheet details { border-top: 1px solid rgba(120,92,58,.16); padding-top: 10px; }
  .sheet summary { cursor: pointer; font-size: 11px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--ink-ice); font-weight: 700; }
  .sheet summary:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 4px; }
  .keylist { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin-top: 9px;
    font-size: 10.5px; line-height: 1.5; text-align: left; }
  .keylist dt { font-family: var(--f-ui); font-weight: 700; color: var(--ink-gold); white-space: nowrap; }
  .keylist dd { margin: 0; color: #4d3c28; }
  .runmods { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .runmods .chip { font-size: 10px; padding: 2px 7px; }
  .runmods .chip b { font-weight: 700; color: var(--ink-ice); }

  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px;
    border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.5); }
  .dot { width: 8px; height: 8px; border-radius: 2px; box-shadow: 0 0 7px currentColor; }

  /* ==================== FULL-SCREEN SCREENS (menu / codex) ================= */
  .screen { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center;
    justify-content: center; overflow-y: auto; padding: 20px 16px;
    background: linear-gradient(180deg, #bfe0ee 0%, #d7e9ef 40%, #cfe0ac 62%, #8fb95e 100%); }
  .screen[hidden] { display: none; }
  #menufx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .screen > .panelwrap { position: relative; z-index: 1; width: min(390px, 100%); margin: auto;
    display: flex; flex-direction: column; gap: 15px; }
  #codex > .panelwrap { width: min(520px, 100%); }

  /* scanline + vignette overlay sells the "station terminal" framing */
  /* warm daylight vignette instead of CRT scanlines */
  .screen::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 34%, rgba(255,248,220,.3) 0%, rgba(255,248,220,0) 42%),
                radial-gradient(circle at 50% 50%, rgba(90,70,40,0) 52%, rgba(90,70,40,.22) 100%); }

  .brand { text-align: center; }
  .brand .eyebrow { font-size: 8.5px; letter-spacing: 2.4px; color: var(--muted);
    text-transform: uppercase; }
  .brand h1 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 600;
    font-size: clamp(40px, 9.5vw, 58px); line-height: .95; letter-spacing: 5px;
    color: #1f3a14; text-shadow: 0 2px 0 rgba(255,255,255,.6), 0 6px 18px rgba(60,90,40,.22); }
  .brand .tagline { margin-top: 5px; font-family: var(--f-display); font-size: 11px; font-weight: 400;
    letter-spacing: 3.6px; color: #3c5526; text-transform: uppercase; }
  .brand .rule { height: 1px; margin: 11px auto 0; width: 68%;
    background: linear-gradient(90deg, transparent, rgba(90,70,40,.4), transparent); }

  .lorebox { font-size: 10px; line-height: 1.7; color: #4d3c28; text-align: center; padding: 0 4px; }
  .lorebox .sig { display: block; margin-top: 8px; color: var(--muted); font-size: 8.5px;
    letter-spacing: 1.4px; text-transform: uppercase; }

  .menubtns { display: flex; flex-direction: column; gap: 7px; }
  .mbtn { position: relative; padding: 9px 62px 9px 14px; border: 1px solid var(--line);
    border-radius: 9px; background: rgba(252,247,234,.9); color: var(--text); cursor: pointer;
    text-align: left; font-family: var(--f-display); font-size: 14px; font-weight: 500;
    letter-spacing: 1.8px; text-transform: uppercase; transition: .16s; }
  .mbtn .sub { display: block; font-family: var(--f-ui); font-size: 11px; font-weight: 400;
    letter-spacing: .1px; color: #5f5140; text-transform: none; margin-top: 2px;
    line-height: 1.4; }
  .mbtn:hover { background: #fffdf5; border-color: rgba(93,156,65,.7);
    transform: translateX(4px); box-shadow: 0 3px 12px rgba(80,60,35,.16); }
  .mbtn:hover .sub { color: #4d3c28; }
  .mbtn.primary { border-color: rgba(207,138,36,.55); background: rgba(255,240,205,.95); color: #8a5a12; }
  .mbtn.primary:hover { background: #fff6e0; border-color: var(--gold); }
  .mbtn .keycap { position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    font-family: var(--f-ui); font-size: 11px; letter-spacing: .6px; color: #5f5140;
    border: 1px solid rgba(120,92,58,.3); border-radius: 4px; padding: 1px 6px; }

  .menufoot { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    flex-wrap: wrap; font-size: 11px; color: #5f5140; letter-spacing: .6px; }
  .menufoot .btn { padding: 6px 11px; font-size: 11px; }

  /* ------------------------------- codex --------------------------------- */
  .panelhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panelhead h2 { margin: 0; font-family: var(--f-display); font-size: 27px; font-weight: 600;
    letter-spacing: 3.4px; text-transform: uppercase; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .codexlist { display: flex; flex-direction: column; gap: 7px; max-height: 54vh; overflow-y: auto;
    padding-right: 4px; }
  .codexlist::-webkit-scrollbar { width: 7px; }
  .codexlist::-webkit-scrollbar-thumb { background: rgba(120,92,58,.32); border-radius: 4px; }
  .entry { display: flex; gap: 11px; align-items: flex-start; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: rgba(252,247,234,.88); }
  .entry canvas { flex: none; width: 46px; height: 46px; border-radius: 8px;
    background: rgba(180,205,150,.45); border: 1px solid rgba(120,92,58,.2); }
  .entry .meta { min-width: 0; flex: 1; }
  .entry .nm { font-family: var(--f-display); font-size: 16px; font-weight: 500; letter-spacing: 1.6px;
    text-transform: uppercase; line-height: 1.15; }
  .entry .swatch { width: 9px; height: 9px; border-radius: 2px; display: inline-block;
    vertical-align: baseline; margin-right: 5px; border: 1px solid rgba(60,45,25,.25); }
  .entry .tags { font-size: 9.5px; color: var(--ink-dim); letter-spacing: .6px; margin-top: 2px; }
  .entry .desc { font-size: 10.5px; color: #4d3c28; line-height: 1.6; margin-top: 5px; }
  .entry.locked { opacity: .45; }
  .entry.locked .nm, .entry.locked .desc { color: var(--muted); }

  /* ------------------------------ online --------------------------------- */
  #online > .panelwrap { width: min(460px, 100%); }
  .onhint { margin: 0; font-size: 11px; line-height: 1.65; color: #4d3c28; }
  .onwait { margin: 0; font-size: 11px; color: var(--ink-dim); text-align: center; }
  .onerr { margin: 0; font-size: 11px; line-height: 1.5; color: var(--ink-danger); font-weight: 700; }
  .onerr[hidden], .onwait[hidden] { display: none; }
  #onAuth, #onHome, #onRoom { display: flex; flex-direction: column; gap: 12px; }
  #onAuth[hidden], #onHome[hidden], #onRoom[hidden] { display: none; }
  .onme { justify-content: space-between; font-size: 11px; color: #4d3c28; }

  #online input { flex: 1 1 140px; min-width: 0; padding: 10px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: rgba(252,247,234,.92); color: var(--text);
    font-family: var(--f-ui); font-size: 13px; letter-spacing: 1px; }
  #online input:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  #onCode { text-transform: uppercase; letter-spacing: 5px; text-align: center;
    font-family: var(--f-display); font-size: 19px; }

  /* the code is read aloud or sent in a screenshot, so it is the biggest thing
     on the card and spaced out enough to copy character by character */
  .roomcode { font-family: var(--f-display); font-size: clamp(38px, 11vw, 56px); font-weight: 600;
    letter-spacing: 12px; text-indent: 12px; text-align: center; color: var(--ink-gold);
    background: rgba(252,247,234,.9); border: 1px solid rgba(207,138,36,.5);
    border-radius: 13px; padding: 12px 8px; }
  .players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .players li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: rgba(252,247,234,.88);
    font-size: 12px; }
  .players b { font-family: var(--f-display); font-size: 15px; font-weight: 500; letter-spacing: 1.4px;
    text-transform: uppercase; }
  .players span { font-size: 10.5px; color: var(--ink-dim); letter-spacing: .6px; align-self: center; }

  .board { display: flex; flex-direction: column; gap: 4px; }
  .bhead { font-size: 9.5px; letter-spacing: 2.4px; text-transform: uppercase;
    color: var(--ink-dim); margin-bottom: 2px; }
  .bempty { font-size: 11px; color: var(--ink-dim); line-height: 1.6; }
  .brow { display: grid; grid-template-columns: 22px 1fr auto auto; gap: 9px; align-items: baseline;
    padding: 6px 10px; border-radius: 8px; background: rgba(252,247,234,.7); font-size: 11px; }
  .bno { font-family: var(--f-display); font-size: 14px; color: var(--ink-dim); }
  .bnick { font-family: var(--f-display); font-size: 14px; letter-spacing: 1.2px;
    text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bwave { color: var(--ink-good); font-weight: 700; }
  .bwon { color: var(--ink-dim); font-size: 10px; }

  /* ----------------------------- settings -------------------------------- */
  .setrow { display: flex; align-items: center; gap: 12px; padding: 9px 2px;
    border-bottom: 1px solid rgba(120,92,58,.16); }
  .setrow:last-child { border-bottom: 0; }
  .setrow label { flex: 1; font-size: 11px; letter-spacing: .5px; }
  .setrow .val { font-family: var(--f-display); font-size: 15px; min-width: 44px; text-align: right;
    color: var(--ice); letter-spacing: 1px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 150px; height: 4px;
    border-radius: 3px; background: rgba(120,92,58,.26); cursor: pointer; }
  /* default outline sits flush with the thin track, so give keyboard focus its own ring instead */
  input[type=range]:focus-visible { outline: 2px solid var(--ice); outline-offset: 3px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none;
    width: 15px; height: 15px; border-radius: 50%; background: var(--ice); cursor: pointer;
    box-shadow: 0 1px 4px rgba(60,45,25,.4); }
  input[type=range]::-moz-range-thumb { width: 15px; height: 15px; border: 0; border-radius: 50%;
    background: var(--ice); cursor: pointer; box-shadow: 0 1px 4px rgba(60,45,25,.4); }

  /* --------------------------- sector card ------------------------------- */
  .sectorcard { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(238,229,206,.94); backdrop-filter: blur(4px);
    padding: 16px; animation: fadeIn .3s ease; overflow-y: auto; overscroll-behavior: contain; }
  .sectorcard[hidden] { display: none; }
  .sectorcard .inner { width: min(430px, 100%); margin: auto; text-align: center; }
  .sectorcard .no { font-size: 9.5px; letter-spacing: 3.4px; color: var(--muted);
    text-transform: uppercase; }
  .sectorcard h3 { margin: 7px 0 0; font-family: var(--f-display); font-size: 34px; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase; line-height: 1.05; }
  .sectorcard .log { margin-top: 14px; font-size: 11px; line-height: 1.8; color: #4d3c28;
    text-align: left; border-left: 2px solid currentColor; padding-left: 13px; }
  .sectorcard .go { margin-top: 18px; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

  /* --------------------- between-wave choice ---------------------------- */
  .choice { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; background: rgba(238,229,206,.95); backdrop-filter: blur(4px);
    padding: 14px; animation: fadeIn .25s ease; overflow-y: auto; overscroll-behavior: contain; }
  .choice[hidden] { display: none; }
  .choice .inner { width: min(620px, 100%); margin: auto; text-align: center; }
  .choice .hd { font-size: 9.5px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .choice h3 { margin: 6px 0 12px; font-family: var(--f-display); font-size: 26px; font-weight: 600;
    letter-spacing: 3px; text-transform: uppercase; color: #3f6b2c; }
  /* the wave tally: reward, upkeep and what is left, kept on screen until the
     card is picked rather than flashed past in a two-second banner */
  #chSum { margin: 0 0 14px; font-size: 10.5px; letter-spacing: .3px; line-height: 1.6;
    text-transform: none; color: #4d3c28; }
  #chSum .short { color: var(--ink-danger); font-weight: 700; }
  .cards { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .card { position: relative; flex: 1 1 170px; max-width: 200px; padding: 14px 13px 13px;
    cursor: pointer; text-align: left;
    border: 1px solid rgba(120,92,58,.35); border-radius: 12px; background: rgba(252,247,234,.96);
    font-family: var(--f-ui); color: var(--text); transition: .15s;
    box-shadow: 0 3px 10px rgba(80,60,35,.12); }
  .card .kc { position: absolute; right: 8px; top: 8px; font-size: 10px; color: var(--ink-dim);
    border: 1px solid rgba(120,92,58,.3); border-radius: 4px; padding: 0 5px; line-height: 1.5; }
  .card:hover { transform: translateY(-3px); border-color: rgba(93,156,65,.75);
    box-shadow: 0 8px 20px rgba(80,60,35,.2); background: #fffdf5; }
  .card .ct { font-family: var(--f-display); font-size: 17px; font-weight: 500; letter-spacing: 1.4px;
    text-transform: uppercase; color: #3c6b28; line-height: 1.15; }
  .card .effs { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .card .eff { font-size: 11.5px; font-weight: 700; letter-spacing: .2px; }
  .card .eff.good { color: var(--ink-good); }
  .card .eff.bad { color: var(--ink-danger); }
  .card .now { display: block; font-size: 10px; font-weight: 400; color: var(--ink-dim);
    letter-spacing: 0; margin-top: 1px; }
  .card.risk { border-color: rgba(191,68,51,.5); }
  .card.risk .ct { color: #a8341f; }
  .card.risk:hover { border-color: rgba(191,68,51,.85); }

  /* ----------------------------- tutorial --------------------------------
     The coach is a small card, and where it sits depends on the room.

     .float (a wide field): pinned in the empty sky at the top right of the
     field. Nothing is played up there: the yard and the piece strip are on the
     left, the machines walk the ground, the banner moves aside for it (see
     drawBanner). It takes no layout height, so the field keeps its full size.

     Without .float (a phone, a narrow or short window): a compact row under
     the field, because a narrow field has no empty corner to spare.

     Either way the text is held to a readable measure. The old row stretched
     one sentence across the whole window in two very long lines. */
  .tut { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "hd hd" "txt acts"; gap: 5px 12px; align-items: end;
    padding: 9px 12px 13px; border-radius: 12px;
    border: 1px solid rgba(93,156,65,.55); background: rgba(252,247,234,.97);
    box-shadow: 0 2px 12px rgba(70,55,30,.12); }
  .tut[hidden] { display: none; }
  .tut.float { position: absolute; z-index: 12; top: 12px; right: 58px;
    width: min(340px, calc(100% - 90px));
    grid-template-columns: minmax(0, 1fr); grid-template-areas: "hd" "txt" "acts";
    gap: 7px; padding: 11px 14px 15px; box-shadow: 0 10px 28px rgba(70,55,30,.22);
    animation: tutIn .22s ease; }
  @keyframes tutIn { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
  .tut .hd { grid-area: hd; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tut .num { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid;
    place-items: center; background: rgba(93,156,65,.18); border: 1px solid rgba(93,156,65,.5);
    font-family: var(--f-display); font-size: 12px; color: #3c6b28; letter-spacing: 0; }
  .tut .num .ico { width: 14px; height: 14px; }
  .tut .ttl { flex: 1 1 auto; min-width: 0; font-family: var(--f-display); font-size: 17px;
    font-weight: 500; letter-spacing: 1.4px; line-height: 1.15; text-transform: uppercase;
    color: var(--ink-ice); }
  /* skipping is always one tap away, but it is the quiet option, not a second
     button shouting next to the one the card actually wants pressed */
  .tut .skip { flex: none; padding: 4px 2px; border: 0; background: none; cursor: pointer;
    font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; color: var(--ink-dim);
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(95,81,64,.4); }
  .tut .skip:hover { color: var(--ink-danger); text-decoration-color: currentColor; }
  .tut .skip:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; border-radius: 4px; }
  .tut .txt { grid-area: txt; max-width: 50ch; font-size: 11.5px; line-height: 1.6;
    color: #4d3c28; text-wrap: pretty; }
  /* the terms a card is teaching (upkeep, salvage, the keys to press) stand a
     size up from the sentence around them instead of only changing colour */
  .tut .txt b { color: #8a5a12; font-weight: 800; font-size: 1.18em; letter-spacing: .2px; }
  .tut .acts { grid-area: acts; display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; min-width: 0; }
  .tut.float .acts { justify-content: space-between; }
  .tut .acts .btn { padding: 7px 14px; font-size: 10.5px; margin-left: auto; }
  /* how far through the script you are: a hairline along the bottom edge */
  .tut .prog { position: absolute; left: 12px; right: 12px; bottom: 6px; height: 3px;
    border-radius: 2px; background: rgba(120,92,58,.2); overflow: hidden; }
  .tut .prog i { display: block; height: 100%; width: 100%; background: var(--ice);
    transform: scaleX(0); transform-origin: left center; transition: transform .3s; }
  .tut.done { border-color: rgba(93,156,65,.8); }
  .tut.done .num { background: rgba(93,156,65,.2); border-color: rgba(93,156,65,.55); color: #3c6b28; }
  .tut.done .ttl { color: var(--ink-good); }

  /* The slow-motion badge. A card that lands mid-wave used to be unreadable:
     five machines crossed the field in the time it takes to read three lines.
     The world now runs at a crawl while a fresh card is up, and this says so,
     because a game that quietly changes speed is a game that feels broken. */
  .tut .slow { display: inline-flex; align-items: center; gap: 6px; flex: none;
    padding: 2px 8px 3px; border-radius: 999px; border: 1px solid rgba(207,138,36,.55);
    background: rgba(255,240,205,.9); color: #8a5a12;
    font-size: 9px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; }
  .tut .slow[hidden] { display: none; }
  .tut .slow i { display: block; width: 30px; height: 3px; border-radius: 2px;
    background: rgba(138,90,18,.25); overflow: hidden; }
  .tut .slow i b { display: block; height: 100%; width: 100%; background: #cf8a24;
    transform-origin: left center; }
  /* in the row the badge shares a narrow column with the button, so it keeps
     its short name */
  .tut .slow .lg { display: none; }
  .tut.float .slow .lg { display: inline; }
  .tut.float .slow .sh { display: none; }
  .tut:not(.float) .acts { flex-direction: column; align-items: flex-end; gap: 5px; }

  /* What the card is pointing at, lit on the thing itself. World objects get
     a ring and a signboard drawn on the canvas; this is for the buttons and
     the HUD.

     An outline alone only recoloured a label the player still had to find:
     "Upkeep" stayed 11px tall in a row of six other 11px labels. So the lit
     thing now grows, on a parchment plate that lifts it off its neighbours,
     big enough to read at a glance. It grows from the side nearest the screen
     edge (setCoachLit sets --lit-origin) so it never runs off the window, and
     a stat lets clicks through, since it has nothing to press. */
  .coachlit { position: relative; z-index: 50; border-radius: 10px;
    transform: translateX(var(--lit-dx, 0px)) scale(var(--lit-scale, 1.35));
    transform-origin: var(--lit-origin, center top);
    transition: transform .3s cubic-bezier(.3, 1.6, .5, 1);
    background-color: #fffaf0 !important;
    box-shadow: 0 0 0 3px rgba(93,156,65,.95), 0 0 0 9px rgba(93,156,65,.2), 0 12px 28px rgba(60,45,25,.3); }
  .coachlit:not(.stat) { border-color: rgba(93,156,65,.9) !important; }
  .stat.coachlit { --lit-scale: 1.9; pointer-events: none;
    box-shadow: 0 0 0 6px #fffaf0, 0 0 0 8px rgba(93,156,65,.95), 0 0 0 13px rgba(93,156,65,.2),
                0 12px 28px rgba(60,45,25,.3); }
  .abil.coachlit { --lit-scale: 1.22; }
  /* the bar already spans the window, so it stays put and its words grow
     inside it instead of the whole bar running off both edges */
  .wavebar.coachlit { --lit-scale: 1; --lit-dx: 0px !important; }
  .wavebar.coachlit .wavetext { transform: scale(1.28); transition: transform .3s cubic-bezier(.3, 1.6, .5, 1); }
  .tbtn.coachlit { --lit-scale: 1.25; }
  html:not(.calm) .coachlit { animation: coachPulse 1.5s ease-in-out infinite; }
  @keyframes coachPulse {
    0%, 100% { outline: 0 solid rgba(93,156,65,.0); }
    50%      { outline: 6px solid rgba(93,156,65,.18); }
  }
  html:not(.calm) .coachlit { outline-offset: 10px; }

  /* Text that exists only for assistive tech: clipped to nothing, never
     display:none, which would take it out of the accessibility tree too. */
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

  /* ------------------------------- toast --------------------------------- */
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 80;
    padding: 9px 16px; border-radius: 9px; background: rgba(252,247,234,.97);
    border: 1px solid rgba(93,156,65,.5); font-size: 10.5px; letter-spacing: .5px;
    color: #3c6b28; box-shadow: 0 6px 20px rgba(70,55,30,.25);
    pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  @media (max-width: 640px) {
    .app { --pad-x: 10px; gap: 8px; }
    .hud { gap: 8px; }
    .hud h1 { font-size: 22px; letter-spacing: 3px; }
    .stat span:last-child { font-size: 18px; }
    .wavebar { height: 46px; }
    .btn { padding: 7px 9px; gap: 5px; }
    .ico { width: 14px; height: 14px; }
    .abils { flex-wrap: wrap; }
    .abil { flex: 1 1 100%; gap: 7px; padding-right: 26px; }
    .abil .ico { width: 17px; height: 17px; }
    .wavemain { font-size: 17px; letter-spacing: 1px; }
    .brand h1 { letter-spacing: 5px; }
    /* keep the right gutter: the keycap is absolutely positioned there and
       lands on top of the subtitle the moment the padding goes */
    .mbtn { font-size: 15px; padding: 11px 62px 11px 15px; }
    .codexlist { max-height: 46vh; }
    .cards { gap: 8px; }
    .card { flex: 1 1 100%; max-width: none; }
    /* the coach row on a phone: the button keeps a thumb-sized target, the
       text gets everything else */
    .tut { gap: 4px 10px; padding: 8px 10px 12px; }
    .tut .ttl { font-size: 14px; }
    .tut .txt { font-size: 11px; line-height: 1.55; }
    .tut .acts .btn { min-height: 44px; min-width: 84px; }
  }

  /* Below this the chrome alone eats the viewport: three stacked ability rows,
     each with a subtitle, cost more height than the field they are attached to.
     They fold back into one row of three, the explanatory line goes (it is in
     the pause sheet's controls list), and the field gets its height back.
     320x568 is the supported floor.

     The coarse-pointer arm carries the fold up to 560px, because the largest
     phones report 430px and were landing on the stacked rows this paragraph
     was written to avoid. A mouse at that width keeps the roomier layout. */
  @media (max-width: 420px), (max-height: 640px), (pointer: coarse) and (max-width: 560px) {
    .abils { flex-wrap: nowrap; gap: 6px; }
    .abil { flex: 1 1 0; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 6px 5px; text-align: center; }
    .abil .sb, .abil .kc { display: none; }
    .abil .tx { flex: none; width: 100%; }
    .abil .nm { font-size: 11px; letter-spacing: .6px; }
    .abil .ico { width: 16px; height: 16px; }
  }
  @media (max-width: 420px) {
    .stat { min-width: 38px; }
    .stat span:first-child { font-size: 10px; letter-spacing: .5px; }
    .stat span:last-child { font-size: 16px; }
    .wavebar { height: 42px; }
    .wavesub { font-size: 9px; }
    .sheet { padding: 16px 14px; gap: 11px; }
    .sheet h2 { font-size: 24px; }
    .tbtn { font-size: 8.5px; min-height: 44px; }
  }

  /* A short window (a laptop with the browser chrome showing, or a phone in
     landscape) has to give the field its height back, not the chrome. */
  @media (max-height: 620px) {
    .app { --pad-x: 12px; --pad-t: 6px; --pad-b: 8px; gap: 6px; }
    .hud h1 { font-size: 20px; }
    .barwrap { margin-top: 5px; }
    .wavebar { height: 40px; }
    .wavemain { font-size: 16px; }
    .wavesub { font-size: 9px; margin-top: 1px; }
    .abil { padding-top: 5px; padding-bottom: 5px; }
    .codexlist { max-height: 40vh; }
  }

  /* A finger needs a bigger target than a mouse pointer: the icon buttons are
     33x31 with mouse padding, which is under every touch guideline there is. */
  @media (pointer: coarse) {
    .btn { min-height: 40px; padding: 9px 12px; }
    .btn.ico-only { min-width: 44px; min-height: 44px; }
    .mbtn { min-height: 52px; }
    .tabs .btn { min-height: 40px; }
    /* A keycap is a promise of a keyboard. Here it names a key nobody in the
       room has, so it goes, and the gutter it was reserved in goes with it.
       The button keeps its own label, which was always the real instruction. */
    .mbtn .keycap, .card .kc, .abil .kc { display: none; }
    .mbtn { padding-right: 15px; }
  }

  /* ----------------------- the phone, held upright ------------------------
     A phone is read at the top and held at the bottom, and the layout above
     has it backwards: the piece controls sit over the field, so the hand that
     turns a block covers the wall it is building. Here the field takes the
     upper screen and everything the thumb reaches moves below it, the piece
     controls nearest the hand and the three abilities just above them. On a
     mouse the controls stay where they were, next to the pointer.

     Only the painting is reordered; the source order, and with it the tab
     order, stays as it is. That is the trade: on a touchscreen the field is
     worth more than a tab sequence almost nobody runs there.

     The title leaves the screen but not the accessibility tree. It names a
     game the player is already inside, and it costs a row of the field.

     Reordering costs no height: the same rows are on the screen either way,
     so this needs no second breakpoint to protect a short window. The width
     alone already keeps a phone on its side out, at 812px across.

     560px rather than the 420px above, because the largest phones report 430.
     ---------------------------------------------------------------------- */
  @media (pointer: coarse) and (max-width: 560px) {
    /* the phone row is already full; full screen lives in the pause sheet */
    #fsBtn    { display: none; }
    .hud      { order: 1; }
    .wavebar  { order: 2; }
    .stage    { order: 3; }
    /* the coach sits directly under the field it is talking about, above the
       controls, so the eye goes field, instruction, hands */
    .tut      { order: 4; }
    .abils    { order: 5; }
    /* six targets across a 360px screen: 8px between them keeps one press from
       landing on two of them */
    .touchbar { order: 6; gap: 8px; }
    .tbtn { min-height: 54px; font-size: 9.5px; }
    .tbtn .ico { width: 21px; height: 21px; }
    .hud h1 { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
    .sector { margin-top: 0; font-size: 11px; }
  }

  /* Under 360px across, six targets with an 8px gutter between them come out
     at 43px wide, and 44 is the floor a thumb needs. The gutters give way
     first, the targets do not: 10px at the edges and 6px between leaves 45. */
  @media (pointer: coarse) and (max-width: 360px) {
    .app { --pad-x: 10px; }
    .touchbar { gap: 6px; }
  }

  /* Motion. `calm` is set from JS, which starts from prefers-reduced-motion and
     lets the pause menu override it — the same flag also stops the screen shake
     and the impact flashes on the canvas, which CSS cannot reach. Hit feedback
     stays; it just stops moving. */
  html.calm * { animation-duration: .001s !important; animation-iteration-count: 1 !important;
    transition-duration: .001s !important; }
  html.calm .mbtn:hover { transform: none; }
  html.calm .card:hover { transform: none; }
</style>
</head>

<script>
"use strict";

/* ============================================================================
   PERSISTENCE — one tiny wrapper so a locked-down browser never breaks the game.
   ========================================================================= */
const STORE = {
  raw(k, d) { try { const v = localStorage.getItem('hf_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hf_' + k, JSON.stringify(v)); } catch (e) {} },
  drop(k) { try { localStorage.removeItem('hf_' + k); } catch (e) {} },

  /* Catching the JSON error is not enough: `null`, a string where a number
     belongs, or a codex object from an older build are all valid JSON and all
     of them crash something downstream. Every read goes through a check, and
     anything that fails it is replaced by the default rather than repaired. */
  num(k, d, lo, hi) {
    const v = this.raw(k, d);
    if (typeof v !== 'number' || !isFinite(v)) return d;
    return Math.min(hi, Math.max(lo, v));
  },
  bool(k, d) { const v = this.raw(k, d); return typeof v === 'boolean' ? v : d; },
  pick(k, d, allowed) { const v = this.raw(k, d); return allowed.indexOf(v) >= 0 ? v : d; },
  /* {id: wave} and nothing else — unknown ids are dropped, not kept "just in case" */
  seenMap(k, validIds) {
    const v = this.raw(k, null);
    const out = {};
    if (!v || typeof v !== 'object' || Array.isArray(v)) return out;
    for (const id of validIds) {
      const w = v[id];
      if (typeof w === 'number' && isFinite(w) && w >= 1) out[id] = Math.floor(w);
    }
    return out;
  },
};
/* hf_lang used to be written twice: once raw by setLanguage, once as JSON by
   STORE. Read whichever is there, then rewrite it as JSON so the next load has
   exactly one format to deal with. */
function readLang() {
  let v;
  try { v = localStorage.getItem('hf_lang'); } catch (e) { return 'en'; }
  if (v === null) return 'en';
  if (v === 'en' || v === 'ru') { STORE.set('lang', v); return v; }   // legacy raw
  try { const p = JSON.parse(v); if (p === 'en' || p === 'ru') return p; } catch (e) {}
  STORE.set('lang', 'en');
  return 'en';
}

/* THE RECORD. "Longest hold" counts waves actually held: dying halfway through
   wave 9 is a hold of 8. It is written wherever a run stops counting — defeat,
   restart, walking back to the menu, closing the tab — so a good run that ends
   by any route other than dying still lands in the ledger. */
const bestWave = () => Math.floor(STORE.num('best', 0, 0, 1e6));
function recordBest(g) {
  if (!g || g.tutorial) return;
  const held = g.wavesHeld;
  if (held > bestWave()) STORE.set('best', held);
  // and to the account, if there is one, so the number follows the player
  if (typeof sbPushBest === 'function') sbPushBest(held);
}

/* ============================================================================
   RANDOMNESS. Anything that decides what the run *is* — the bag order, who
   spawns, which cards are offered, which column gets shelled — draws from this
   seeded stream, so a run can be replayed by its seed and a test can pin one
   down. Decoration (sparks, menu drift, the wobble in a sound) stays on
   Math.random on purpose: reproducing a spark is worth nothing, and feeding
   frame-rate-dependent effects from the same stream would make the same seed
   diverge the moment the frame rate did.
   ========================================================================= */
class RNG {
  constructor(seed) { this.reseed(seed); }
  reseed(s) { this.s = (s >>> 0) || 1; return this; }
  next() {                                   // mulberry32
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  int(n) { return Math.floor(this.next() * n); }
  range(a, b) { return a + this.next() * (b - a); }
}
/* ONE STREAM PER SOURCE, AND THE SHARED ONES RESEEDED PER WAVE.
   A versus match is two people playing the same seed, so everything both of
   them are promised to see identically has to be independent of what either of
   them actually does. A single stream cannot do that: buying a piece pulled a
   number out of the same sequence the next wave's roster came from, so the
   player who built more got different monsters out of the same seed.

   So: the bag is its own stream for the whole run (piece order is a promise
   about the run, not about a wave), and the three per-wave promises — who
   spawns, which cards are offered, which column gets shelled — are reseeded at
   the start of every wave from (match seed, wave number). Wave 12 is wave 12
   no matter how you got there. `local` is the leftover flavour that is nobody
   else's business, and it is allowed to drift. */
const STREAM = {
  seed:  1,
  bag:   new RNG(1),
  wave:  new RNG(1),
  cards: new RNG(1),
  siege: new RNG(1),
  local: new RNG(1),
};
/* a small integer hash, so (seed, n) lands somewhere unrelated to (seed, n+1) */
function mixSeed(a, b) {
  let h = ((a >>> 0) ^ 0x9e3779b9) >>> 0;
  h = Math.imul(h ^ (b >>> 0), 0x85ebca6b) >>> 0;
  h ^= h >>> 13;
  h = Math.imul(h, 0xc2b2ae35) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
/* Call BEFORE constructing the Game: the bag fills itself in the constructor. */
function seedRun(seed) {
  STREAM.seed = seed >>> 0;
  STREAM.bag.reseed(mixSeed(STREAM.seed, 0x0117));
  STREAM.local.reseed(mixSeed(STREAM.seed, 0x10ca1));
  seedWave(0);
}
function seedWave(w) {
  STREAM.wave.reseed(mixSeed(STREAM.seed, w * 3 + 1));
  STREAM.cards.reseed(mixSeed(STREAM.seed, w * 3 + 2));
  STREAM.siege.reseed(mixSeed(STREAM.seed, w * 3 + 3));
}
const newSeed = () => (Math.random() * 0xffffffff) >>> 0;
seedRun(newSeed());

/* ============================================================================
   SOUND. Everything is synthesised on the fly — no files, no loading, works
   offline. Each turret gets a voice you can name out loud: the coil goes
   "poop", the burner goes "pshhh", the mortar goes "thump". The throttle is
   the important part: twenty turrets firing at once must not turn to mush,
   so every source has a minimum gap and stacked voices duck each other.
   ========================================================================= */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.comp = null;
    this.vol = STORE.num('vol', 0.55, 0, 1);
    this.muted = STORE.bool('muted', false);
    this.gaps = {};        // per-key cooldown clock
    this.recent = [];      // timestamps, for polyphony ducking
    this.noiseBuf = null;
  }

  /* Browsers only allow audio after a gesture — wire this to the first one. */
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.comp = this.ctx.createDynamicsCompressor();
      this.comp.threshold.value = -16;
      this.comp.knee.value = 22;
      this.comp.ratio.value = 9;
      this.comp.attack.value = 0.003;
      this.comp.release.value = 0.18;
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : this.vol;
      this.master.connect(this.comp);
      this.comp.connect(this.ctx.destination);
      this.noiseBuf = this._makeNoise();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  _makeNoise() {
    const len = Math.floor(this.ctx.sampleRate * 0.7);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  setVolume(v) {
    this.vol = Math.max(0, Math.min(1, v));
    STORE.set('vol', this.vol);
    if (this.master) this.master.gain.value = this.muted ? 0 : this.vol;
  }
  toggleMute() {
    this.muted = !this.muted;
    STORE.set('muted', this.muted);
    if (this.master) this.master.gain.value = this.muted ? 0 : this.vol;
    return this.muted;
  }

  get on() { return !!this.ctx && !this.muted && this.vol > 0; }

  /* rate limit per sound key */
  _gate(key, gap) {
    if (!this.on) return false;
    const t = this.ctx.currentTime;
    if (this.gaps[key] !== undefined && t - this.gaps[key] < gap) return false;
    this.gaps[key] = t;
    return true;
  }

  /* when many voices land in the same instant, quiet them so the mix stays clean */
  _duck() {
    const t = this.ctx.currentTime;
    this.recent = this.recent.filter(x => t - x < 0.09);
    this.recent.push(t);
    const n = this.recent.length;
    return n <= 3 ? 1 : Math.max(0.26, 3 / n);
  }

  /* ---- primitive: a pitched blip with an optional sweep ---- */
  tone(o) {
    if (!this.on) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const dur = o.dur || 0.1;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.f2 !== undefined) {
      if (o.exp === false) osc.frequency.linearRampToValueAtTime(o.f2, t + dur);
      else osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + dur);
    }
    const peak = Math.max(0.0001, (o.vol !== undefined ? o.vol : 0.2) * (o.raw ? 1 : this._duck()));
    const atk = o.atk !== undefined ? o.atk : 0.005;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let node = osc;
    if (o.filter) {
      const bq = this.ctx.createBiquadFilter();
      bq.type = o.filter;
      bq.frequency.value = o.cutoff || 1200;
      bq.Q.value = o.q || 1;
      osc.connect(bq); node = bq;
    }
    node.connect(g);
    g.connect(this.master);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  /* ---- primitive: filtered noise — hisses, thumps, impacts ---- */
  noise(o) {
    if (!this.on) return;
    const t = this.ctx.currentTime + (o.delay || 0);
    const dur = o.dur || 0.15;
    const src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    src.playbackRate.value = o.rate || 1;
    const bq = this.ctx.createBiquadFilter();
    bq.type = o.filter || 'bandpass';
    bq.frequency.setValueAtTime(o.f, t);
    if (o.f2 !== undefined) bq.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + dur);
    bq.Q.value = o.q || 1;
    const g = this.ctx.createGain();
    const peak = Math.max(0.0001, (o.vol !== undefined ? o.vol : 0.2) * (o.raw ? 1 : this._duck()));
    const atk = o.atk !== undefined ? o.atk : 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(bq); bq.connect(g); g.connect(this.master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  chord(freqs, o) {
    freqs.forEach((f, i) => this.tone(Object.assign({}, o, { f, delay: (o.delay || 0) + i * (o.stagger || 0.05) })));
  }

  /* ======================= the actual voices ============================= */

  /* ---------------------------------------------------------------------
     A water droplet, synthesised: a sine whose pitch falls away fast under a
     soft attack. Heavy drops start low and ring longer; light ones are a tiny
     high "pip". No saw, no square, no click — nothing with a hard edge.
     --------------------------------------------------------------------- */
  drop(f, dur, vol, o) {
    o = o || {};
    const v = 0.94 + Math.random() * 0.12;           // never twice the same
    // pitch rises as the bubble collapses — this is what makes it a "pop"
    // rather than a drip, and it is why it stays soft when it repeats

      f: f * v, f2: f * (o.rise || 1.9) * v, type: 'sine',
      dur, vol, atk: o.atk || 0.0016,
      raw: o.raw,

  /* Turret fire. Think of someone blowing bubbles: same mouth, different size
     of bubble. Big barrels get low, slow, round pops; small ones get tiny high
     ones. Nothing here has an edge or a noise layer. */
  fire(type) {

      case 'I':
        if (!this._gate('fI', 0.07)) return;
        this.drop(190, 0.15, 0.12, { rise: 2.1 });
        break;
      /* CATAPULT — the biggest, fattest bloop of the lot */
      case 'O':
        if (!this._gate('fO', 0.09)) return;
        this.drop(140, 0.19, 0.13, { rise: 2.3, atk: 0.003 });
        break;
      /* BEEHIVE — the tiniest pip; it fires constantly, so keep it feather-light */
      case 'T':
        if (!this._gate('fT', 0.055)) return;
        this.drop(560, 0.05, 0.05, { rise: 1.75 });
        break;
      /* REPEATER — mid-sized bubble */
      case 'S':
        if (!this._gate('fS', 0.06)) return;
        this.drop(360, 0.075, 0.07, { rise: 1.9 });
        break;
      /* TAR KILN — thick and slow, like a bubble in something viscous */
      case 'J':
        if (!this._gate('fJ', 0.07)) return;
        this.drop(240, 0.13, 0.07, { rise: 1.45, atk: 0.004 });
        break;
      /* FIRE TOWER — a soft low pop with the faintest breath behind it */
      case 'L':
        if (!this._gate('fL', 0.085)) return;
        this.drop(300, 0.1, 0.06, { rise: 1.7 });
        this.noise({ f: 420, f2: 220, dur: 0.2, vol: 0.022, filter: 'lowpass', q: 0.8, atk: 0.05 });
        break;
    }
  }

  /* a shot connecting — a very small bubble, quieter than the shot itself */
  hit(armoured) {
    if (armoured) {
      if (!this._gate('hitA', 0.05)) return;
      this.drop(300, 0.05, 0.035, { rise: 1.4 });
      return;
    }
    if (!this._gate('hit', 0.035)) return;
    this.drop(430 + Math.random() * 90, 0.045, 0.042, { rise: 1.8 });
  }

  splash() {
    if (!this._gate('splash', 0.07)) return;
    this.noise({ f: 380, f2: 120, dur: 0.24, vol: 0.05, filter: 'lowpass', q: .8, atk: 0.016 });
    this.drop(120, 0.22, 0.12, { rise: 2.4, atk: 0.004 });
  }

  /* an enemy dying — soft wet "poof" */
  kill(big) {
    if (big) {
      this.noise({ f: 800, f2: 60, dur: 0.9, vol: 0.34, filter: 'lowpass', q: .8, atk: 0.01 });
      this.tone({ f: 120, f2: 32, type: 'sine', dur: 0.8, vol: 0.3 });
      this.tone({ f: 240, f2: 60, type: 'sawtooth', dur: 0.5, vol: 0.1, filter: 'lowpass', cutoff: 700 });
      return;
    }
    if (!this._gate('kill', 0.045)) return;
    const v = 0.85 + Math.random() * 0.3;
    this.noise({ f: 420 * v, f2: 150, dur: 0.16, vol: 0.032, filter: 'lowpass', q: .7, atk: 0.014 });
    this.drop(200 * v, 0.16, 0.075, { rise: 2.2 });
  }

  /* ---- construction ---- */
  lock() {
    this.noise({ f: 330, f2: 110, dur: 0.1, vol: 0.055, filter: 'lowpass', q: .8, atk: 0.008 });
    this.drop(150, 0.12, 0.1, { rise: 1.8 });
  }
  rotate() {
    if (!this._gate('rot', 0.04)) return;
    this.tone({ f: 760, f2: 900, type: 'sine', dur: 0.035, vol: 0.042, atk: 0.006 });
  }
  slide() {
    if (!this._gate('slide', 0.035)) return;
    this.tone({ f: 420, type: 'sine', dur: 0.022, vol: 0.022, atk: 0.005 });
  }
  buy() {
    this.drop(420, 0.09, 0.07, { rise: 1.6 });
    this.drop(620, 0.11, 0.06, { rise: 1.6, atk: 0.003 });
  }
  denied() {
    if (!this._gate('deny', 0.25)) return;
    this.drop(170, 0.14, 0.06, { rise: 0.72, atk: 0.006 });
  }
  hold() {
    this.tone({ f: 520, f2: 700, type: 'triangle', dur: 0.1, vol: 0.08 });
  }

  /* ---- the payoff: a completed row ---- */
  line(n) {
    const base = [0, 523.25, 587.33, 659.25, 783.99][Math.min(4, n)];
    const steps = [1, 1.25, 1.5, 2];
    this.chord(steps.slice(0, 2 + n).map(s => base * s),
      { type: 'triangle', dur: 0.42, vol: 0.14, stagger: 0.055, raw: true });
    this.noise({ f: 300, f2: 5200, dur: 0.5, vol: 0.1, filter: 'bandpass', q: .6, atk: 0.06, raw: true });
    this.tone({ f: 90, f2: 42, type: 'sine', dur: 0.45, vol: 0.2, raw: true });
    if (n >= 3) this.chord([base * 2, base * 2.5, base * 3],
      { type: 'sine', dur: 0.6, vol: 0.08, stagger: 0.07, delay: 0.18, raw: true });
  }

  repair() {
    this.tone({ f: 300, f2: 760, type: 'sine', dur: 0.3, vol: 0.13 });
    this.tone({ f: 600, f2: 1520, type: 'sine', dur: 0.25, vol: 0.05, delay: 0.04 });
  }

  /* ---- damage ---- */
  coreHit() {
    if (!this._gate('core', 0.1)) return;
    this.tone({ f: 95, f2: 40, type: 'sine', dur: 0.44, vol: 0.3, atk: 0.012, raw: true });
    this.tone({ f: 190, f2: 70, type: 'triangle', dur: 0.24, vol: 0.06, filter: 'lowpass', cutoff: 420, atk: 0.01 });
    this.noise({ f: 300, f2: 70, dur: 0.32, vol: 0.08, filter: 'lowpass', q: .7, atk: 0.012 });
  }
  blockHit() {
    if (!this._gate('bhit', 0.07)) return;
    this.noise({ f: 1500, f2: 500, dur: 0.07, vol: 0.055, filter: 'bandpass', q: 1.6 });
  }
  blockLost() {
    this.noise({ f: 560, f2: 110, dur: 0.34, vol: 0.1, filter: 'lowpass', q: .7, atk: 0.012 });
    this.drop(130, 0.22, 0.085, { rise: 2.0, atk: 0.004 });
  }
  breach() {
    this.noise({ f: 420, f2: 60, dur: 0.85, vol: 0.18, filter: 'lowpass', q: .8, atk: 0.03, raw: true });
    this.tone({ f: 140, f2: 38, type: 'triangle', dur: 0.75, vol: 0.12, filter: 'lowpass', cutoff: 380, atk: 0.02, raw: true });
  }
  overheatAlarm() {
    if (!this._gate('oh', 1.1)) return;
    this.tone({ f: 840, type: 'sine', dur: 0.12, vol: 0.045, atk: 0.02 });
    this.tone({ f: 840, type: 'sine', dur: 0.12, vol: 0.045, atk: 0.02, delay: 0.18 });
  }

  /* ---- wave rhythm ---- */
  waveStart(boss) {
    if (boss) {
      this.tone({ f: 150, f2: 74, type: 'sawtooth', dur: 1.1, vol: 0.2, filter: 'lowpass', cutoff: 700, raw: true });
      this.tone({ f: 75, f2: 37, type: 'sine', dur: 1.3, vol: 0.26, raw: true });
      this.noise({ f: 200, f2: 60, dur: 1.2, vol: 0.1, filter: 'lowpass', q: .6, raw: true });
      return;
    }
    this.tone({ f: 440, f2: 330, type: 'triangle', dur: 0.38, vol: 0.11, filter: 'lowpass', cutoff: 900, atk: 0.02, raw: true });
    this.tone({ f: 330, f2: 247, type: 'triangle', dur: 0.5, vol: 0.11, filter: 'lowpass', cutoff: 800, atk: 0.02, delay: 0.32, raw: true });
  }
  waveDone() {
    this.chord([523.25, 659.25, 783.99, 1046.5],
      { type: 'triangle', dur: 0.55, vol: 0.12, stagger: 0.07, raw: true });
  }
  sector() {
    this.chord([392, 523.25, 659.25],
      { type: 'sine', dur: 1.1, vol: 0.1, stagger: 0.16, raw: true });
  }
  gameOver() {
    this.tone({ f: 330, f2: 55, type: 'triangle', dur: 1.7, vol: 0.14, filter: 'lowpass', cutoff: 620, atk: 0.05, raw: true });
    this.tone({ f: 165, f2: 28, type: 'sine', dur: 2.1, vol: 0.2, raw: true });
    this.noise({ f: 400, f2: 50, dur: 1.9, vol: 0.08, filter: 'lowpass', q: .5, raw: true });
  }

  /* the bell: a real bronze ring, several partials decaying together */
  bell() {
    [1, 2.02, 2.98, 4.1, 5.4].forEach((m, i) => this.tone({
      f: 262 * m, type: 'sine', dur: 2.4 - i * 0.28,
      vol: 0.16 / (1 + i * 0.9), atk: 0.004, raw: true,
    }));
    this.tone({ f: 131, f2: 120, type: 'sine', dur: 2.6, vol: 0.12, raw: true });
  }
  /* the rally horn: two rising notes, warm and breathy */
  rally() {
    this.tone({ f: 196, f2: 262, type: 'triangle', dur: 0.5, vol: 0.14, atk: 0.03, filter: 'lowpass', cutoff: 1100, raw: true });
    this.tone({ f: 262, f2: 392, type: 'triangle', dur: 0.7, vol: 0.13, atk: 0.03, filter: 'lowpass', cutoff: 1300, delay: 0.26, raw: true });
  }
  /* a shell coming down: a falling whistle you can react to */
  incoming() {
    this.tone({ f: 1500, f2: 380, type: 'sine', dur: 2.2, vol: 0.075, atk: 0.14, raw: true });
  }
  /* a shell batted away by the bell: a hard clang, then a whoosh going up */
  deflect() {
    this.tone({ f: 1180, f2: 1560, type: 'triangle', dur: 0.2, vol: 0.12, atk: 0.002, raw: true });
    this.tone({ f: 640, f2: 1280, type: 'sine', dur: 0.5, vol: 0.06, atk: 0.01, delay: 0.05, raw: true });
    this.noise({ f: 2400, f2: 5200, dur: 0.35, vol: 0.06, filter: 'bandpass', q: 1.2, atk: 0.01, delay: 0.04, raw: true });
  }
  impact() {
    this.noise({ f: 700, f2: 70, dur: 0.55, vol: 0.2, filter: 'lowpass', q: .8, atk: 0.008, raw: true });
    this.tone({ f: 110, f2: 34, type: 'sine', dur: 0.5, vol: 0.24, raw: true });
  }

  /* ---- interface ---- */
  ui() {
    if (!this._gate('ui', 0.04)) return;
    this.tone({ f: 620, f2: 780, type: 'triangle', dur: 0.045, vol: 0.06 });
  }
  step() {
    this.tone({ f: 700, type: 'sine', dur: 0.09, vol: 0.09 });
    this.tone({ f: 1050, type: 'sine', dur: 0.12, vol: 0.07, delay: 0.06 });
  }
}

    sl_3: 'At the ford the ground is stone and they move faster on it. Their carriers came up too: machines that build more machines, in the field, while you watch.',
    sl_4: 'Last hill. Everything that walked out of that ridge is walking at us at once. If the Heart goes out here, there is no valley left to come back to.',
    sc_no: n => 'Ground ' + String(n).padStart(2, '0'), sc_go: 'Continue',

    m_eyebrow: 'A valley settlement \u00b7 the last quiet summer',
    m_tagline: 'Hold the meadow',
    m_lore: 'For as long as anyone kept count, the valley kept to itself: block folk, tall grass, a spring that never ran dry.<br><br>Then the machines came over the western ridge: harvesters out of a year that has not happened yet, built to take a living valley apart and carry it off as stock. They do not hurry. They do not stop.<br><br>You are the builder. You have the old yard, a heap of timber and stone, and the Heart at your back. Whatever you raise has to hold until morning.',

    st_1_t: 'The Ridge', st_1_d: 'The western wall of the valley. Nothing crossed it in living memory until the machines did, and they cross it every night now, always in the same place, as if reading off a map drawn somewhere else.',
    st_2_t: 'The Heart', st_2_d: 'The old spring at the centre of the settlement, and whatever lives under it. The valley grows outward from the Heart. So does everything you build. If it goes out, the ground stops being ours.',
    st_3_t: 'The Yard', st_3_d: 'Cabin frames have been cast in four-block sections here for six generations, because that is the size two people can carry. Nobody redesigned the moulds for a war. You build with what the yard makes.',
    st_4_t: 'The load line', st_4_d: 'Stack past the red line and the timbers below start to split. There is no fix for it: the ground in this valley only bears so much. Build wide, and the wall stands. Build tall, and it comes down on its own.',
    st_5_t: 'Closing a row', st_5_d: 'Finish a row all the way across and the defence closes on itself. The Heart answers: a shockwave runs the field and knocks the machines flat. You keep the scrap it shakes loose.',
    st_6_t: 'Salvage', st_6_d: 'Plate, gearing and wire stripped off the wrecks. Worked back into your own buildings it makes every one of them hit harder and stand longer. Permanent: the only thing the harvest cannot take back.',
    st_7_t: 'The harvest', st_7_d: 'They are not an army and there is nobody to negotiate with. They are a process, running a long way from home, and it has reached this valley in its proper turn.',
    st_8_t: 'Upkeep', st_8_d: 'At the end of every wave the settlement sends you a bill, and it is the larger of two numbers: what your buildings cost to keep standing, or roughly a quarter of the stock sitting in your yard. The second one is why an empty field with a full purse still pays. It is not a punishment; it is the reason stock never piles into the tens of thousands. If you cannot cover the bill, the difference comes out of the buildings.',
    st_9_t: 'How long is the night', st_9_d: 'There are four grounds and no fifth. Hold the last hill and the machines keep coming anyway, bigger each time, for as long as you can stand it: there is no ending to reach and nothing to win, only a wave you did not hold. The ledger keeps the longest one, and nothing else: a run lives in the tab it is played in, so closing it ends it. The browser will ask before it lets that happen by accident.',

    d_grunt: 'The common walker. Slow, patient, endless. Comes until a wall stops it, then takes the wall apart square by square.',
    d_runner: 'Four legs and a scanner. Reaches your wall before most buildings have finished reloading.',
    d_flyer: 'Lifts straight over the wall and makes for the Heart. Height means nothing to it, only reach does.',
    d_brute: 'A siege frame. Slow enough to shoot at length, heavy enough that one swing takes a whole building with it.',
    d_sapper: 'Carries a charge and no instruction to survive. Walks into your wall and opens a hole in it.',
    d_bulwark: 'Advances behind a plated screen. Bolts and stones skid off the front: set it alight instead; fire does not care about plate.',
    d_spawnling: 'Field-printed and barely finished. Harmless one at a time, which is never how they arrive.',
    d_hive: 'A mobile foundry. Wrecking it does not end it: it splits open and what it was printing walks out.',
    d_mender: 'Hangs back and welds the others together mid-advance. Kill it first and the whole line gets softer.',
    d_gunship: 'Plated flier. Armour and altitude in one machine: the combination a ground wall has no answer for.',
    d_colossus: 'Something the harvest sent on purpose. It does not test the wall. It removes it.',

    dm_I: 'A heavy bolt thrower. Hardest single hit and the longest reach in the yard. It just needs time to crank back between shots.',
    dm_O: 'Throws a stone that bursts on landing. Modest damage, but it catches everything in the splash, so it wants a crowd.',
    dm_T: 'Bees. Constant, weak, relentless, feeble alone and vicious in a bank of four. The fastest thing you can raise.',
    dm_S: 'A twin crossbow on a frame. No specialty, no weakness, never a wasted square.',
    dm_J: 'Pours hot tar. Barely scratches plate, but everything it touches crawls: put it where it buys the other buildings an extra volley.',
    dm_L: 'Throws burning pitch. Short reach, and the burn ignores plate entirely: this is your answer to shieldframes.',
    dm_Z: 'Draws from the Heart\u2019s spring. Fires at nothing; heals the Heart and mends the buildings around it. One in the middle keeps a whole wall standing.',
