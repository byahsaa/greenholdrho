    st_5_t: '\u0421\u043e\u043c\u043a\u043d\u0443\u0442\u044b\u0439 \u0440\u044f\u0434', st_5_d: '\u0414\u043e\u0432\u0435\u0434\u0438 \u0440\u044f\u0434 \u0434\u043e \u043a\u043e\u043d\u0446\u0430, \u0438 \u043e\u0431\u043e\u0440\u043e\u043d\u0430 \u0437\u0430\u043c\u044b\u043a\u0430\u0435\u0442\u0441\u044f \u0441\u0430\u043c\u0430 \u043d\u0430 \u0441\u0435\u0431\u044f. \u0421\u0435\u0440\u0434\u0446\u0435 \u043e\u0442\u0432\u0435\u0447\u0430\u0435\u0442: \u043f\u043e \u043f\u043e\u043b\u044e \u0438\u0434\u0451\u0442 \u0443\u0434\u0430\u0440\u043d\u0430\u044f \u0432\u043e\u043b\u043d\u0430 \u0438 \u0432\u0430\u043b\u0438\u0442 \u043c\u0430\u0448\u0438\u043d\u044b. \u0412\u0441\u0451, \u0447\u0442\u043e \u0441 \u043d\u0438\u0445 \u0441\u0442\u0440\u044f\u0445\u043d\u0443\u043b\u043e, \u043e\u0441\u0442\u0430\u0451\u0442\u0441\u044f \u0442\u0435\u0431\u0435.',
    st_6_t: '\u041b\u043e\u043c', st_6_d: '\u0411\u0440\u043e\u043d\u044f, \u0448\u0435\u0441\u0442\u0435\u0440\u043d\u0438 \u0438 \u043f\u0440\u043e\u0432\u043e\u0434, \u0441\u043d\u044f\u0442\u044b\u0435 \u0441 \u0440\u0430\u0437\u0431\u0438\u0442\u044b\u0445 \u043c\u0430\u0448\u0438\u043d. \u0412\u043b\u043e\u0436\u0435\u043d\u043d\u044b\u0435 \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u0432 \u0442\u0432\u043e\u0438 \u043f\u043e\u0441\u0442\u0440\u043e\u0439\u043a\u0438, \u043e\u043d\u0438 \u0434\u0435\u043b\u0430\u044e\u0442 \u043a\u0430\u0436\u0434\u0443\u044e \u043a\u0440\u0435\u043f\u0447\u0435 \u0438 \u0437\u043b\u0435\u0435. \u041d\u0430\u0432\u0441\u0435\u0433\u0434\u0430: \u0435\u0434\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u043e\u0435, \u0447\u0442\u043e \u0436\u0430\u0442\u0432\u0430 \u043d\u0435 \u043c\u043e\u0436\u0435\u0442 \u0437\u0430\u0431\u0440\u0430\u0442\u044c \u043e\u0431\u0440\u0430\u0442\u043d\u043e.',
    st_7_t: '\u0416\u0430\u0442\u0432\u0430', st_7_d: '\u042d\u0442\u043e \u043d\u0435 \u0430\u0440\u043c\u0438\u044f, \u0438 \u0434\u043e\u0433\u043e\u0432\u0430\u0440\u0438\u0432\u0430\u0442\u044c\u0441\u044f \u043d\u0435 \u0441 \u043a\u0435\u043c. \u042d\u0442\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0441, \u0437\u0430\u043f\u0443\u0449\u0435\u043d\u043d\u044b\u0439 \u0434\u0430\u043b\u0435\u043a\u043e \u043e\u0442\u0441\u044e\u0434\u0430, \u0438 \u0434\u043e \u044d\u0442\u043e\u0439 \u0434\u043e\u043b\u0438\u043d\u044b \u043e\u043d \u0434\u043e\u0448\u0451\u043b \u043f\u0440\u043e\u0441\u0442\u043e \u043f\u043e \u043e\u0447\u0435\u0440\u0435\u0434\u0438.',
    st_8_t: 'Содержание', st_8_d: 'В конце каждой волны поселение выставляет счёт, и это большее из двух чисел: сколько стоит держать твои постройки или примерно четверть запаса, лежащего во дворе. Второе \u2014 причина, по которой пустое поле с полным кошельком всё равно платит. Это не наказание, а то, почему припас никогда не вырастает в десятки тысяч. Не хватит на счёт \u2014 разницу заберут постройки.',
    st_9_t: 'Сколько длится ночь', st_9_d: 'Рубежей четыре, пятого нет. Удержишь последний холм \u2014 машины всё равно пойдут дальше, каждый раз крупнее, пока хватит тебя. Финала нет и выиграть нечего: есть только волна, которую ты не удержал. Книга хранит самую долгую — и больше ничего: забег живёт в той вкладке, где идёт, и закроешь её — забега нет. Случайно это сделать не даст браузер: он переспросит.',

    d_grunt: '\u041e\u0431\u044b\u0447\u043d\u044b\u0439 \u0448\u0430\u0433\u0430\u044e\u0449\u0438\u0439. \u041c\u0435\u0434\u043b\u0435\u043d\u043d\u044b\u0439, \u0442\u0435\u0440\u043f\u0435\u043b\u0438\u0432\u044b\u0439, \u0431\u0435\u0441\u043a\u043e\u043d\u0435\u0447\u043d\u044b\u0439. \u0418\u0434\u0451\u0442, \u043f\u043e\u043a\u0430 \u043d\u0435 \u0443\u043f\u0440\u0451\u0442\u0441\u044f \u0432 \u0441\u0442\u0435\u043d\u0443, \u0430 \u043f\u043e\u0442\u043e\u043c \u0440\u0430\u0437\u0431\u0438\u0440\u0430\u0435\u0442 \u0441\u0442\u0435\u043d\u0443 \u043a\u0432\u0430\u0434\u0440\u0430\u0442 \u0437\u0430 \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u043e\u043c.',
    d_runner: '\u0427\u0435\u0442\u044b\u0440\u0435 \u043d\u043e\u0433\u0438 \u0438 \u0441\u043a\u0430\u043d\u0435\u0440. \u0414\u043e\u0431\u0435\u0433\u0430\u0435\u0442 \u0434\u043e \u0441\u0442\u0435\u043d\u044b \u0440\u0430\u043d\u044c\u0448\u0435, \u0447\u0435\u043c \u0431\u043e\u043b\u044c\u0448\u0438\u043d\u0441\u0442\u0432\u043e \u043f\u043e\u0441\u0442\u0440\u043e\u0435\u043a \u0443\u0441\u043f\u0435\u0432\u0430\u0435\u0442 \u043f\u0435\u0440\u0435\u0437\u0430\u0440\u044f\u0434\u0438\u0442\u044c\u0441\u044f.',
    d_flyer: '\u041f\u043e\u0434\u043d\u0438\u043c\u0430\u0435\u0442\u0441\u044f \u043f\u0440\u044f\u043c\u043e \u043d\u0430\u0434 \u0441\u0442\u0435\u043d\u043e\u0439 \u0438 \u0438\u0434\u0451\u0442 \u043a \u0421\u0435\u0440\u0434\u0446\u0443. \u0412\u044b\u0441\u043e\u0442\u0430 \u0434\u043b\u044f \u043d\u0435\u0433\u043e \u043d\u0435 \u0437\u043d\u0430\u0447\u0438\u0442 \u043d\u0438\u0447\u0435\u0433\u043e, \u0437\u043d\u0430\u0447\u0438\u0442 \u0442\u043e\u043b\u044c\u043a\u043e \u0440\u0430\u0434\u0438\u0443\u0441.',
    d_brute: '\u041e\u0441\u0430\u0434\u043d\u0430\u044f \u0440\u0430\u043c\u0430. \u0414\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u044b\u0439, \u0447\u0442\u043e\u0431\u044b \u0440\u0430\u0441\u0441\u0442\u0440\u0435\u043b\u0438\u0432\u0430\u0442\u044c \u0434\u043e\u043b\u0433\u043e, \u0438 \u0434\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e \u0442\u044f\u0436\u0451\u043b\u044b\u0439, \u0447\u0442\u043e\u0431\u044b \u043e\u0434\u043d\u0438\u043c \u0443\u0434\u0430\u0440\u043e\u043c \u0443\u043d\u0435\u0441\u0442\u0438 \u043f\u043e\u0441\u0442\u0440\u043e\u0439\u043a\u0443 \u0446\u0435\u043b\u0438\u043a\u043e\u043c.',
    d_sapper: '\u041d\u0435\u0441\u0451\u0442 \u0437\u0430\u0440\u044f\u0434 \u0438 \u043d\u0435 \u043d\u0435\u0441\u0451\u0442 \u043f\u0440\u0438\u043a\u0430\u0437\u0430 \u0443\u0446\u0435\u043b\u0435\u0442\u044c. \u0414\u043e\u0445\u043e\u0434\u0438\u0442 \u0434\u043e \u0441\u0442\u0435\u043d\u044b \u0438 \u043e\u0442\u043a\u0440\u044b\u0432\u0430\u0435\u0442 \u0432 \u043d\u0435\u0439 \u0434\u044b\u0440\u0443.',
    d_bulwark: '\u0418\u0434\u0451\u0442 \u0437\u0430 \u0431\u0440\u043e\u043d\u0435\u0449\u0438\u0442\u043e\u043c. \u0411\u043e\u043b\u0442\u044b \u0438 \u043a\u0430\u043c\u043d\u0438 \u0441\u043a\u043e\u043b\u044c\u0437\u044f\u0442 \u043f\u043e \u043b\u043e\u0431\u043e\u0432\u043e\u0439, \u043f\u043e\u0434\u043e\u0436\u0433\u0438 \u0435\u0433\u043e: \u043e\u0433\u043d\u044e \u043d\u0430 \u0431\u0440\u043e\u043d\u044e \u043f\u043b\u0435\u0432\u0430\u0442\u044c.',
    d_spawnling: '\u041d\u0430\u043f\u0435\u0447\u0430\u0442\u0430\u043d \u0432 \u043f\u043e\u043b\u0435 \u0438 \u0435\u0434\u0432\u0430 \u0434\u043e\u0434\u0435\u043b\u0430\u043d. \u041f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u0431\u0435\u0437\u043e\u0431\u0438\u0434\u0435\u043d, \u043d\u043e \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u043e\u043d\u0438 \u043d\u0435 \u043f\u0440\u0438\u0445\u043e\u0434\u044f\u0442.',
    d_hive: '\u041f\u0435\u0440\u0435\u0434\u0432\u0438\u0436\u043d\u0430\u044f \u043b\u0438\u0442\u0435\u0439\u043d\u0430\u044f. \u0420\u0430\u0437\u0431\u0438\u0442\u044c \u0435\u0451, \u043d\u0435 \u0437\u043d\u0430\u0447\u0438\u0442 \u0437\u0430\u043a\u043e\u043d\u0447\u0438\u0442\u044c: \u043e\u043d\u0430 \u0440\u0430\u0441\u043a\u0440\u044b\u0432\u0430\u0435\u0442\u0441\u044f, \u0438 \u043d\u0430\u0440\u0443\u0436\u0443 \u0432\u044b\u0445\u043e\u0434\u0438\u0442 \u0442\u043e, \u0447\u0442\u043e \u043e\u043d\u0430 \u043f\u0435\u0447\u0430\u0442\u0430\u043b\u0430.',
    d_mender: '\u0414\u0435\u0440\u0436\u0438\u0442\u0441\u044f \u043f\u043e\u0437\u0430\u0434\u0438 \u0438 \u0441\u0432\u0430\u0440\u0438\u0432\u0430\u0435\u0442 \u043e\u0441\u0442\u0430\u043b\u044c\u043d\u044b\u0445 \u043f\u0440\u044f\u043c\u043e \u043d\u0430 \u0445\u043e\u0434\u0443. \u0423\u0431\u0435\u0439 \u043f\u0435\u0440\u0432\u044b\u043c, \u0438 \u0432\u0441\u044f \u043b\u0438\u043d\u0438\u044f \u0441\u0442\u0430\u043d\u0435\u0442 \u043c\u044f\u0433\u0447\u0435.',
    d_gunship: '\u0411\u0440\u043e\u043d\u0438\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0439 \u043b\u0435\u0442\u0443\u043d. \u0411\u0440\u043e\u043d\u044f \u0438 \u0432\u044b\u0441\u043e\u0442\u0430 \u0432 \u043e\u0434\u043d\u043e\u0439 \u043c\u0430\u0448\u0438\u043d\u0435: \u0442\u043e \u0441\u043e\u0447\u0435\u0442\u0430\u043d\u0438\u0435, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u043e\u0435 \u0443 \u043d\u0430\u0437\u0435\u043c\u043d\u043e\u0439 \u0441\u0442\u0435\u043d\u044b \u043e\u0442\u0432\u0435\u0442\u0430 \u043d\u0435\u0442.',
    d_colossus: '\u0422\u043e, \u0447\u0442\u043e \u0436\u0430\u0442\u0432\u0430 \u043f\u0440\u0438\u0441\u043b\u0430\u043b\u0430 \u043d\u0430\u043c\u0435\u0440\u0435\u043d\u043d\u043e. \u041e\u043d \u043d\u0435 \u043f\u0440\u043e\u0432\u0435\u0440\u044f\u0435\u0442 \u0441\u0442\u0435\u043d\u0443. \u041e\u043d \u0435\u0451 \u0443\u0431\u0438\u0440\u0430\u0435\u0442.',

    dm_I: '\u0422\u044f\u0436\u0451\u043b\u044b\u0439 \u0431\u043e\u043b\u0442\u043e\u043c\u0451\u0442. \u0421\u0430\u043c\u044b\u0439 \u0441\u0438\u043b\u044c\u043d\u044b\u0439 \u043e\u0434\u0438\u043d\u043e\u0447\u043d\u044b\u0439 \u0443\u0434\u0430\u0440 \u0438 \u0441\u0430\u043c\u044b\u0439 \u0434\u0430\u043b\u044c\u043d\u0438\u0439 \u0440\u0430\u0434\u0438\u0443\u0441 \u0432\u043e \u0434\u0432\u043e\u0440\u0435, \u043d\u0443\u0436\u043d\u043e \u043b\u0438\u0448\u044c \u0432\u0440\u0435\u043c\u044f, \u0447\u0442\u043e\u0431\u044b \u0432\u0437\u0432\u0435\u0441\u0442\u0438 \u0435\u0433\u043e \u043e\u0431\u0440\u0430\u0442\u043d\u043e.',

let LANG = (() => { try { return localStorage.getItem('hf_lang') || 'en'; } catch (e) { return 'en'; } })();
function T(key, ...args) {
  const v = (I18N[LANG] && I18N[LANG][key]) !== undefined ? I18N[LANG][key] : I18N.en[key];
  return typeof v === 'function' ? v(...args) : v;
}

/* Training has to name controls the player actually has. Taught SPACE and W,
   someone on a phone finishes the nine steps knowing not one of their own
   buttons, which is worse than no training at all. The steps that name a key
   carry a `_touch` twin; the ones that name none are the same text either way
   and fall straight through. */
function TT(key, ...args) {
  const alt = key + '_touch';
  /* Look the twin up rather than calling it: several of these strings are
     functions that take a countdown, and asking T() whether one exists would
     run it with no arguments and hand back a sentence with an `undefined` in
     the middle of it. */
  const has = touchCtl &&
    (((I18N[LANG] && I18N[LANG][alt]) !== undefined) || I18N.en[alt] !== undefined);
  return T(has ? alt : key, ...args);
}

/* ----------------------------------------------------------------------------
   ROTATION STATES. Built once per shape: turn the cell list a quarter turn,
   pull it back into the corner, then seat it in a fixed NxN box so every state
   of a piece shares one origin. Rotating is an index step after that, which
   makes four turns the identity by construction and keeps the piece pivoting
   around the same square instead of walking sideways across the field.
   -------------------------------------------------------------------------- */
const ROTATIONS = (() => {
  const out = {};
  const norm = cells => {
    const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
    return cells.map(([x, y]) => [x - mx, y - my]).sort((a, b) => a[1] - b[1] || a[0] - b[0]);
  };
  for (const k in SHAPES) {
    const turns = [norm(SHAPES[k])];
    for (let i = 1; i < 4; i++) turns.push(norm(turns[i - 1].map(([x, y]) => [y, -x])));
    const N = Math.max(...turns.map(cs =>
      Math.max(Math.max(...cs.map(c => c[0])), Math.max(...cs.map(c => c[1]))))) + 1;
    out[k] = turns.map(cs => {
      const w = Math.max(...cs.map(c => c[0])) + 1, h = Math.max(...cs.map(c => c[1])) + 1;
      const ox = Math.floor((N - w) / 2), oy = Math.floor((N - h) / 2);
      return cs.map(([x, y]) => [x + ox, y + oy]);
    });
  }
  return out;
})();

/* Records tab of the codex — the lore, in reading order. */
const STORY = ['st_1', 'st_2', 'st_3', 'st_4', 'st_5', 'st_6', 'st_7', 'st_8', 'st_9'];

/* Hostile entries stay locked until you have actually met the thing. Survive
   an encounter and the field data persists across runs. */
const CODEX = {
  seen: STORE.seenMap('codex', Object.keys(ENEMIES)),
  unlock(id, wave) {
    if (this.seen[id]) return false;
    this.seen[id] = Math.max(1, wave || 1);
    STORE.set('codex', this.seen);
    return true;
  },
};
function sectorOf(w) {
  let s = SECTORS[0];
  for (const c of SECTORS) if (w >= c.from) s = c;
  return s;
}
function isBossWave(w) {
  return w >= CFG.bossFrom && (w - CFG.bossFrom) % CFG.bossEvery === 0;
}

function waveComposition(w) {
  const pool = [];
  for (const k in ENEMIES) {
    const d = ENEMIES[k];
    if (d.boss || w < d.from) continue;
    // weight ramps up after a type joins, then plateaus — early types thin out
    const age = w - d.from;
    let weight = Math.min(10, 2.5 + age * 0.55);
    if (d.id === 'grunt') weight = Math.max(3, 10 - w * 0.25);
    if (d.id === 'spawnling') weight *= 1.4;
    pool.push([k, weight]);
  }
  return pool.length ? pool : [['grunt', 1]];
}
function weightedPick(pairs) {
  let total = 0; for (const p of pairs) total += p[1];
  let r = STREAM.wave.next() * total;
  for (const p of pairs) { r -= p[1]; if (r <= 0) return p[0]; }
  return pairs[0][0];
}

/* ========================================================================= */

const canvas = document.getElementById('game');
/* The opponent's field in a versus match. Nothing draws into it until a match
   starts, but resize() needs the handle from the first frame. */
const ghostCanvas = document.getElementById('ghost');
/* `let`, not `const`: the codex briefly repoints this at a thumbnail canvas so
   the enemy art can draw itself into the entry previews. */
let ctx = canvas.getContext('2d');
let CW = 800, CH = 480, DPR = 1;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const stage = document.getElementById('stage');
  placeCoach(stage);
  /* Measure where the field actually starts and give it the rest of the
     window. The old floor of 340px was taller than what was left on a 320x568
     phone or a short desktop window, so the field began below the fold and the
     wall and the buttons that build it ended up on different screens. */
  const stageBox = stage.getBoundingClientRect();
  const top = stageBox.top + window.scrollY;
  /* The window stopped being the field's floor the moment the phone layout
     started painting the controls underneath it. Add up whatever the flex
     order put below the stage and take that off as well, or the page grows a
     scrollbar and the bottom row of buttons falls off the screen. Measured
     rather than listed, so it keeps up with a row that folds, hides or wraps.
     Nothing sits below the stage on a desktop and the sum comes out zero. */
  const app = stage.parentElement;
  const appStyle = getComputedStyle(app);
  const gap = parseFloat(appStyle.rowGap) || 0;
  let below = 0;
  for (const el of app.children) {
    if (el === stage) continue;
    const pos = getComputedStyle(el).position;
    if (pos === 'absolute' || pos === 'fixed') continue;   // the screen-reader lines
    const r = el.getBoundingClientRect();
    if (r.height > 0 && r.top > stageBox.top) below += r.height + gap;
  }
  /* the old constant was 18: the .app bottom padding, the stage's two borders,
     and a pixel of slack either side of them. Only the padding moves now, and
     it carries the bottom safe-area inset with it. */
  const floor = (parseFloat(appStyle.paddingBottom) || 0) + 4;
  const h = Math.max(200, Math.min(window.innerHeight - top - below - floor, 1000));
  CH = h;
  // In a versus match there are two of these and they share the width, so each
  // one is sized from its own column rather than from the stage.
  sizeCanvas(canvas, h);
  if (ghostCanvas && !ghostCanvas.parentElement.hidden) sizeCanvas(ghostCanvas, h);
  CW = canvas.parentElement.clientWidth;
}
/* The coach card floats in the field's empty top-right sky when there is room
   for it (a desktop or tablet), and drops to a row under the field when there
   is not (a phone, a short window). Floating costs the field no height; the
   row costs a little but never covers the yard on a field too narrow to have
   an empty corner. Moving it is idempotent, so the ResizeObserver this sets
   off lands on a no-op. */
const COACH_FLOAT_MIN_W = 720, COACH_FLOAT_MIN_H = 520;
function placeCoach(stage) {
  const tut = document.getElementById('tut');
  if (!tut || !stage) return;
  const float = stage.clientWidth >= COACH_FLOAT_MIN_W && window.innerHeight >= COACH_FLOAT_MIN_H;
  if (tut.classList.contains('float') !== float) tut.classList.toggle('float', float);
  if (float && tut.parentElement !== stage) stage.appendChild(tut);
  else if (!float && tut.parentElement === stage) stage.after(tut);
}
/* Where the floating coach starts, in canvas pixels, or null when it is not
   floating. The banner uses it to step out of the card's way. */
function coachFloatLeft() {
  const tut = document.getElementById('tut');
  if (!tut || tut.hidden || !tut.classList.contains('float')) return null;
  const cr = canvas.getBoundingClientRect(), tr = tut.getBoundingClientRect();
  if (tr.top - cr.top > CH * 0.45) return null;      // not up where the banner is
  return tr.left - cr.left;
}
/* The part of the field the training camera may frame things in, in canvas
   pixels: below the piece strip, and clear of the floating card. The card sits
   top right, so the bigger of "left of it" and "under it" wins. */
let coachAreaMemo = null, coachAreaAt = -1;
function coachFreeArea() {
  // asked several times a frame; the card only moves on layout, so measure once
  const now = performance.now();
  if (coachAreaMemo && now - coachAreaAt < 8) return coachAreaMemo;
  coachAreaAt = now;
  const a = coachAreaMemo = { l: 10, t: 80, r: CW - 10, b: CH - 10 };
  const tut = document.getElementById('tut');
  if (tut && !tut.hidden && tut.classList.contains('float')) {
    const cr = canvas.getBoundingClientRect(), tr = tut.getBoundingClientRect();
    const left = tr.left - cr.left - 16, under = tr.bottom - cr.top + 14;
    const byLeft = Math.max(0, left - a.l) * (a.b - a.t);
    const byUnder = (a.r - a.l) * Math.max(0, a.b - Math.max(a.t, under));
    if (byLeft >= byUnder) a.r = Math.min(a.r, left); else a.t = Math.max(a.t, under);
  }
  return a;
}
/* assigning canvas.width clears it, so only touch what actually changed */
function sizeCanvas(cv, h) {
  const w = cv.parentElement.clientWidth;
  if (cv.style.height !== h + 'px') cv.style.height = h + 'px';
  const pw = Math.round(w * DPR), ph = Math.round(h * DPR);
  if (cv.width !== pw) cv.width = pw;
  if (cv.height !== ph) cv.height = ph;
}
window.addEventListener('resize', resize);
/* The HUD is text, and text reflows: an ability subtitle wrapping onto a second
   line, or a longer translation, moves the field down after resize() has
   already decided how tall it may be. Watch the page chrome rather than
   guessing when it settles. */
if (window.ResizeObserver) {
  new ResizeObserver(() => resize()).observe(document.querySelector('.app'));
}

/* ---------------------------- helpers ----------------------------------- */
function hexA(h, a) {
  const n = parseInt(h.slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
/* f < 1 darkens, f > 1 lightens. Memoised — the enemy art calls it per frame. */
const _shades = {};
function shade(h, f) {
  const key = h + '|' + f;
  let v = _shades[key];
  if (v) return v;
  const n = parseInt(h.slice(1), 16);
  const c = x => Math.max(0, Math.min(255, Math.round(x * f)));
  v = 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
  _shades[key] = v;
  return v;
}
/* Ink for a material colour. The palette names materials — honey, field stone,
   springwater — and those are the right colours for the artwork, but several of
   them land between 2:1 and 3:1 as text on parchment. This darkens one until it
   clears 4.5:1 against the card it will be printed on. The paint is unchanged:
   the swatch and the drawing keep it, only the label gets the darkened value. */
const _inks = {};
function _lum(r, g, b) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);
}
function ink(hex, bg) {
  bg = bg || '#f7f1df';                       // the card stock behind the text
  const key = hex + '|' + bg;
  if (_inks[key]) return _inks[key];
  const bn = parseInt(bg.slice(1), 16);
  const L = _lum((bn >> 16) & 255, (bn >> 8) & 255, bn & 255);
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  let f = 1;
  for (; f > 0.12; f -= 0.02) if ((L + 0.05) / (_lum(r * f, g * f, b * f) + 0.05) >= 4.5) break;
  const c = x => Math.round(Math.max(0, Math.min(255, x * f)));
  return (_inks[key] = 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')');
}

/* one jointed limb — base → knee → foot, `lift` raises the knee mid-stride */
function limb(bx, by, fx, fy, lift, w) {
  ctx.lineWidth = w;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(bx, by);
  ctx.quadraticCurveTo((bx + fx) / 2 + lift * .35, (by + fy) / 2 - Math.abs(lift), fx, fy);
  ctx.stroke();
  ctx.lineCap = 'butt';
}
/* Canvas cannot read CSS custom properties — the stacks live here as strings. */
const FD = 'Oswald, "Arial Narrow", Impact, sans-serif';
const FM = '"JetBrains Mono", ui-monospace, Consolas, monospace';

/* blend two #rrggbb colours; t = 0 gives a, t = 1 gives b */
function mixHex(a, b, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
const ease = (dt, rate) => 1 - Math.exp(-dt * rate);

/* ---------------------------- 7-bag ------------------------------------- */
class Bag {
  constructor() { this.q = []; this.fill(); this.fill(); }
  fill() {
    const t = ['I','O','T','S','J','L','Z'];
    for (let i = t.length - 1; i > 0; i--) {
      const j = STREAM.bag.int(i + 1);
      [t[i], t[j]] = [t[j], t[i]];
    }
    this.q.push(...t);
  }
  peek(n) { while (this.q.length < n + 2) this.fill(); return this.q.slice(0, n); }
  next() { while (this.q.length < 4) this.fill(); return this.q.shift(); }
}

/* The simulation, in the order one step runs them. Kept as a list so the step
   can stop at whichever one changes the state of the run (see Game.update). */
const SYSTEMS = ['updateWaves', 'updatePiece', 'updateTurrets', 'updateShots',
                 'updateEnemies', 'updateOverheat', 'updateWear', 'updateBarrages',
                 'updateMedics'];

/* ============================== GAME ==================================== */
class Game {
  constructor() {
    this.bag = new Bag();
    this.grid = Array.from({ length: 34 }, () => Array(CFG.cols).fill(null));
    this.enemies = [];
    this.shots = [];
    this.fx = [];
    this.texts = [];

    this.coins = CFG.startCoins;
    this.maxHp = CFG.coreHp;
    this.hp = CFG.coreHp;
    this.wave = 0;
    this.armory = 0;
    this.kills = 0;
    this.linesCleared = 0;

    this.phase = 'prep';
    this.prepTimer = CFG.prepTime;
    this.waveTotal = 0;
    this.toSpawn = 0;
    this.spawnTimer = 0;
    this.bossPending = false;
    this.sector = SECTORS[0];

    this.piece = null;
    this.visY = 0;
    this.hold = null;
    this.holdUsed = false;
    this.fallTimer = 0;
    this.lockTimer = 0;
    this.softHold = 0;

    this.repairUses = 0;
    this.paused = false;
    this.gameOver = false;
    this.gridDirty = false;   // a collapse may have closed a row; settleGrid decides
    this.lastWave = null;    // receipt for the wave just held
    this.taken = [];         // upgrade cards chosen this run, in order
    this.tutorial = null;      // set by startTutorial(); null in a normal run
    /* per-run modifiers, set by the between-wave choices */
    this.mods = { dmg: 1, cost: 1, wear: 1, bounty: 1, speed: 1, mend: 1, tech: 0, upkeep: 1 };
    /* hand-operated defences: the bell and the rally horn */
    this.cdBell = 0;
    this.cdRally = 0;
    this.rally = 0;
    /* incoming siege shots, each with a column and a countdown */
    this.barrages = [];
    this.barrageTimer = 0;
    this.deflects = [];      // shells the bell knocked away, still flying off
    this.deflected = 0;
    this.hurtFlash = 0;
    this.placed = 0;
    this.rotations = 0;
    this.moves = 0;
    this.repairs = 0;
    /* Tallies the training script watches, so a step about the bell can wait
       for the bell to actually ring instead of for a button labelled "next".
       Nothing else reads them. */
    this.stored = 0;
    this.bells = 0;
    this.rallies = 0;
    this.mends = 0;
    this.shake = 0;
    this.emp = 0;
    this.overheat = 0;
    this.medics = 0;
    this.banner = null;
    this.time = 0;
    this.rift = 0; this.riftFlash = 0;

    this._uid = 0;            // per-run machine ids, for the versus mirror
    this.das = 0; this.dasDir = 0;
    this.scale = 1; this.viewScale = 0; this.originX = 0; this.originY = 0;
  }

  /* --------------------------- Economy --------------------------------- */
  get blockCount() {
    let n = 0;
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) if (this.grid[y][x]) n++;
    return n;
  }
  get buyCost() {
    const over = Math.max(0, this.blockCount - CFG.buyFree);
    const raw = CFG.buyBase + Math.floor(over / 4) * CFG.buyPerFour;
    return Math.max(6, Math.round(raw * (this.mods && this.mods.cost ? this.mods.cost : 1)));
  }
  get repairAmount() { return this.maxHp * CFG.repairPct; }
  get repairCost() {
    return Math.round(this.repairAmount * CFG.repairCoinPerHp * (1 + this.repairUses * CFG.repairStep));
  }
  get dmgMult() {
    const m = this.mods && this.mods.dmg ? this.mods.dmg : 1;
    return (1 + CFG.armoryDmgK * Math.sqrt(this.armory)) * m;
  }
  get blockMaxHp() { return CFG.blockHp + this.armory * CFG.blockHpPerTech; }

  /* ---------------------------------------------------------------------
     ONE GATE FOR EVERY COMMAND. A paused game used to stop only the falling
     piece: move, heal, mend and "call wave" all still ran, so the pause was a
     way to build and heal with the clock stopped. Every player-issued command
     asks this first, and syncUI disables exactly the same buttons off it, so
     nothing on screen looks available while doing nothing.
     ------------------------------------------------------------------- */
  get live() {
    return !this.gameOver && !this.paused && APP === 'game' && !storyOpen && !choiceOpen;
  }
  /* the training script decides when the countdown is allowed to matter */
  get canCallWave() {
    if (!this.live || this.phase !== 'prep') return false;
    if (this.tutorial) return !!TUT_STEPS[this.tutorial.step].live;
    return true;
  }
  /* waves actually held — dying inside wave 9 is a hold of 8 */
  get wavesHeld() { return Math.max(0, this.wave - (this.phase === 'fight' ? 1 : 0)); }

  repair() {
    if (!this.live || this.hp >= this.maxHp) return;
    const cost = this.repairCost;
    if (this.coins < cost) { SFX.denied(); return; }
    SFX.repair();
    this.repairs = (this.repairs || 0) + 1;
    this.coins -= cost;
    this.repairUses++;
    // what the Heart actually took, not what was on offer: healing 379 -> 380
    // used to float "+95" and leave the player unable to trust any number
    const healed = Math.min(this.maxHp - this.hp, this.repairAmount);
    this.hp += healed;
    this.floatText(-CFG.coreW / 2, CFG.coreH * 0.7, '+' + Math.round(healed), '#5d9c41');
    this.burst(-CFG.coreW / 2, CFG.coreH / 2, '#5d9c41', 16);
  }

  /* --------------------------- Pieces ---------------------------------- */
  topRow() {
    for (let y = this.grid.length - 1; y >= 0; y--)
      if (this.grid[y].some(c => c)) return y;
    return -1;
  }

  spawnPiece(type) {
    const cy = this.topRow() + 3;
    this.ensureRows(cy + 5);
    this.piece = { type, rot: 0, cells: ROTATIONS[type][0].map(c => c.slice()), cx: 3, cy };
    this.visY = cy + 1.1;
    this.fallTimer = CFG.fallInterval;
    this.lockTimer = 0;
  }

  get stackHeight() { return this.topRow() + 1; }
  get nearLimit() { return this.stackHeight >= CFG.overheatRow - 1; }

  buyPiece() {
    if (!this.live || this.piece) return;
    const cost = this.buyCost;
    if (this.coins < cost) { SFX.denied(); return; }
    this.coins -= cost;
    this.holdUsed = false;
    this.spawnPiece(this.bag.next());
    SFX.buy();
  }

  holdPiece() {
    if (!this.piece || this.holdUsed || !this.live) return;
    const cur = this.piece.type;
    if (this.hold) { const h = this.hold; this.hold = cur; this.spawnPiece(h); }
    else { this.hold = cur; this.spawnPiece(this.bag.next()); }
    this.holdUsed = true;
    this.stored++;
    SFX.hold();
  }

  move(dx) {
    if (!this.piece || !this.live) return false;
    if (this.valid(this.piece.cells, this.piece.cx + dx, this.piece.cy)) {
      this.piece.cx += dx;
      if (this.lockTimer > 0) this.lockTimer = CFG.lockDelay;
      this.moves = (this.moves || 0) + 1;
      SFX.slide();
      return true;
    }
    return false;
  }

  stepDown() {
    if (!this.piece || !this.live) return;
    if (this.valid(this.piece.cells, this.piece.cx, this.piece.cy - 1)) {
      this.piece.cy--;
      this.fallTimer = CFG.fallInterval;
    }
  }

  rotate(dir) {
    if (!this.piece || this.piece.type === 'O' || !this.live) return;
    const p = this.piece;
    const next = (p.rot + (dir === -1 ? 3 : 1)) % 4;
    const cells = ROTATIONS[p.type][next];
    for (const [kx, ky] of KICKS) {
      if (!this.valid(cells, p.cx + kx, p.cy + ky)) continue;
      p.cells = cells.map(c => c.slice());
      p.rot = next;
      p.cx += kx; p.cy += ky;
      if (ky) this.visY += ky;
      if (this.lockTimer > 0) this.lockTimer = CFG.lockDelay;
      this.rotations = (this.rotations || 0) + 1;
      SFX.rotate();
      return;
    }
  }

  valid(cells, cx, cy) {
    return cells.every(([dx, dy]) => {
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= CFG.cols || y < 0) return false;
      if (y < this.grid.length && this.grid[y][x]) return false;
      return true;
    });
  }

  ghostY() {
    if (!this.piece) return 0;
    let y = this.piece.cy;
    while (this.valid(this.piece.cells, this.piece.cx, y - 1)) y--;
    return y;
  }

  hardDrop() {
    if (!this.piece || !this.live) return;
    this.piece.cy = this.ghostY();
    this.lock();
  }

  ensureRows(n) {
    while (this.grid.length <= n + 2) this.grid.push(Array(CFG.cols).fill(null));
  }

  lock() {
    const p = this.piece;
    const def = TURRETS[p.type];
    p.cells.forEach(([dx, dy]) => {
      const x = p.cx + dx, y = p.cy + dy;
      this.ensureRows(y);
      this.grid[y][x] = {
        type: p.type, color: def.color,
        hp: this.blockMaxHp, max: this.blockMaxHp,
        cd: ((x * 7 + y * 13) % 11) / 11 * (def.cd || 1),
        flash: 0, muzzle: 0, strain: 0, off: 0,
        seed: ((x * 31 + y * 17) % 97) / 97,
      };
      this.burst(x * CFG.cell + 16, y * CFG.cell + 16, def.color, 5);
    });
    this.piece = null;
    this.holdUsed = false;
    this.shake = Math.max(this.shake, 3);
    SFX.lock();
    this.placed = (this.placed || 0) + 1;
    this.checkLines();
    this.enforceCeiling();
  }

  enforceCeiling() {
    let collapsed = 0;
    for (let y = this.grid.length - 1; y >= CFG.heightLimit; y--) {
      for (let x = 0; x < CFG.cols; x++) {
        if (!this.grid[y][x]) continue;
        this.burst(x * CFG.cell + 16, y * CFG.cell + 16, '#bf4433', 8);
        this.grid[y][x] = null;
        collapsed++;
      }
    }
    if (!collapsed) return;
    this.shake = 14;
    SFX.breach();
    this.setBanner(T('breach', collapsed), '#bf4433');
  }

  /* ------------------- Rows = the bonus engine -------------------------- */
  checkLines() {
    let cleared = 0;
    for (let y = 0; y < this.grid.length; y++) {
      if (this.grid[y].every(c => c !== null)) {
        for (let x = 0; x < CFG.cols; x++)
          this.burst(x * CFG.cell + 16, y * CFG.cell + 16, '#ffffff', 6);
        this.grid.splice(y, 1);
        this.grid.push(Array(CFG.cols).fill(null));
        for (let yy = y; yy < this.grid.length; yy++)
          for (let x = 0; x < CFG.cols; x++)
            if (this.grid[yy][x]) this.grid[yy][x].off = (this.grid[yy][x].off || 0) + 1;
        cleared++; y--;
      }
    }
    if (!cleared) return;

    this.linesCleared += cleared;
    this.armory += cleared;
    this.refitBlocks();

    const coins = Math.round(CFG.lineCoins * Math.pow(cleared, 1.6));
    const hpGain = CFG.lineMaxHp * cleared;
    const blast = CFG.lineBlast * cleared * this.dmgMult;

    this.coins += coins;
    this.maxHp += hpGain;
    this.hp = Math.min(this.maxHp, this.hp + hpGain);

    for (let i = this.enemies.length - 1; i >= 0; i--) this.hurt(this.enemies[i], blast, i, true);

    this.shake = 14 + cleared * 4;
    SFX.line(cleared);
    this.setBanner(T('volley')[cleared] + T('lineGain', coins, hpGain, this.armory),
      cleared >= 3 ? '#cf8a24' : '#3c7d52');
    this.emp = 0.45;
  }

  /* Salvage raises what a building can take. It used to raise it only for the
     next thing built, so the stretch of wall that earned the salvage never got
     the benefit. Every standing block is refitted instead, and it keeps the
     damage it has already taken — the ceiling rises, the dent stays. */
  refitBlocks() {
    const max = this.blockMaxHp;
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (!c || c.max === max) continue;
        const missing = Math.max(0, c.max - c.hp);
        c.max = max;
        c.hp = Math.max(1, max - missing);
      }
  }

  /* --------------------------- Destruction ------------------------------ */
  damageBlock(x, y, amount) {
    const c = this.grid[y] && this.grid[y][x];
    if (!c) return;
    c.hp -= amount;
    c.flash = 0.18;
    SFX.blockHit();
    if (c.hp <= 0) this.destroyBlock(x, y);
  }

  destroyBlock(x, y) {
    const c = this.grid[y][x];
    if (!c) return;
    SFX.blockLost();
    this.burst(x * CFG.cell + 16, y * CFG.cell + 16, c.color, 12);
    for (let yy = y; yy < this.grid.length - 1; yy++) {
      this.grid[yy][x] = this.grid[yy + 1][x];
      if (this.grid[yy][x]) this.grid[yy][x].off = (this.grid[yy][x].off || 0) + 1;
    }
    this.grid[this.grid.length - 1][x] = null;
    this.shake = Math.max(this.shake, 5);
    // the column just dropped: a row that closed because of it is still a
    // closed row, so mark the grid for the sweep at the end of the step
    this.gridDirty = true;
  }

  /* Remove everything the last batch of damage killed. Damage is written to the
     block objects first and removal happens here, in a column-wise pass that
     re-checks the row it just emptied — a single bottom-up loop walks straight
     past the block that slid down into a row it had already visited, which is
     how a block could survive a wear tick it should have taken. */
  cullDead() {
    for (let x = 0; x < CFG.cols; x++)
      for (let y = 0; y < this.grid.length; y++) {
        const c = this.grid[y][x];
        if (c && c.hp <= 0) { this.destroyBlock(x, y); y--; }
      }
  }

  /* Rows closed by a collapse rather than by a placement are resolved once per
     step, after every system has had its say — recursing into checkLines from
     inside a grid mutation is how you end up splicing an array you are in. */
  settleGrid() {
    if (!this.gridDirty || !this.live) return;
    this.gridDirty = false;
    this.checkLines();
  }

  /* ----------------------------- Waves ---------------------------------- */
  startWave(early) {
    if (this.phase !== 'prep' || this.gameOver) return;
    /* `early` means a person asked for it — the bar, Enter, the HUD. That goes
       through the same gate as every other command, and in training it is the
       script that says when. The countdown expiring calls this with early
       false from inside update(), which has already checked. */
    if (early && !this.canCallWave) { SFX.denied(); return; }
    const bonus = this.earlyBonus;
    this.wave++;
    // reseed the shared streams for the wave that is about to run, so its
    // roster, cards and shelling are the same for anyone on this seed
    seedWave(this.wave);
    this.waveTotal = CFG.waveCount(this.wave);
    this.toSpawn = this.waveTotal;
    this.spawnTimer = 0.6;
    this.phase = 'fight';
    this.bossPending = isBossWave(this.wave);

    const sec = sectorOf(this.wave);
    const entered = sec !== this.sector || this.wave === 1;
    this.sector = sec;

    if (entered) this.setBanner(T('newSector', T(sec.key)), sec.accent);
    else if (this.bossPending) this.setBanner(T('bossIncoming', T('e_colossus')), '#a8341f');
    else if (early) this.setBanner(T('waveEarly', this.wave, bonus), '#cf8a24');
    else this.setBanner(T('waveN', this.wave), '#bf4433');

    if (early) this.coins += bonus;

    // A new chapter stops the clock and reads you the log. Story lands between
    // waves, never on top of one — the tutorial runs its own script instead,
    // and in a match nobody gets to stop for a chapter break.
    if (entered && !this.tutorial && !VS.active) showSectorCard(sec);
    else SFX.waveStart(this.bossPending);
  }

  get earlyBonus() {
    return Math.round((14 + (this.wave + 1) * 5) * (Math.max(0, this.prepTimer) / CFG.prepTime));
  }
  get enemiesLeft() { return this.toSpawn + this.enemies.length; }
  get boss() { return this.enemies.find(e => e.def.boss) || null; }

  spawnEnemy(forceType, atX, atY) {
    const type = forceType || weightedPick(waveComposition(this.wave));
    const d = ENEMIES[type];
    const hp = CFG.enemyHp(this.wave) * d.hpMul;
    const ds = CFG.enemyDmgScale(this.wave);
    /* A machine from the tear starts just BEHIND it, its front edge on the
       tear line, and walks out: drawEnemies hides whatever is still on the far
       side, so it steps through instead of swelling up out of thin air. The
       draw from the wave stream stays one call, so both halves of a versus
       match still roll the same numbers. */
    const x = atX !== undefined ? atX
      : CFG.cols * CFG.cell + CFG.approach + d.r * .95 + STREAM.wave.range(0, 14);
    const y = atY !== undefined ? atY : (d.flying ? STREAM.wave.range(2.6, 6.2) * CFG.cell : d.r);
    this.enemies.push({
      // the opponent's screen matches machines by id between packets; without
      // one it would have to guess by array position and jump on every kill
      uid: ++this._uid,
      type, def: d, hp, max: hp,
      speed: d.speed * CFG.enemySpeedScale(this.wave) * (this.mods.speed || 1),
      blockDmg: (d.blockDmg || 0) * ds,
      coreDmg: d.coreDmg * ds,
      x, y,
      atkTimer: 0, slow: 0, burn: 0, burnDps: 0, pending: 0, flash: 0,
      spawnT: 0,   // 0 while it is still coming through the tear
      // printed in the field by a carrier rather than walking out of the tear:
      // those still grow in where they stand
      split: atX !== undefined,
      healTimer: 0, phase: STREAM.local.range(0, 6.3),
      walk: STREAM.local.range(0, 6.3),   // stride phase — advanced by actual travel
      seen: false,
    });
    /* Children count towards the wave they came out of. Without this the
       denominator stayed at the original head count while the numerator grew,
       and the progress bar ran backwards past zero the moment a carrier split. */
    if (atX !== undefined && this.phase === 'fight') this.waveTotal++;
    // a hive splitting mid-field is not the tear opening, so it gets no flash
    if (atX === undefined) {
      this.riftFlash = d.boss ? 1.5 : 1;
      // the sparks fly off the tear itself, not off the hidden machine behind it
      this.burst(CFG.cols * CFG.cell + CFG.approach, y, '#aebbc8', d.boss ? 16 : 5);
    }
    if (!CODEX.seen[type]) { CODEX.unlock(type, this.wave); }
  }

  /* what a direct hit actually takes off once plate has eaten its share; the
     target picker reserves this figure, so its arithmetic matches the hit */
  armourAdjust(e, amount) {
    return e.def.armor ? Math.max(amount * 0.2, amount - e.def.armor) : amount;
  }

  /* armour blunts direct hits but never damage-over-time, so burn stays useful */
  hurt(e, amount, idx, armoured) {
    if (armoured) amount = this.armourAdjust(e, amount);
    e.hp -= amount;
    e.flash = 0.1;
    if (e.hp <= 0) {
      // the wreck pays this, so this is the number that floats off it: the
      // label used to print the raw table value and ignore both the global
      // rate and whatever the haul cards had done to it
      const paid = Math.round(e.def.bounty * CFG.bountyK * (this.mods.bounty || 1));
      this.coins += paid;
      this.kills++;
      SFX.kill(e.def.boss);
      this.burst(e.x, e.y, e.def.color, e.def.boss ? 46 : 14);
      this.floatText(e.x, e.y + 14, '+' + paid, '#cf8a24');
      const i = idx !== undefined ? idx : this.enemies.indexOf(e);
      if (i >= 0) this.enemies.splice(i, 1);
      if (e.def.splits) {   // a hive bursts into spawnlings
        for (let k = 0; k < e.def.splits; k++)
          this.spawnEnemy('spawnling', e.x + (STREAM.local.next() - .5) * 26, e.y);
      }
      if (e.def.boss) this.shake = 26;
      return true;
    }
    return false;
  }

  hitCore(amount) {
    /* Training cannot be lost. The practice wave is the first time anybody
       sees a machine reach the Heart, and a tutorial that answers that with a
       game-over screen has taught the player exactly one thing: don't press
       Training. The Heart bottoms out at one and says so. */
    if (this.tutorial) {
      amount = Math.min(amount, Math.max(0, this.hp - 1));
      if (amount <= 0) {
        this.shake = Math.max(this.shake, 7);
        this.hurtFlash = Math.max(this.hurtFlash, .6);
        if (!this._saidSafe) { this._saidSafe = true; this.setBanner(T('tut_safe'), '#3c7d52'); }
        return;
      }
    }
    this.hp -= amount;
    this.shake = Math.max(this.shake, 9);
    SFX.coreHit();
    this.hurtFlash = 1;
    this.burst(0, CFG.coreH * 0.4, '#bf4433', 12);
    this.floatText(-10, CFG.coreH * 0.6, '-' + Math.round(amount), '#bf4433');
    if (this.hp <= 0) { this.hp = 0; this.endRun(); }
  }

  endRun() {
    if (this.gameOver) return;
    this.gameOver = true;
    this.piece = null;      // nothing is falling any more; the run is finished
    this.dasDir = 0;
    SFX.gameOver();
    recordBest(this);
  }

  /* ------------------------------ FX ------------------------------------ */
  burst(x, y, color, n) {
    if (this.fx.length > 340) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 90;
      this.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .35 + Math.random() * .35, t: 0, color, r: 1 + Math.random() * 2 });
    }
  }
  floatText(x, y, text, color) {
    if (this.texts.length > 40) return;
    this.texts.push({ x, y, text, color, t: 0, life: .9 });
  }
  setBanner(text, color) { this.banner = { text, color, t: 0, life: 2.2 }; this.say(text); }
  /* The banner is painted on the canvas, which reaches nobody who is not
     looking straight at it. Everything it says goes to the live region too. */
  say(text) { if (text && typeof ui !== 'undefined' && ui.fieldEvent) ui.fieldEvent.textContent = text; }

  /* ============================ UPDATE ================================== */
  update(dt) {
    if (this.gameOver || this.paused) {
      /* A stopped game is stopped. The clock, the particles, the settle
         animation and the banner's two seconds all hold where they are —
         they used to keep running, so a pause was a moving picture of a
         frozen game. Only the shake and the hit flash wind down, so the
         screen comes to rest instead of freezing mid-jolt. */
      this.shake *= Math.pow(0.0025, dt);
      if (this.hurtFlash > 0) this.hurtFlash -= dt * 3.4;
      return;
    }
    this.time += dt;
    this.shake *= Math.pow(0.0025, dt);
    if (this.emp > 0) this.emp -= dt;
    const riftWant = this.phase !== 'fight' ? .22 : this.toSpawn > 0 ? 1 : .55;
    this.rift += (riftWant - this.rift) * ease(dt, 2.2);
    if (this.riftFlash > 0) this.riftFlash -= dt * 2.6;
    if (this.hurtFlash > 0) this.hurtFlash -= dt * 3.4;
    this.updateFx(dt);
    this.updateSettle(dt);
    if (this.banner) { this.banner.t += dt; if (this.banner.t > this.banner.life) this.banner = null; }

    if (this.cdBell > 0) this.cdBell = Math.max(0, this.cdBell - dt);
    if (this.cdRally > 0) this.cdRally = Math.max(0, this.cdRally - dt);
    if (this.rally > 0) this.rally = Math.max(0, this.rally - dt);

    /* Any of these can end the run or put a card on screen, and when one does
       the step is over. Running the rest anyway is how a killing blow ended
       with the Heart back above zero (the Springs healed it after the fact)
       and how the wall carried on mending under an open upgrade card. */
    for (const s of SYSTEMS) {
      this[s](dt);
      if (!this.live) break;
    }
    this.settleGrid();
  }

  updateMedics(dt) {
    if (!this.medics || this.hp >= this.maxHp) return;
    this.hp = Math.min(this.maxHp, this.hp + TURRETS.Z.heal * Math.sqrt(this.medics) * dt);
  }

  /* SIEGE FIRE. From CFG.barrageFrom on, something behind the line lobs shells
     at the wall. You get a marked column and a couple of seconds: ring the
     bell to scatter their aim, or accept the hole and rebuild. */
  updateBarrages(dt) {
    for (let i = this.deflects.length - 1; i >= 0; i--) {
      const d = this.deflects[i];
      d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vy -= 260 * dt; d.rot += dt * 14;
      if (d.t > d.life) this.deflects.splice(i, 1);
    }
    for (let i = this.barrages.length - 1; i >= 0; i--) {
      const b = this.barrages[i];
      if (b.dead) { this.barrages.splice(i, 1); continue; }
      b.t -= dt;
      if (b.t <= 0) { this.landBarrage(b); this.barrages.splice(i, 1); }
    }
    if (this.phase !== 'fight' || this.wave < CFG.barrageFrom || this.gameOver) return;
    this.barrageTimer -= dt;
    if (this.barrageTimer > 0) return;
    this.barrageTimer = CFG.barrageGap(this.wave);

    const cols = [];
    for (let x = 0; x < CFG.cols; x++) if (this.grid[0][x]) cols.push(x);
    if (!cols.length) return;
    this.barrages.push({ col: cols[STREAM.siege.int(cols.length)], t: CFG.barrageWarn, dead: false });
    SFX.incoming();
  }

  landBarrage(b) {
    const col = b.col;
    this.shake = 16;
    SFX.impact();
    const wx = col * CFG.cell + CFG.cell / 2;
    let top = -1;
    for (let y = this.grid.length - 1; y >= 0; y--) if (this.grid[y][col]) { top = y; break; }
    if (top < 0) { this.burst(wx, 6, '#8a7a5a', 14); return; }
    this.burst(wx, top * CFG.cell + 16, '#8a7a5a', 20);
    /* Damage, not demolition. A shell that removed a block outright left a
       hole in the middle of the stack and wrecked the puzzle; this batters the
       top of the column hard and leaves you a repair bill instead of a gap. */
    for (let i = 0; i < 3; i++) {
      const y = top - i;
      if (y < 0 || !this.grid[y] || !this.grid[y][col]) continue;
      const c = this.grid[y][col];
      const hit = c.max * (i === 0 ? 0.62 : i === 1 ? 0.34 : 0.16);
      c.hp -= hit;
      c.flash = 0.22;
      // it can still finish off something already nearly gone
      if (c.hp <= 0) this.destroyBlock(col, y);
    }
  }

  /* Where a falling shell is on screen: it drops down its marked column over
     the warning time, so the bell has something visible to hit. */
  shellAt(b) {
    const k = 1 - Math.max(0, b.t) / (b.warn || CFG.barrageWarn);
    // it starts under the piece strip, not behind it, and lands on the stack
    const y0 = 92, y1 = Math.max(y0 + 40, this.originY - 30);
    return { k, x: this.sx(b.col * CFG.cell + CFG.cell / 2), y: y0 + k * (y1 - y0) };
  }

  drawBarrages() {
    this.drawDeflects();
    if (!this.barrages.length) return;
    for (const b of this.barrages) {
      const x = this.sx(b.col * CFG.cell), w = CFG.cell * this.scale;
      const k = 1 - Math.max(0, b.t) / (b.warn || CFG.barrageWarn);
      // a steady marker still says "this column", it just stops strobing
      const blink = calm ? .6 : .35 + Math.abs(Math.sin(this.time * (7 + k * 9))) * .45;
      ctx.fillStyle = 'rgba(191,68,51,' + (0.1 + k * 0.16) * blink + ')';
      ctx.fillRect(x, 0, w, this.originY);
      ctx.strokeStyle = 'rgba(191,68,51,' + blink + ')';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 1, 0, w - 2, this.originY);
      // a chevron sliding down the column under the shell as it falls
      const my = this.shellAt(b).y + 12;
      ctx.fillStyle = 'rgba(191,68,51,' + (0.55 + blink * 0.45) + ')';
      ctx.beginPath();
      ctx.moveTo(x + w / 2, my + 11);
      ctx.lineTo(x + w / 2 - 8, my);
      ctx.lineTo(x + w / 2 + 8, my);
      ctx.closePath(); ctx.fill();
      // the shell itself, riding the marker down: an iron ball with a lit fuse
      const sh = this.shellAt(b);
      this.drawShell(sh.x, sh.y, Math.max(6, 8.5 * this.scale * this.readK), 0, 1, true);
    }
  }

  drawShell(x, y, r, rot, a, falling) {
    ctx.save();
    ctx.globalAlpha = a;
    // a smoke streak above it while it drops (a batted shell has its own streak)
    if (falling) {
      ctx.strokeStyle = 'rgba(90,80,70,.28)'; ctx.lineWidth = r * .9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y - r * 3.2); ctx.lineTo(x, y - r * .6); ctx.stroke();
      ctx.lineCap = 'butt';
    }
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.fillStyle = '#3a3634';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fill();
    ctx.strokeStyle = 'rgba(191,68,51,.9)'; ctx.lineWidth = Math.max(1.2, r * .18);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.28)';
    ctx.beginPath(); ctx.arc(-r * .32, -r * .32, r * .3, 0, 6.3); ctx.fill();
    // fuse and its spark
    ctx.strokeStyle = '#7a5a35'; ctx.lineWidth = Math.max(1, r * .16);
    ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .35, -r * 1.45); ctx.stroke();
    const flick = calm ? 1 : .7 + Math.random() * .6;
    ctx.fillStyle = 'rgba(255,190,70,.95)';
    ctx.beginPath(); ctx.arc(r * .38, -r * 1.5, r * .26 * flick, 0, 6.3); ctx.fill();
    ctx.restore();
  }

  /* Shells the bell knocked out of the air, spinning away back over the ridge. */
  drawDeflects() {
    for (const d of this.deflects) {
      const a = Math.max(0, 1 - d.t / d.life);
      const x = this.sx(d.x), y = this.sy(d.y);
      // the streak it leaves on the way out
      ctx.strokeStyle = 'rgba(255,214,120,' + (.55 * a).toFixed(3) + ')';
      ctx.lineWidth = Math.max(2, d.r * .7); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - d.vx * this.scale * .08, y + d.vy * this.scale * .08);
      ctx.stroke(); ctx.lineCap = 'butt';
      this.drawShell(x, y, d.r * (1 - .35 * d.t / d.life), d.rot, a);
    }
  }

  /* THE BELL. One good pull rings the whole valley: every machine on the
     field takes a hit, and any siege machine lining up a shot loses its aim.
     Free to use — the only cost is that it is not ready again for a while. */
  ringBell() {
    if (!this.live) return;
    if (this.cdBell > 0) { SFX.denied(); return; }
    this.cdBell = CFG.bellCd;
    this.bells++;
    const dmg = CFG.bellDmg * this.dmgMult;
    for (let i = this.enemies.length - 1; i >= 0; i--) this.hurt(this.enemies[i], dmg, i, true);
    // knock the survivors back a step and scatter their aim
    for (const e of this.enemies) {
      e.x += 16;
      e.slow = Math.max(e.slow, 0.8); e.slowPow = 0.5;
    }
    /* Every shell in the air is batted away: it leaves as a visible shot back
       towards the ridge, so the player sees what the bell just did. */
    let knocked = 0;
    for (const b of this.barrages) {
      if (b.dead) continue;
      b.dead = true;
      knocked++;
      const sh = this.shellAt(b);
      const wx = b.col * CFG.cell + CFG.cell / 2;
      const wy = Math.max(CFG.cell, (this.originY - sh.y) / this.scale);
      // a flat arc back over the run-up towards the ridge it came from
      this.deflects.push({ x: wx, y: wy, vx: 440 + STREAM.local.range(0, 80), vy: 170 + STREAM.local.range(0, 50),
                           t: 0, life: 1.3, rot: 0, r: Math.max(6, 8.5 * this.scale * this.readK) });
      this.burst(wx, wy, '#f0c050', 14);
      this.floatText(wx, wy + 18, T('deflected'), '#cf8a24');
    }
    this.deflected += knocked;
    if (knocked) SFX.deflect();
    this.emp = 0.45;
    this.shake = 16;
    SFX.bell();
    this.setBanner(T(knocked ? 'shellKnocked' : 'bellRung'), '#cf8a24');
  }

  /* THE RALLY HORN. Everyone works the cranks twice as fast for a few seconds. */
  soundRally() {
    if (!this.live) return;
    if (this.cdRally > 0) { SFX.denied(); return; }
    this.cdRally = CFG.rallyCd;
    this.rallies++;
    this.rally = CFG.rallyTime;
    SFX.rally();
    this.setBanner(T('rallyUp'), '#5d9c41');
  }

  /* Buildings wear down while a wave is on the field. The Spring mends them,
     and so does the mend button — doing neither costs you the wall. */
  updateWear(dt) {
    if (this.phase !== 'fight') return;
    const rate = CFG.wearPct * (this.mods && this.mods.wear !== undefined ? this.mods.wear : 1);
    if (rate <= 0) return;
    // damage first, remove after: destroying mid-pass slides the column down
    // and the loop skips whatever lands in the row it has already been through
    for (let y = 0; y < this.grid.length; y++) {
      const row = this.grid[y];
      for (let x = 0; x < CFG.cols; x++) {
        const c = row[x];
        if (c) c.hp -= c.max * rate * dt;
      }
    }
    this.cullDead();
  }

  /* What the settlement costs at the end of a wave. Two bills, and you pay the
     larger of them: what the buildings cost to keep, or a flat cut of the stock
     sitting in the yard. The second is why an empty field with a full purse is
     still billed, and it is what stops income cards snowballing. Both halves
     are named in the HUD and in the wave tally, so the number can be checked. */
  get upkeepParts() {
    const k = 1 + this.wave * CFG.upkeepWaveK;
    const perBlock = Math.round(this.blockCount * CFG.upkeepPerBlock * k * (this.mods.upkeep || 1));
    const onHoard = Math.round(this.coins * CFG.hoardTax);
    return { perBlock, onHoard, due: Math.max(perBlock, onHoard) };
  }
  get upkeep() { return this.upkeepParts.due; }

  /* Bill the builder. If the stock will not cover it, the shortfall comes out
     of the buildings themselves — an unpaid settlement falls apart. */
  payUpkeep() {
    const due = this.upkeep;
    if (due <= 0) return { due: 0, short: 0 };
    if (this.coins >= due) {
      this.coins -= due;
      this.floatText(CFG.cols * CFG.cell * .5, CFG.cell * 3, '-' + due + '\u25c6', '#a06a2a');
      return { due, short: 0 };
    }
    const short = due - this.coins;
    this.coins = 0;
    const frac = Math.min(0.5, short / Math.max(1, due) * 0.5);
    // same two-phase rule as wear: bill every block, then sweep the dead
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (!c) continue;
        c.hp -= c.max * frac;
        c.flash = 0.25;
      }
    this.cullDead();
    this.shake = 14;
    SFX.breach();
    // the banner is composed once, by the caller: an "unpaid" warning that gets
    // overwritten by "wave held" two lines later tells the player nothing
    return { due, short };
  }

  /* total price of putting every building back to full */
  get mendCost() {
    let missing = 0;
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (c) missing += c.max - c.hp;
      }
    return Math.ceil(missing * CFG.mendCoinPerHp);
  }

  mendWall() {
    if (!this.live) return;
    const cost = this.mendCost;
    if (cost <= 0) return;
    if (this.coins < cost) { SFX.denied(); return; }
    this.coins -= cost;
    this.mends++;
    let n = 0;
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (!c || c.hp >= c.max) continue;
        c.hp = c.max;
        c.flash = 0.2;
        n++;
        if (n < 26) this.burst(x * CFG.cell + 16, y * CFG.cell + 16, '#5d9c41', 3);
      }
    SFX.repair();
    this.floatText(CFG.cols * CFG.cell * .5, CFG.cell * 2, '\u2713', '#5d9c41');
  }

  updateOverheat(dt) {
    let n = 0, doomed = 0;
    for (let y = CFG.overheatRow; y < this.grid.length; y++) {
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (!c) continue;
        n++;
        c.strain = 1;
        const rowsOver = y - CFG.overheatRow + 1;
        c.hp -= c.max * CFG.overheatPct * (1 + (rowsOver - 1) * CFG.overheatRowStep) * dt;
        if (c.hp <= 0) doomed++;
      }
    }
    this.overheat = n;
    if (n > 0) SFX.overheatAlarm();
    if (doomed) this.cullDead();
  }

  updateSettle(dt) {
    const k = ease(dt, 13);
    for (let y = 0; y < this.grid.length; y++) {
      const row = this.grid[y];
      for (let x = 0; x < CFG.cols; x++) {
        const c = row[x];
        if (!c) continue;
        if (c.off) { c.off -= c.off * k; if (Math.abs(c.off) < 0.004) c.off = 0; }
        if (c.flash > 0) c.flash -= dt;
        if (c.muzzle > 0) c.muzzle -= dt;
        if (c.strain > 0) c.strain -= dt * 2;
      }
    }
    if (this.piece) this.visY += (this.piece.cy - this.visY) * ease(dt, 26);
  }

  updateFx(dt) {
    for (let i = this.fx.length - 1; i >= 0; i--) {
      const p = this.fx[i];
      p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 190 * dt;
      if (p.t > p.life) this.fx.splice(i, 1);
    }
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i]; t.t += dt; t.y += 26 * dt;
      if (t.t > t.life) this.texts.splice(i, 1);
    }
  }

  updateWaves(dt) {
    // Training is a sandbox: the countdown is frozen until the step that
    // actually asks for a wave, so nobody gets jumped mid-explanation.
    if (this.tutorial && !TUT_STEPS[this.tutorial.step].live) {
      this.prepTimer = CFG.prepTime;
      if (this.phase === 'prep') return;
    }
    if (this.phase === 'prep') {
      this.prepTimer -= dt;
      if (this.prepTimer <= 0) this.startWave(false);
    } else {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && this.toSpawn > 0) {
        // the boss arrives last, behind its escort
        if (this.toSpawn === 1 && this.bossPending) { this.bossPending = false; this.spawnEnemy('colossus'); }
        else this.spawnEnemy();
        this.toSpawn--;
        this.spawnTimer = CFG.spawnGap(this.wave);
      } else if (this.toSpawn === 0 && this.enemies.length === 0) {
        const held = this.wave;
        const bonus = Math.round(CFG.waveBonus(held) * (this.mods.bounty || 1));
        const tech = CFG.waveTech + (this.mods.tech || 0);
        this.coins += bonus;
        this.armory += tech;
        this.refitBlocks();
        // pay is credited before the bill, so the bill can see the new stock —
        // that is deliberate, and the tally below shows both halves in order
        const bill = this.payUpkeep();
        this.maxHp += CFG.waveCoreHp;
        this.hp = Math.min(this.maxHp, this.hp + CFG.waveCoreHp);
        this.phase = 'prep';
        this.prepTimer = CFG.prepTime;
        this.repairUses = Math.max(0, this.repairUses - 1);
        recordBest(this);
        /* One receipt for the wave, kept until the next one replaces it: the
           pause sheet and the upgrade card both read it, so the numbers stay
           on screen instead of scrolling past in a two-second banner. */
        this.lastWave = { wave: held, bonus, tech, due: bill.due, short: bill.short,
                          stock: Math.floor(this.coins) };
        SFX.waveDone();
        this.setBanner(T('waveDone', held, bonus, tech), '#5d9c41');
        if (bill.short > 0) this.say(T('unpaid', bill.short));
        if (!this.tutorial) offerChoice();
      }
    }
  }

  updatePiece(dt) {
    if (this.dasDir !== 0) {
      this.das -= dt;
      while (this.das <= 0) { this.move(this.dasDir); this.das += CFG.arr; }
    }
    if (!this.piece) return;

    const down = keys['KeyS'] || keys['ArrowDown'];
    this.softHold = down ? this.softHold + dt : 0;
    const fast = this.softHold > CFG.softDropDelay ? CFG.softDropMult : 1;

    if (this.valid(this.piece.cells, this.piece.cx, this.piece.cy - 1)) {
      this.lockTimer = 0;
      this.fallTimer -= dt * fast;
      if (this.fallTimer <= 0) { this.piece.cy--; this.fallTimer = CFG.fallInterval; }
    } else {
      this.lockTimer = this.lockTimer || CFG.lockDelay;
      this.lockTimer -= dt * (fast > 1 ? 4 : 1);
      if (this.lockTimer <= 0) this.lock();
    }
  }

  pickTarget(tx, ty, range) {
    const r2 = range * range;
    let best = null, bestX = Infinity, fallback = null, fbX = Infinity;
    for (const e of this.enemies) {
      const dx = e.x - tx, dy = e.y - ty;
      if (dx * dx + dy * dy > r2) continue;
      if (e.x < fbX) { fallback = e; fbX = e.x; }
      if (e.hp - e.pending <= 0) continue;
      if (e.x < bestX) { best = e; bestX = e.x; }
    }
    return best || fallback;
  }

  updateTurrets(dt) {
    /* Damage already on its way is booked against its target so the next
       turret picks someone else. It is booked after plate, because that is
       what will actually land. */
    for (const e of this.enemies) e.pending = 0;
    for (const s of this.shots)
      if (s.target) s.target.pending += this.armourAdjust(s.target, s.dmg);

    const mult = this.dmgMult;
    this.medics = 0;
    for (let y = 0; y < this.grid.length; y++) {
      const row = this.grid[y];
      for (let x = 0; x < CFG.cols; x++) {
        const c = row[x];
        if (!c) continue;
        const def = TURRETS[c.type];
        const tx = x * CFG.cell + CFG.cell / 2, ty = y * CFG.cell + CFG.cell / 2;

        if (def.support) { this.medics++; this.medicTick(c, x, y, def, dt); continue; }

        c.cd -= dt;
        if (c.cd > 0) continue;
        const target = this.pickTarget(tx, ty, def.range);
        if (!target) { c.cd = 0; continue; }
        c.cd = def.cd / (this.rally > 0 ? CFG.rallyMult : 1);
        c.muzzle = 0.12;
        SFX.fire(c.type);
        const dmg = def.dmg * mult;
        // book it immediately, or two turrets firing in the same frame both
        // see a full-health target and empty the volley into one corpse
        target.pending += this.armourAdjust(target, dmg);
        this.shots.push({
          x: tx, y: ty, target, dmg, def,
          color: def.color, speed: def.pspeed, arc: !!def.arc, t: 0,
        });
      }
    }
  }

  medicTick(c, gx, gy, def, dt) {
    let best = null, bestRatio = 1;
    const cells = Math.ceil(def.range / CFG.cell);
    for (let y = Math.max(0, gy - cells); y <= Math.min(this.grid.length - 1, gy + cells); y++) {
      for (let x = Math.max(0, gx - cells); x <= Math.min(CFG.cols - 1, gx + cells); x++) {
        const b = this.grid[y][x];
        if (!b || b.hp >= b.max) continue;
        const dx = (x - gx) * CFG.cell, dy = (y - gy) * CFG.cell;
        if (dx * dx + dy * dy > def.range * def.range) continue;
        const ratio = b.hp / b.max;
        if (ratio < bestRatio) { bestRatio = ratio; best = b; }
      }
    }
    if (best) best.hp = Math.min(best.max, best.hp + def.repair * (this.mods.mend || 1) * dt);
  }

  updateShots(dt) {
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const s = this.shots[i];
      s.t += dt;
      if (!this.enemies.includes(s.target)) { this.shots.splice(i, 1); continue; }
      const dx = s.target.x - s.x, dy = s.target.y - s.y;
      const d = Math.hypot(dx, dy) || 1;
      const step = s.speed * dt;
      if (d <= step || s.t > 3) {
        this.applyHit(s);
        this.shots.splice(i, 1);
      } else {
        s.x += dx / d * step;
        s.y += dy / d * step;
      }
    }
  }

  applyHit(s) {
    const def = s.def;
    this.burst(s.x, s.y, s.color, 4);
    if (def.splash) {
      SFX.splash();
      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        const dx = e.x - s.x, dy = e.y - s.y;
        if (dx * dx + dy * dy > def.splash * def.splash) continue;
        this.hurt(e, e === s.target ? s.dmg : s.dmg * 0.6, i, true);
      }
      return;
    }
    if (def.slow) { s.target.slow = Math.max(s.target.slow, def.slowTime); s.target.slowPow = def.slow; }
    if (def.burn) { s.target.burn = def.burnTime; s.target.burnDps = Math.max(s.target.burnDps, def.burn * this.dmgMult); }
    // armour makes a duller, metallic "tink" — you can hear that it glanced
    SFX.hit(!!s.target.def.armor);
    this.hurt(s.target, s.dmg, undefined, true);
  }

  updateEnemies(dt) {
    const wallRight = CFG.cols * CFG.cell;
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      const d = e.def;
      if (e.flash > 0) e.flash -= dt;

      if (e.burn > 0) {
        e.burn -= dt;
        if (this.hurt(e, e.burnDps * dt, i)) continue;   // burn ignores armour
      }
      let speed = e.speed;
      if (e.slow > 0) { e.slow -= dt; speed *= (1 - (e.slowPow || 0.45)); }
      // stride cadence scales with size: a colossus plods, a spawnling scurries
      e.walk += (speed / d.r) * dt * 2.4;
      if (e.spawnT < 1) e.spawnT = Math.min(1, e.spawnT + dt * 2.6);

      /* --- Mender: patches up everything around it --- */
      if (d.heals) {
        e.healTimer -= dt;
        if (e.healTimer <= 0) {
          e.healTimer = 1;
          for (const o of this.enemies) {
            if (o === e || o.hp >= o.max) continue;
            if (Math.hypot(o.x - e.x, o.y - e.y) > d.healRange) continue;
            o.hp = Math.min(o.max, o.hp + d.heals);
            this.burst(o.x, o.y, d.color, 3);
          }
        }
      }

      /* --- Flyers ignore the wall and go straight for the core --- */
      if (d.flying) {
        e.x -= speed * dt;
        e.y += Math.sin(this.time * 2.2 + e.phase) * 8 * dt;
        if (e.x <= 0) {
          this.hitCore(e.coreDmg);
          this.burst(e.x, e.y, d.color, 12);
          this.enemies.splice(i, 1);
        }
        continue;
      }

      const front = e.x - d.r;

      if (front <= 0) {
        e.atkTimer -= dt;
        if (e.atkTimer <= 0) { this.hitCore(e.coreDmg); e.atkTimer = d.atk || 1; }
        continue;
      }

      const col = Math.floor(front / CFG.cell);
      const blocked = front < wallRight && col >= 0 && col < CFG.cols && this.grid[0][col];

      if (blocked) {
        if (d.sapper) {
          this.burst(e.x, e.y, d.color, 26);
          for (let yy = 1; yy >= 0; yy--)
            for (let xx = col - 1; xx <= col + 1; xx++)
              if (xx >= 0 && xx < CFG.cols && this.grid[yy] && this.grid[yy][xx])
                this.destroyBlock(xx, yy);
          this.shake = 12;
          this.enemies.splice(i, 1);
          continue;
        }
        e.atkTimer -= dt;
        if (e.atkTimer <= 0) {
          this.damageBlock(col, 0, e.blockDmg);
          e.atkTimer = d.atk;
          this.burst(col * CFG.cell + CFG.cell, e.y, d.color, 3);
        }
      } else {
        e.x -= speed * dt;
      }
    }
  }

  /* ============================= DRAW =================================== */
  draw(dt) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, CW, CH);

    this.drawBackdrop();

    /* The whole field at once: the load line always in view with a row to
       spare over it (or over the stack and the piece, once they pass it), and
       the full run-up to the Rift. You read the wall and the machines on it
       in one look instead of panning your eyes across a close-up. */
    const top = Math.max(this.topRow() + 2, CFG.overheatRow + 1,
                         this.piece ? this.piece.cy + 2 : 0);
    const needH = (top + CFG.viewHeadroom) * CFG.cell;
    const worldL = -CFG.coreW - CFG.viewPadL;
    const worldR = CFG.cols * CFG.cell + CFG.approach + 40;
    const worldW = worldR - worldL;
    /* Width always fits: the run-up has to be visible or the machines arrive
       from off-screen. Height is allowed to stop zooming out at minZoom, since
       a tall tower is the player's own doing. */
    const fitW = (CW - 24) / worldW;
    const fitH = Math.max(CFG.minZoom, (CH - 74) / needH);
    const target = Math.min(CFG.maxZoom, fitW, fitH);
    if (!this.viewScale) this.viewScale = target;
    this.viewScale += (target - this.viewScale) * ease(dt, 4.5);
    this.scale = this.viewScale;
    // whatever width the field does not need is split evenly around it
    const pad = Math.max(12, (CW - worldW * this.scale) / 2);
    this.originX = pad - worldL * this.scale;
    this.originY = CH - 24;
    this.applyCoachCamera(dt);

    /* Screen shake and the full-screen hit flash are the two effects people
       with motion sensitivity ask to lose first, and CSS cannot reach a canvas.
       `calm` is the same flag the page class uses; the hit still reads, through
       the particles and the red vignette edge, it just stops throwing the view. */
    const sh = calm ? 0 : this.shake;
    ctx.save();
    if (sh > 0.4) ctx.translate((Math.random() - .5) * sh, (Math.random() - .5) * sh);
    ctx.translate(this.originX, this.originY);
    ctx.scale(this.scale, this.scale);

    this.drawGround();
    this.drawFarmer();
    this.drawCore();
    this.drawGrid();
    this.drawPiece();
    ctx.restore();

    /* Enemies, shots and particles are drawn in SCREEN space with a minimum
       readable size — zooming out to fit a tall tower must never shrink the
       mobs into specks. Only their positions follow the camera. */
    this.drawRift();
    this.drawEnemies();
    this.drawShots();
    this.drawFx();
    this.drawCoachSpot();

    this.drawBarrages();
    this.drawPanels();
    this.drawBossBar();
    this.drawBanner();

    // the core taking a hit should be felt at the edges of the screen
    if (this.hurtFlash > 0) {
      const g2 = ctx.createRadialGradient(CW * .5, CH * .5, CH * .25, CW * .5, CH * .5, CH * .95);
      g2.addColorStop(0, 'rgba(255,60,90,0)');
      // held steady rather than pulsing when motion is turned down
      g2.addColorStop(1, 'rgba(255,60,90,' + ((calm ? .3 : this.hurtFlash) * .5) + ')');
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, CW, CH);
    }
  }

  /* THE BACKDROP. Read from left to right it tells the whole game: the town
     you are defending, its fields, the Heart and the wall in front of it, the
     open run-up, and the dark ridge the machines walk out of.

     It is painted to stay out of the way. Everything behind the field is pale
     and low in contrast, pushed back by haze; the only strong shapes on screen
     belong to the wall and the machines. The town and the fields hang off the
     Heart's position and the ridge off the Rift's, so they stay where they
     belong when the window is wide, narrow, or the training camera leans in. */
  drawBackdrop() {
    const horizon = this.originY !== undefined ? this.originY : CH - 24;
    const heartX = this.sx ? this.sx(-CFG.coreW) : 60;
    const riftX = this.sx ? this.sx(CFG.cols * CFG.cell + CFG.approach) : CW * .8;
    const t = this.time || 0;
    // one unit of backdrop size, from the size of the window rather than the
    // zoom (far things do not grow when the camera leans in), and held down on
    // a narrow phone field, where a full-size ridge swallowed the run-up
    const u = Math.max(.5, Math.min(1.35, horizon / 430, CW / 1000));

    // sky: deeper overhead, warm and pale at the horizon
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#7db7d8');
    sky.addColorStop(.55, '#b6dbe8');
    sky.addColorStop(1, '#e8efd8');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, CW, horizon + 2);

    // sun, high over the town
    const sunX = Math.max(60, Math.min(CW * .3, heartX - 140 * u)), sunY = horizon * .2;
    ctx.fillStyle = 'rgba(255,248,222,.45)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 54 * u, 0, 6.3); ctx.fill();
    ctx.fillStyle = 'rgba(255,252,236,.9)';
    ctx.beginPath(); ctx.arc(sunX, sunY, 22 * u, 0, 6.3); ctx.fill();

    // slow clouds
    ctx.fillStyle = 'rgba(255,255,255,.48)';
    for (let i = 0; i < 4; i++) {
      const cx = ((t * (4 + i * 1.7) + i * 390) % (CW + 320)) - 160;
      const cy = horizon * (.12 + i * .1);
      const r = (20 + i * 7) * u;
      ellipse(cx, cy, r * 1.9, r * .55); ctx.fill();
      ellipse(cx + r * .7, cy - r * .24, r * 1.05, r * .48); ctx.fill();
    }

    /* the ridge: the machines' side. Slate, jagged, and taller than anything
       on the town's side, with the harvest's smoke leaning off it */
    const rx0 = Math.max(riftX - 200 * u, Math.min(riftX - 60 * u, CW * .6));
    const ridge = (x0, hMul, fill, step) => {
      ctx.fillStyle = fill;
      ctx.beginPath();
      ctx.moveTo(x0, horizon);
      for (let x = x0, i = 0; x <= CW + 60; x += step * u, i++) {
        const peak = (i % 3 === 1 ? 100 : i % 3 === 2 ? 64 : 80) * hMul * u * (1 + .16 * Math.sin(i * 2.3 + x0));
        ctx.lineTo(x + step * .5 * u, horizon - peak);
        ctx.lineTo(x + step * u, horizon - peak * .52 - 8 * u);
      }
      ctx.lineTo(CW + 60, horizon); ctx.closePath(); ctx.fill();
    };
    ridge(rx0, 1, 'rgba(126,130,154,.36)', 36);
    ridge(rx0 + 40 * u, .55, 'rgba(104,106,128,.3)', 26);   // the foothills, nearer and darker
    // the harvest's smoke, a soft haze leaning off the ridge towards the east
    const puff = (x, y, r, a) => {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(84,82,98,' + a.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(84,82,98,0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    };
    for (let p = 0; p < 2; p++) {
      const sx0 = Math.min(CW - 30 * u, riftX + (70 + p * 120) * u);
      for (let i = 0; i < 6; i++) {
        const life = (t * .05 + i / 6 + p * .37) % 1;
        puff(sx0 + life * 110 * u, horizon - (70 + life * 170) * u, (26 + life * 52) * u, .16 * Math.sin(Math.PI * life));
      }
    }

    // far hills on the valley side, pale blue-green
    ctx.fillStyle = 'rgba(160,196,160,.55)';
    ctx.beginPath();
    ctx.moveTo(-10, horizon);
    for (let x = -10; x <= riftX; x += 24)
      ctx.lineTo(x, horizon - (34 + Math.sin(x * .011 + 1.1) * 14 + Math.sin(x * .031) * 6) * u);
    ctx.lineTo(riftX, horizon); ctx.closePath(); ctx.fill();

    this.drawTown(heartX, horizon, u);

    // near meadow haze along the horizon, over the whole width
    ctx.fillStyle = 'rgba(126,164,96,.34)';
    ctx.beginPath();
    ctx.moveTo(0, horizon);
    for (let x = 0; x <= CW; x += 30)
      ctx.lineTo(x, horizon - (9 + Math.sin(x * .028 + 1.4) * 4) * u);
    ctx.lineTo(CW, horizon); ctx.closePath(); ctx.fill();

    ctx.fillStyle = this.sector.tint;
    ctx.fillRect(0, 0, CW, CH);
  }

  /* THE TOWN the Heart keeps alive: a walled market town on a rise, its bell
     tower (the same bell you ring), a mill on the far hill, smoke from the
     chimneys, and fields running down to the wall. Drawn once per frame from a
     fixed plan, right to left from the gate by the Heart. On a field too
     narrow to leave room beside the Heart (a phone), it moves back and sits
     small and faint on the horizon behind the yard instead. */
  drawTown(heartX, horizon, u) {
    const near = heartX > 150;
    const k = near ? u : u * .62;
    const R = near ? heartX - 12 * u : this.sx(CFG.cols * CFG.cell * .92);
    if (R < 20) return;
    const t = this.time || 0;
    const X = x => R + x * k, Y = y => horizon - y * k;
    // distance haze, mixed into every colour rather than laid over as a sheet,
    // so the sky between the roofs stays sky
    const hz = near ? .3 : .55;
    const H = c => mixHex(c, '#e2ecea', hz);
    ctx.save();

    // the rise the town stands on, striped with fields down to the wall
    ctx.fillStyle = H('#a9c485');
    ctx.beginPath();
    ctx.moveTo(X(40), horizon);
    ctx.quadraticCurveTo(X(-150), Y(46), X(-420), Y(40));
    ctx.quadraticCurveTo(X(-560), Y(36), X(-700), Y(22));
    ctx.lineTo(X(-700), horizon); ctx.closePath(); ctx.fill();
    const fields = ['#d8c078', '#b9cc7c', '#e1cd8a', '#a7c275', '#d4b86c'];
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = H(fields[i]);
      ctx.beginPath();
      const x0 = -40 - i * 118, x1 = x0 - 104;
      ctx.moveTo(X(x0), Y(6 + i * 1.5)); ctx.lineTo(X(x1), Y(8 + i * 2));
      ctx.lineTo(X(x1 - 6), Y(15 + i * 2)); ctx.lineTo(X(x0 - 4), Y(13 + i * 1.5));
      ctx.closePath(); ctx.fill();
    }

    // the mill on the far hill, sails turning slowly
    const mx = X(-600), my = Y(34);
    ctx.fillStyle = H('#d9cdb0');
    ctx.beginPath();
    ctx.moveTo(mx - 10 * k, my); ctx.lineTo(mx - 6 * k, my - 46 * k);
    ctx.lineTo(mx + 6 * k, my - 46 * k); ctx.lineTo(mx + 10 * k, my); ctx.closePath(); ctx.fill();
    ctx.fillStyle = H('#9d6f58');
    ctx.beginPath();
    ctx.moveTo(mx - 9 * k, my - 45 * k); ctx.lineTo(mx, my - 56 * k); ctx.lineTo(mx + 9 * k, my - 45 * k);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = H('#8a7a64'); ctx.lineWidth = Math.max(1, 2.2 * k);
    const hub = [mx, my - 42 * k], spin = calm ? .5 : t * .7;
    for (let i = 0; i < 4; i++) {
      const a = spin + i * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(hub[0], hub[1]);
      ctx.lineTo(hub[0] + Math.cos(a) * 30 * k, hub[1] + Math.sin(a) * 30 * k); ctx.stroke();
      ctx.fillStyle = 'rgba(236,228,210,.9)';
      ctx.save(); ctx.translate(hub[0], hub[1]); ctx.rotate(a);
      ctx.fillRect(10 * k, 0, 19 * k, 5.5 * k); ctx.restore();
    }

    // houses behind the wall: gables in weathered tile, whitewash and ochre
    const houses = [
      [-58, 30, 30, '#e9ddc2', '#b8694c'], [-96, 26, 38, '#dfcd9f', '#9d5c43'],
      [-134, 38, 28, '#ece2c9', '#a9674b'], [-222, 34, 34, '#e3d3ab', '#b0735a'],
      [-262, 28, 26, '#eadfc4', '#9a5a44'], [-306, 42, 36, '#dccb9e', '#ab6a4f'],
      [-350, 30, 30, '#e8dcc0', '#a35f46'], [-392, 36, 27, '#e2d2aa', '#b36f55'],
      [-436, 30, 33, '#ebe0c6', '#9c6049'], [-478, 34, 25, '#dfcfa4', '#aa6b50'],
    ];
    const base = 14;                       // the houses stand on the rise, above the wall
    for (const [x, w, h, wall, roof] of houses) {
      ctx.fillStyle = H(wall);
      ctx.fillRect(X(x - w), Y(base + h), w * k, h * k);
      ctx.fillStyle = H(roof);
      ctx.beginPath();
      ctx.moveTo(X(x - w - 3), Y(base + h)); ctx.lineTo(X(x - w / 2), Y(base + h + w * .55));
      ctx.lineTo(X(x + 3), Y(base + h)); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(92,72,52,.55)';
      const wy = base + h * .62;
      ctx.fillRect(X(x - w * .72), Y(wy), 4.5 * k, 5.5 * k);
      ctx.fillRect(X(x - w * .36), Y(wy), 4.5 * k, 5.5 * k);
    }
    // chimney smoke, rising and thinning
    for (const [hx, hh] of [[-80, 38], [-290, 36], [-420, 33]]) {
      for (let i = 0; i < 4; i++) {
        const life = ((t * .18 + i / 4 + hx * .001) % 1 + 1) % 1;
