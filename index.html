/* Anything that throws a run away asks first, and "worth keeping" means the
   player has done something worth losing - not just `wave > 0`. Restart used
   to skip the question entirely while the button right next to it asked it. */
function runWorthKeeping() {
  return !!game && !game.gameOver && !game.tutorial &&
    (game.wave > 0 || game.placed > 0 || game.linesCleared > 0);
}
function confirmDiscard() {
  return !runWorthKeeping() || confirm(T('confirmDiscard'));
}
function leaveToMenu() {
  if (VS.active && !confirm(T('vs_leaveAsk'))) return;
  if (!VS.active && !confirmDiscard()) return;
  if (VS.active) { NET.send('left', {}); vsEndMatch(); }
  showMenu();
}
function restartRun() {
  if (VS.active) { NET.send('left', {}); vsEndMatch(); startGame(false); return; }
  if (!confirmDiscard()) return;
  startGame(false);
}

function togglePause(force) {
  if (!game || game.gameOver || APP !== 'game' || storyOpen || choiceOpen) return;
  // A race where either side can stop the clock is not a race. The upgrade
  // card still pauses, because both players get exactly one per wave and the
  // score is waves held, not wall-clock time.
  if (VS.live) { toast(T('vs_noPause')); return; }
  game.paused = force !== undefined ? force : !game.paused;
  if (game.paused) { game.dasDir = 0; for (const k in keys) keys[k] = false; }
  syncModal();
}

/* ==========================================================================
   STORY CARD — a chapter break between waves
   ======================================================================== */
function showSectorCard(sec) {
  storyOpen = true;
  game.paused = true;
  put(ui.scNo, T('sc_no', sec.no));
  put(ui.scTitle, T(sec.key));
  // the accent is a paint colour picked to sit on grass; as body text on
  // parchment two of the four fall under 3:1, so darken until they read
  sty(ui.scTitle, 'color', ink(sec.accent));
  put(ui.scLog, T(sec.log));
  sty(ui.scLog, 'color', ink(sec.accent));
  ui.sectorCard.hidden = false;
  ui.modal.hidden = true;
  applyLayers();
  SFX.sector();
}
function closeSectorCard() {
  if (!storyOpen) return;
  storyOpen = false;
  ui.sectorCard.hidden = true;
  game.paused = false;
  applyLayers();
  SFX.waveStart(game.bossPending);
}

/* ==========================================================================
   BETWEEN-WAVE CHOICE
   ======================================================================== */
let choiceOpen = false;

/* What a card would do to the number the player is actually looking at. A card
   reading "-20% upkeep" moved nothing at all on a run whose bill came from the
   hoard tax rather than from the buildings; showing the before and after makes
   that visible at the moment of choosing instead of three waves later. */
const derive = (k, on) => Object.getOwnPropertyDescriptor(Game.prototype, k).get.call(on);
function previewOf(u, g) {
  // a stand-in carrying only what the derived numbers read, so the card can be
  // applied to it without touching the run
  const stub = {
    mods: Object.assign({}, g.mods), maxHp: g.maxHp, hp: g.hp,
    blockCount: g.blockCount, coins: g.coins, wave: g.wave, armory: g.armory,
  };
  try { u.apply(stub); } catch (e) { return null; }
  const parts = [];
  const was = { up: g.upkeepParts.due, cost: g.buyCost, dmg: g.dmgMult };
  const now = { up: derive('upkeepParts', stub).due, cost: derive('buyCost', stub), dmg: derive('dmgMult', stub) };
  if (now.up !== was.up) parts.push(T('now_upkeep', was.up, now.up));
  if (now.cost !== was.cost) parts.push(T('now_cost', was.cost, now.cost));
  if (Math.abs(now.dmg - was.dmg) > 0.005) parts.push(T('now_dmg', was.dmg.toFixed(2), now.dmg.toFixed(2)));
  if (stub.maxHp !== g.maxHp) parts.push(T('now_hp', Math.round(g.maxHp), Math.round(stub.maxHp)));
  return parts.length ? parts.join(' \u00b7 ') : T('now_none');
}

function offerChoice() {
  const pool = UPGRADES.slice();
  const picks = [];
  for (let i = 0; i < 3 && pool.length; i++)
    picks.push(pool.splice(STREAM.cards.int(pool.length), 1)[0]);

  put(ui.chHd, T('ch_hd', game.wave));
  put(ui.chTitle, T('ch_title'));
  renderTally(ui.chSum, game.lastWave);
  ui.chCards.innerHTML = '';
  picks.forEach((u, i) => {
    const el = document.createElement('button');
    el.className = 'card' + (u.risk ? ' risk' : '');
    const rows = u.fx.map(([k, val, good]) =>
      '<div class="eff ' + (good ? 'good' : 'bad') + '">' + val + ' ' + T('fx_' + k) + '</div>').join('');
    const now = previewOf(u, game);
    el.innerHTML = '<span class="kc">' + (i + 1) + '</span>' +
                   '<div class="ct">' + T('up_' + u.id + '_t') + '</div>' +
                   '<div class="effs">' + rows + '</div>' +
                   (now ? '<span class="now">' + now + '</span>' : '');
    el.addEventListener('click', () => takeChoice(u));
    ui.chCards.appendChild(el);
  });

  choiceOpen = true;
  game.paused = true;
  ui.choice.hidden = false;
  ui.modal.hidden = true;
  applyLayers();
  SFX.step();
}

function takeChoice(u) {
  if (!choiceOpen) return;
  u.apply(game);
  game.taken.push(u.id);      // a run has to be able to say what it is made of
  choiceOpen = false;
  ui.choice.hidden = true;
  renderTally(ui.chSum, null);
  game.paused = false;
  applyLayers();
  /* The coach card takes itself off screen while a choice is up, and nothing
     else puts it back: syncModal runs on events rather than on every frame,
     and until training started dealing cards no choice ever closed with a
     tutorial still running behind it. */
  if (game.tutorial) renderTutorial();
  SFX.buy();
  toast(T('up_' + u.id + '_t'));
}

/* ==========================================================================
   TUTORIAL. Every step advances either on its own `check` or on the button,
   so nobody can get stuck — and Skip is on screen the entire time.
   ======================================================================== */
/* The script is one idea per card, in the order the idea first matters.
 *
 * The old run said too much at once: closing a row arrived together with the
 * shockwave, the payout and salvage in a single sentence, mending arrived
 * together with calling the wave, and three mechanics shared the card about
 * the wall not being free. Meanwhile the bell, the horn, the upkeep bill, the
 * tax on a full purse and the cards between waves were never mentioned at all,
 * so a player finished training and met five unexplained systems on wave one.
 *
 * `live` lets the countdown run, and it is off for everything up to the call,
 * so the early cards are read in a sandbox with nothing coming. The tools and
 * the economy are taught inside the practice wave and on the bill that lands
 * when it ends, at the moment there is something on screen to point at.
 */
/*
 * `spot` and `el` are the other half of teaching where it happens: the card
 * says a thing, and the thing itself lights up. `spot` is drawn on the canvas
 * (the Heart, the tear, the load line, the bottom row), `el` is a CSS
 * selector for the button or the stat the card is about. A card that points
 * at nothing is a card the player has to go hunting for.
 */
const TUT_STEPS = [
  { k: 'tu1', spot: 'core', cam: 'core', label: 'core' },
  { k: 'tu2', el: '#buyBtn', cam: 'board', check: g => !!g.piece || g.placed > 0 },
  { k: 'tu3', spot: 'piece', cam: 'board', label: 'piece', check: g => g.rotations > 0 || g.moves > 2 },
  { k: 'tu_store', spot: 'store', cam: 'board', el: '#tHold', check: g => g.stored > 0 },
  { k: 'tu4', spot: 'piece', cam: 'board', label: 'piece', check: g => g.placed >= 1 },
  { k: 'tu5', spot: 'row', cam: 'board', label: 'front', check: g => g.placed >= 4 },
  { k: 'tu6', spot: 'row', cam: 'board', label: 'full', check: g => g.linesCleared >= 1 },
  { k: 'tu_salvage', el: '#techStat' },
  { k: 'tu7', spot: 'line', cam: 'line', label: 'line' },
  /* The heal step waited for `repairs > 0` on a Heart that starts full, and
     repair() returns immediately at full health — so the practice it asked for
     could not be done, only skipped. The step now opens by scratching the
     Heart itself: a scripted dent, not an attack, and something to mend. */
  { k: 'tu8', spot: 'core', cam: 'core', label: 'core', el: '#repairBtn', check: g => g.repairs > 0,
    enter: g => {
      if (g.hp <= g.maxHp * 0.65) return;
      const dent = Math.round(g.maxHp * 0.35);
      g.hp -= dent;
      g.hurtFlash = 1;
      g.floatText(-10, CFG.coreH * 0.6, '-' + dent, '#bf4433');
      g.burst(0, CFG.coreH * 0.4, '#bf4433', 10);
    } },
  /* From here the clock is allowed to run. `canCallWave` reads the same flag,
     so the bar only becomes callable once the card that explains it is up. */
  { k: 'tu_call', live: true, el: '#waveBar', check: g => g.phase === 'fight' },
  { k: 'tu9', live: true, spot: 'rift', cam: 'rift', label: 'rift' },
  /* The bell's real job is knocking shells out of the air, and the practice
     wave is far too early for the siege guns, so the card fires one itself:
     a slow shell down a column of the wall, the bell lit, the shell named on
     the field. If it lands before the bell is rung, another one comes. */
  { k: 'tu_bell', live: true, el: '#abBell', spot: 'shell', label: 'shell', cam: 'board',
    check: g => g.deflected > 0,
    enter: g => { g.cdBell = 0; tutShell(g); },
    tick: (g, dt) => {
      if (g.barrages.length || g.deflected) { g.tutShellWait = 0; return; }
      g.tutShellWait = (g.tutShellWait || 0) + dt;
      if (g.tutShellWait > 1.2) { g.tutShellWait = 0; tutShell(g); }
    } },
  { k: 'tu_rally', live: true, el: '#abRally', check: g => g.rallies > 0 },
  /* No check on mending: with an undamaged wall the price is zero and the
     button refuses, so waiting for a mend that cannot happen would be the same
     dead end the heal step used to have. */
  { k: 'tu_mend', live: true, el: '#abMend' },
  { k: 'tu_held', live: true, check: g => g.wave >= 1 && g.phase === 'prep' },
  /* The bill has landed by now and the numbers on the card moved, so these
     three point at something that just happened rather than at a rule. */
  { k: 'tu_upkeep', el: '#upkeepStat' },
  { k: 'tu_hoard', el: '#stockStat' },
  { k: 'tu_cards' },
  /* Entering the last card deals the three upgrades. The coach hides itself
     while a choice is open, so the player reads this, picks, and comes back to
     the finished card. */
  { k: 'tut_done', done: true, enter: () => offerChoice() },
];

/* ---------------------------------------------------------------------------
   THE READING WINDOW.

   The cards from `tu_call` on are read with a wave on the field, and the first
   version of this lost that fight badly: five machines crossed the whole
   approach in the time it takes to read three lines, so the player finished
   the card having already been hit, without once seeing a machine walk.

   Pausing would have fixed the reading and broken the teaching, because the
   thing being taught is what a wave looks like. So the world keeps moving and
   moves slowly: TUT_SLOW of real time while a fresh card is up, easing back to
   full over the last second. The card says this is happening, and the button
   ends it early for anyone who reads faster than the estimate.
   ------------------------------------------------------------------------ */
const TUT_SLOW = 0.3;

/* Reading time from the card's own length, at about two words a second, which
   is a slow-ish pace in a first language and a fair one in a second. Floored
   so a one-line card still lands, capped so nobody watches treacle. */
function tutReadTime(step) {
  const raw = String(TT(step.k + '_d') || '').replace(/<[^>]*>/g, ' ');
  const words = raw.split(/\s+/).filter(Boolean).length;
  return Math.max(4, Math.min(10, 1.5 + words / 2));
}

/* One slow training shell, dropped on a column that has something standing
   in it (a shell on an empty column teaches nothing), aimed at the middle of
   the wall when there is no wall yet. */
function tutShell(g) {
  if (!g || g.gameOver) return;
  const cols = [];
  for (let x = 0; x < CFG.cols; x++) if (g.grid[0] && g.grid[0][x]) cols.push(x);
  const col = cols.length ? cols[Math.floor(cols.length / 2)] : Math.floor(CFG.cols / 2);
  g.barrages.push({ col, t: 6, warn: 6, dead: false });
  SFX.incoming();
}

/* Real seconds are multiplied by this before the game sees them. */
function tutTimeScale() {
  const t = game && game.tutorial;
  if (!t || !t.read) return 1;
  const k = Math.min(1, t.read);          // last second eases back to speed
  return TUT_SLOW + (1 - TUT_SLOW) * (1 - k);
}

/* The DOM half of "point at the thing": the button or stat a card is about
   wears an outline for as long as that card is up. The canvas half is
   drawCoachSpot() over in the renderer. */
let coachLit = [];
function setCoachLit(sel) {
  for (const el of coachLit) {
    cls(el, 'coachlit', false);
    el.style.removeProperty('--lit-origin'); el.style.removeProperty('--lit-dx');
  }
  coachLit = [];
  if (!sel) return;
  for (const one of sel.split(',')) {
    const el = document.querySelector(one.trim());
    if (!el) continue;
    /* grow away from the nearest edge of the window, so a stat in the corner
       swells into the screen rather than off it */
    const r = el.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    const ox = r.left < vw * .22 ? 'left' : r.right > vw * .78 ? 'right' : 'center';
    const oy = r.top < vh * .3 ? 'top' : r.bottom > vh * .7 ? 'bottom' : 'center';
    el.style.setProperty('--lit-origin', ox + ' ' + oy);
    // the plate is wider than the element, so step in off a window edge
    el.style.setProperty('--lit-dx', ox === 'left' && r.left < 20 ? '12px' : ox === 'right' && vw - r.right < 20 ? '-12px' : '0px');
    cls(el, 'coachlit', true); coachLit.push(el);
  }
}

function startTutorial() {
  game.tutorial = { step: 0, read: 0, readMax: 0, since: 0 };
  game.coins = 420;          // a sandbox needs room to experiment
  ui.tut.hidden = false;
  renderTutorial();
}

/* One way in and out of a step, so an `enter` hook cannot be skipped by
   whichever of the three callers happened to move the player along. */
function tutorialGo(n) {
  const t = game && game.tutorial;
  if (!t) return;
  t.step = Math.max(0, Math.min(TUT_STEPS.length - 1, n));
  const s = TUT_STEPS[t.step];
  if (s.enter) s.enter(game);
  /* Only the live cards need the world held back. The ones before the call
     are already read in a frozen sandbox, and slowing a frozen field would
     just make the clouds crawl for no reason. */
  t.readMax = t.read = (s.live && !s.done) ? tutReadTime(s) : 0;
  t.since = 0;               // the field signboard pops in from this
  SFX.step();
  renderTutorial();
}

function renderTutorial() {
  const t = game && game.tutorial;
  if (!t) { ui.tut.hidden = true; setCoachLit(null); return; }
  const s = TUT_STEPS[t.step];
  const last = !!s.done;
  /* The card is a row under the field now, not a layer over it, so it no
     longer has to get out of the way of the pause sheet: hiding it there
     would resize the field behind the sheet and jump the view on resume.
     Overlays take focus off it through `inert` in syncOverlays instead. */
  const wasHidden = ui.tut.hidden;
  ui.tut.hidden = APP !== 'game';
  cls(ui.tut, 'done', last);
  ui.tutNum.innerHTML = last
    ? '<svg class="ico" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m4.6 10.6 3.8 3.8 7.2-8.6"/></svg>'
    : String(t.step + 1);
  put(ui.tutTitle, T(s.k + '_t'));
  ui.tutText.innerHTML = TT(s.k + '_d');
  put(ui.tutNext, last ? T('tut_start') : (s.check ? T('tut_gotit') : T('tut_next')));
  ui.tutSkip.hidden = last;
  sty(ui.tutProg, 'transform', 'scaleX(' + (t.step / (TUT_STEPS.length - 1)).toFixed(3) + ')');
  setCoachLit(ui.tut.hidden ? null : s.el);
  put(ui.tutSlowT, T('tut_slow'));
  put(ui.tutSlowS, T('tut_slow_s'));
  renderReadWindow();
  /* The row is part of the layout, so its height is the field's height:
     re-measure whenever the card changes rather than leaving the canvas
     overlapping the row or floating above it. */
  if (wasHidden !== ui.tut.hidden || !ui.tut.hidden) resize();
}

/* Cheap enough to run every frame: two writes and a hidden flag. */
function renderReadWindow() {
  const t = game && game.tutorial;
  const on = !!(t && t.read > 0 && !ui.tut.hidden);
  ui.tutSlow.hidden = !on;
  if (on) sty(ui.tutSlowBar, 'transform', 'scaleX(' + (t.read / t.readMax).toFixed(3) + ')');
}

function tutorialAdvance() {
  const t = game && game.tutorial;
  if (!t) return;
  if (TUT_STEPS[t.step].done) { endTutorial(false); return; }
  tutorialGo(t.step + 1);
}

function endTutorial(skipped) {
  if (!game || !game.tutorial) return;
  game.tutorial = null;
  ui.tut.hidden = true;
  setCoachLit(null);
  startGame(false);
  resize();                  // the field takes the coach's row back
  toast(skipped ? T('tut_skipped') : T('tut_done_t'));
}

/* Called each frame while the tutorial is up, on the REAL clock: the reading
   window has to run down in wall-clock seconds, not in the slowed ones it is
   itself causing. */
function tutorialTick(dt) {
  const t = game.tutorial;
  if (!t) return;
  t.since = (t.since || 0) + dt;
  if (t.read > 0 && !game.paused && !storyOpen && !choiceOpen) {
    t.read = Math.max(0, t.read - dt);
    renderReadWindow();
  }
  const s = TUT_STEPS[t.step];
  if (s.tick && !game.paused && !storyOpen && !choiceOpen) s.tick(game, dt);
  if (s.check && s.check(game)) tutorialGo(t.step + 1);
}

/* ==========================================================================
   CODEX
   ======================================================================== */
let cxTab = 'story';

function enemyTags(d) {
  const out = [];
  if (d.boss) out.push(T('tg_boss'));
  out.push(d.flying ? T('tg_flying') : T('tg_ground'));
  if (d.armor) out.push(T('tg_armored'));
  if (d.heals) out.push(T('tg_support'));
  if (d.splits) out.push(T('tg_splitter'));
  if (d.sapper) out.push(T('tg_demo'));
  return out.join(' · ');
}

/* Draw one creature into a small canvas by temporarily pointing the shared 2D
   context at it — the enemy art is written against that single `ctx`. The swap
   is restored in a finally, so a throw halfway through a drawing cannot leave
   the game rendering into a 46px thumbnail for the rest of the session. */
function paintEnemyPreview(el, id) {
  const d = ENEMIES[id];
  const c2 = el.getContext('2d');
  const S = 46, dpr = Math.min(2, window.devicePixelRatio || 1);
  el.width = S * dpr; el.height = S * dpr;
  const saved = ctx;
  try {
    ctx = c2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, S, S);
    const r = Math.min(15, 15 * (d.r / 14));
    const mock = { def: d, x: 60, y: 10, walk: 1.1, phase: .6, slow: 0, burn: 0, hp: 1, max: 1 };
    game.drawEnemyBody(mock, S / 2, S / 2 + 2, r, d.color, false, 1);
  } catch (err) {
  } finally {
    ctx = saved;
  }
}

function paintModulePreview(el, key) {
  const def = TURRETS[key], cells = SHAPES[key];
  const c2 = el.getContext('2d');
  const S = 46, dpr = Math.min(2, window.devicePixelRatio || 1);
  el.width = S * dpr; el.height = S * dpr;
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, S, S);
  const w = Math.max(...cells.map(c => c[0])) + 1;
  const h = Math.max(...cells.map(c => c[1])) + 1;
  const sz = Math.min(10, 30 / Math.max(w, h));
  const ox = S / 2 - w * sz / 2, oy = S / 2 - h * sz / 2;
  cells.forEach(([cx2, cy2]) => {
    c2.fillStyle = def.color;
    c2.globalAlpha = .9;
    const x = ox + cx2 * sz, y = oy + (h - 1 - cy2) * sz;
    c2.fillRect(x, y, sz - 1.5, sz - 1.5);
    c2.globalAlpha = 1;
  });
}

/* A name printed in its building's own material colour reads at about 2:1 on
   parchment — honey yellow and field stone were the worst of them. The colour
   still identifies the entry, as a swatch next to the name; the name itself is
   set in a darkened version of it. */
const swatch = c => '<span class="swatch" style="background:' + c + '"></span>';

function renderCodex() {
  const list = ui.cxList;
  list.innerHTML = '';
  document.querySelectorAll('[data-cx]').forEach(b => {
    const on = b.dataset.cx === cxTab;
    b.classList.toggle('sel', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });

  if (cxTab === 'story') {
    STORY.forEach(k => {
      const e = document.createElement('div');
      e.className = 'entry';
      e.innerHTML = '<div class="meta"><div class="nm">' + T(k + '_t') +
        '</div><div class="desc">' + T(k + '_d') + '</div></div>';
      list.appendChild(e);
    });
    return;
  }

  if (cxTab === 'mods') {
    Object.values(TURRETS).forEach(t => {
      const stat = t.support ? T('supportInfo')
        : Math.round(t.dmg / t.cd * 10) / 10 + ' ' + T('dps') + ' · ' + T('range') + ' ' + t.range
          + (t.splash ? ' · ' + T('splash') : '') + (t.slow ? ' · ' + T('slow') : '') + (t.burn ? ' · ' + T('burn') : '');
      const e = document.createElement('div');
      e.className = 'entry';
      e.innerHTML = '<canvas></canvas><div class="meta"><div class="nm" style="color:' + ink(t.color) + '">' +
        swatch(t.color) + turretName(t) + '</div><div class="tags">' + stat + '</div><div class="desc">' +
        T('dm_' + t.key) + '</div></div>';
      list.appendChild(e);
      paintModulePreview(e.querySelector('canvas'), t.key);
    });
    return;
  }

  // hostiles — locked until met
  Object.values(ENEMIES).forEach(d => {
    const seen = CODEX.seen[d.id];
    const e = document.createElement('div');
    e.className = 'entry' + (seen ? '' : ' locked');
    e.innerHTML = '<canvas></canvas><div class="meta"><div class="nm"' +
      (seen ? ' style="color:' + ink(d.color) + '"' : '') + '>' +
      (seen ? swatch(d.color) + enemyName(d) : T('cx_locked')) + '</div><div class="tags">' +
      (seen ? enemyTags(d) + ' · ' + T('cx_fromWave', seen) : '· · ·') +
      '</div><div class="desc">' + (seen ? T('d_' + d.id) : T('cx_lockedDesc')) + '</div></div>';
    list.appendChild(e);
    const cv = e.querySelector('canvas');
    if (seen) paintEnemyPreview(cv, d.id);
  });
}

let codexReturnTo = 'menu';
function openCodex() {
  codexReturnTo = APP === 'game' ? 'game' : 'menu';
  APP = 'codex';
  ui.codex.hidden = false;
  ui.menu.hidden = true;
  ui.modal.hidden = true;
  renderCodex();
  applyLayers();
}
function closeCodex() {
  ui.codex.hidden = true;
  if (codexReturnTo === 'game' && game) {
    APP = 'game';
    // the reference is read from a paused game, and it goes back to it paused
    syncModal();
  } else {
    showMenu();
  }
}

/* ==========================================================================
   MENU BACKDROP — modules drifting down behind the title
   ======================================================================== */
const mfxCtx = ui.menufx.getContext('2d');
let mfx = [], mfxW = 0, mfxH = 0;

function sizeMenuFx() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  mfxW = window.innerWidth; mfxH = window.innerHeight;
  ui.menufx.width = Math.round(mfxW * dpr);
  ui.menufx.height = Math.round(mfxH * dpr);
  mfxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (!mfx.length) {
    const keys2 = Object.keys(SHAPES);
    for (let i = 0; i < 16; i++) {
      const k = keys2[Math.floor(Math.random() * keys2.length)];
      mfx.push({
        k, x: Math.random() * mfxW, y: Math.random() * mfxH,
        vy: 12 + Math.random() * 26, rot: Math.random() * 6.3,
        vr: (Math.random() - .5) * .5, s: 7 + Math.random() * 13,
      });
    }
  }
}

function drawMenuFx(dt) {
  mfxCtx.clearRect(0, 0, mfxW, mfxH);
  for (const p of mfx) {
    p.y += p.vy * dt;
    p.rot += p.vr * dt;
    if (p.y - p.s * 4 > mfxH) { p.y = -p.s * 4; p.x = Math.random() * mfxW; }
    const def = TURRETS[p.k], cells = SHAPES[p.k];
    mfxCtx.save();
    mfxCtx.translate(p.x, p.y);
    mfxCtx.rotate(p.rot);
    mfxCtx.globalAlpha = .13;
    mfxCtx.strokeStyle = def.color;
    mfxCtx.lineWidth = 1.4;
    mfxCtx.fillStyle = hexA(def.color, .06);
    cells.forEach(([cx2, cy2]) => {
      const x = (cx2 - 1.5) * p.s, y = (cy2 - .5) * p.s;
      mfxCtx.fillRect(x, y, p.s - 1.5, p.s - 1.5);
      mfxCtx.strokeRect(x, y, p.s - 1.5, p.s - 1.5);
    });
    mfxCtx.restore();
  }
  mfxCtx.globalAlpha = 1;
}

   own bars away too. Offered only where the browser can do it (an iPhone
   cannot, for anything but video), and the icon follows the real state, since
   Esc leaves full screen without asking the page. */
const FS_OK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
const inFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen() {
  try {
    if (inFullscreen()) {
      const p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      if (p && p.catch) p.catch(() => {});
    } else {

      const p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el, { navigationUI: 'hide' });
      if (p && p.catch) p.catch(() => {});

}

/* ---------------------------------------------------------------------------
   KEYBOARD. Two rules, and the old handler broke both.

   1. If the player is standing on a control, the control gets the key. Arrow
      keys on the volume slider used to be swallowed by preventDefault before
      anything looked at the target, so the slider could not be moved from the
      keyboard at all; Space on a focused button both activated the button and
      started a run.
   2. A shortcut only fires in the context it belongs to. Enter on the menu's
      Reference button used to start a run AND open the reference.
   ------------------------------------------------------------------------ */
const EDITABLE = { INPUT: 1, TEXTAREA: 1, SELECT: 1, BUTTON: 1, SUMMARY: 1, A: 1, DETAILS: 1 };
function typingInto(el) {
  if (!el || el === document.body) return false;
  if (el.isContentEditable) return true;
  return !!EDITABLE[el.tagName];
}
/* Space and Enter belong to whatever is focused; the arrows belong to a range
   or a select. Everything else is free for the game. */
function ownedByFocus(e) {
  const el = document.activeElement;
  if (!typingInto(el)) return false;
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') return true;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT')
    return ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown'].includes(e.code);
  return false;
}

window.addEventListener('keydown', e => {
  // a browser or OS shortcut is never a game command
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.repeat) return;
  if (ownedByFocus(e)) return;

  // only now is the key ours, so only now is it safe to stop the page scrolling
  const nav = ['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (nav.includes(e.code)) e.preventDefault();
  keys[e.code] = true;

  if (e.code === 'KeyM') { SFX.toggleMute(); syncMuteButtons(); return; }

  /* ---- menu ---- */
  if (APP === 'menu') {
    if (e.code === 'Enter') { SFX.ui(); startGame(false); }
    else if (e.code === 'KeyT') { SFX.ui(); startGame(true); }
    else if (e.code === 'KeyC') { SFX.ui(); openCodex(); }
    else if (e.code === 'KeyO') { SFX.ui(); openOnline(); }
    return;
  }
  if (APP === 'codex') {
    if (e.code === 'Escape') { SFX.ui(); closeCodex(); }
    return;
  }
  if (APP === 'online') {
    if (e.code === 'Escape') { SFX.ui(); ui.onRoom.hidden ? closeOnline() : leaveRoom(); }
    return;
  }

  /* ---- the choice takes 1/2/3 and nothing else ---- */
  if (choiceOpen) {
    const n = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (n !== undefined && ui.chCards.children[n]) ui.chCards.children[n].click();
    return;
  }

  /* ---- story card eats input until dismissed ---- */
  if (storyOpen) {
    if (e.code === 'Enter' || e.code === 'Escape') { SFX.ui(); closeSectorCard(); }
    return;
  }

  if (!game) return;

  if (game.gameOver) {
    if (e.code === 'Enter') startGame(false);
    else if (e.code === 'Escape') showMenu();
    return;
  }

  /* Pause is the one command that works while paused — everything else below
     goes through Game.live and does nothing until the game is running again. */
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); SFX.ui(); return; }
  if (game.paused) return;

  switch (e.code) {
    case 'Space': game.piece ? game.hardDrop() : game.buyPiece(); break;
    case 'KeyW': case 'ArrowUp': game.rotate(1); break;
    case 'KeyA': case 'ArrowLeft': dragId = null; game.move(-1); game.dasDir = -1; game.das = CFG.das; break;
    case 'KeyD': case 'ArrowRight': dragId = null; game.move(1); game.dasDir = 1; game.das = CFG.das; break;
    case 'KeyS': case 'ArrowDown': game.stepDown(); break;
    case 'KeyC': game.holdPiece(); break;
    case 'KeyR': game.repair(); break;
    case 'KeyQ': game.ringBell(); break;
    case 'KeyE': game.soundRally(); break;
    case 'KeyF': game.mendWall(); break;
    case 'Enter': game.startWave(true); break;
  }
});

window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (!game) return;
  if ((e.code === 'KeyA' || e.code === 'ArrowLeft') && game.dasDir === -1) game.dasDir = 0;
  if ((e.code === 'KeyD' || e.code === 'ArrowRight') && game.dasDir === 1) game.dasDir = 0;
});

/* Losing the window used to keep the wave coming: the old handler cleared the
   held keys and let the simulation run on. A run should not be lost while the
   player is answering a message in another window, and coming back to a board
   that moved without them is worse than coming back to a pause. */
function stopInput() {
  for (const k in keys) keys[k] = false;
  dragId = null;
  gestureEnd();               // a finger still down when the window went away
  if (game) { game.dasDir = 0; game.softHold = 0; }
}
function pauseForAbsence() {
  stopInput();
  if (VS.live) return;            // the match clock does not wait for you
  // resuming stays the player's decision: the pause sheet is waiting for them
  if (game && APP === 'game' && !game.gameOver && !game.paused) togglePause(true);
}

/* ---- on-screen piece controls. Rotate, hold, soft drop and hard drop have no
   pointer equivalent otherwise, which leaves the game unplayable without a
   keyboard. Left and right auto-repeat while held, like the keys do. ---- */
function holdRepeat(btn, fn, first, gap) {
  let timer = null, tick = null;
  const stop = () => { clearTimeout(timer); clearInterval(tick); timer = tick = null; };
  btn.addEventListener('pointerdown', e => {
    if (!e.isPrimary || e.button !== 0) return;
    e.preventDefault();
    if (btn.disabled) return;
    fn();
    timer = setTimeout(() => { tick = setInterval(() => { if (btn.disabled) stop(); else fn(); }, gap); }, first);
  });
  for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) btn.addEventListener(ev, stop);
}

/* Esc closes whatever is on top; Tab is kept inside it. `inert` on the layers
   underneath does most of the work, but the browser will still wrap the focus
   ring out of an overlay and onto the address bar, so wrap it by hand. */
document.addEventListener('keydown', e => {
  if (e.code !== 'Tab') return;
  const top = topLayer();
  if (!top) return;
  const items = [...top.querySelectorAll(FOCUSABLE)].filter(visible);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!top.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
});

/* ---- mouse aiming. The section follows the cursor only while the left button
   is held: a hand resting on the mouse used to drag it across the field. Letting
   go does nothing at all, so the piece keeps falling and A / D take over again.
   Nothing here ever buys or drops a module. ---- */
let dragId = null;
function fieldColumn(clientX) {
  const rect = canvas.getBoundingClientRect();
  const world = (clientX - rect.left - game.originX) / game.scale;
  return Math.floor(world / CFG.cell);
}
function inField(clientX) {
  const c = fieldColumn(clientX);
  return c >= -1 && c <= CFG.cols;
}
function steerTo(clientX) {
  const p = game.piece;
  if (!p) return;
  /* Rotation states are seated in a fixed box, so a piece's occupied columns
     do not start at zero. Aim the middle of what is actually filled, and clamp
     against the real edges rather than against a width read off the maximum. */
  const lo = Math.min(...p.cells.map(c => c[0]));
  const hi = Math.max(...p.cells.map(c => c[0]));
  let target = fieldColumn(clientX) - lo - Math.floor((hi - lo + 1) / 2);
  target = Math.max(-lo, Math.min(CFG.cols - 1 - hi, target));
  let guard = CFG.cols;
  while (p.cx !== target && guard-- > 0) {
    if (!game.move(Math.sign(target - p.cx))) break;
  }
}
/* ---- what a finger can say. The hand is already on the field, and sending it
   up to a button to turn a section costs more than the turn does, so a touch
   gets a vocabulary of its own:

     tap             turn the section
     drag sideways   aim it, the same as the mouse
     hold            bring it down faster
     flick down      slam it
     flick up        put it in store

   All of it rests on telling a tap from a drag, which the mouse never had to
   do: a mouse aims the moment it is pressed. A finger cannot, or every tap
   would shove the section sideways before the turn arrived. So a touch sits
   still until it leaves a slop radius, and the direction it leaves in decides
   what the press was. That decision is final: a press that started aiming can
   no longer become a flick, because a hand drifting downwards at the end of a
   long drag must not slam.

   A downward press waits out FLICK_MS before it starts dropping rows. Reading
   it any sooner would mean a fast flick soft-drops on its way to slamming, and
   a section that locks halfway through hands the slam to the next one. ---- */
const GES = { SLOP: 10, HOLD_MS: 260, SOFT_MS: 55, FLICK: 34, FLICK_MS: 380 };
let touchG = null;             // the live gesture, null whenever a mouse is driving

function gestureEnd() {
  if (!touchG) return;
  clearTimeout(touchG.timer);
  clearInterval(touchG.soft);
  touchG = null;
}
/* Both the hold and the slow downward drag end up here. */
function gestureSoftDrop() {
  if (!touchG) return;
  touchG.mode = 'soft';
  game.stepDown();
  touchG.soft = setInterval(() => {
    // a key press clears dragId out from under us, and so does losing the window
    if (!touchG || touchG.id !== dragId || !game.live || !game.piece) { gestureEnd(); return; }
    game.stepDown();
  }, GES.SOFT_MS);
}

canvas.addEventListener('pointerdown', e => {
  if (!e.isPrimary || e.button !== 0) return;
  if (APP !== 'game' || storyOpen || choiceOpen) return;
  if (game.gameOver) { startGame(false); return; }
  if (!game.live || !game.piece || !inField(e.clientX)) return;
  canvas.setPointerCapture(e.pointerId);
  dragId = e.pointerId;
  e.preventDefault();
  if (e.pointerType !== 'touch') {
    steerTo(e.clientX);      // the press is the aim, no need to move first
    return;
  }
  gestureEnd();
  touchG = { id: e.pointerId, x: e.clientX, y: e.clientY, mode: 'wait', timer: 0, soft: 0 };
  touchG.timer = setTimeout(() => {
    if (touchG && touchG.mode === 'wait') gestureSoftDrop();
  }, GES.HOLD_MS);
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== dragId) return;
  if (!game.live) return;
  if (!touchG) { steerTo(e.clientX); return; }

  const dx = e.clientX - touchG.x, dy = e.clientY - touchG.y;
  if (touchG.mode === 'wait') {
    if (Math.abs(dx) < GES.SLOP && Math.abs(dy) < GES.SLOP) return;
    clearTimeout(touchG.timer);
    if (Math.abs(dx) >= Math.abs(dy)) {
      touchG.mode = 'aim';
    } else {
      /* Still undecided: a finger that lifts soon is a flick, one that stays
         down is a drag, and only the release can tell them apart. */
      touchG.mode = 'vert';
      touchG.timer = setTimeout(() => {
        if (touchG && touchG.mode === 'vert') gestureSoftDrop();
      }, GES.FLICK_MS);
      return;
    }
  }
  if (touchG.mode === 'aim') steerTo(e.clientX);
});

canvas.addEventListener('pointerup', e => {
  if (e.pointerId !== dragId) return;
  dragId = null;
  if (!touchG) return;
  const mode = touchG.mode;
  const dy = e.clientY - touchG.y;
  gestureEnd();
  if (!game.live || !game.piece) return;
  if (mode === 'wait') { game.rotate(1); SFX.ui(); return; }     // never moved, never held
  if (mode !== 'vert') return;                                   // an aim ends by just stopping
  if (dy >= GES.FLICK) game.hardDrop();
  else if (dy <= -GES.FLICK) game.holdPiece();
});

canvas.addEventListener('pointercancel', e => {
  if (e.pointerId !== dragId) return;
  dragId = null;
  gestureEnd();
});

window.addEventListener('resize', sizeMenuFx);

/* ==========================================================================
   VERSUS. Two people, one seed, two halves of the screen.

   The seed is the whole contract: STREAM reseeds the shared draws from
   (seed, wave), so both players get the same pieces, the same wave rosters and
   the same three cards no matter how differently they play. Nothing about the
   simulation is shared at runtime — each machine runs its own game, and all
   that crosses the wire is a picture of it, ten times a second, for the other
   half of the screen.

   There is no pause in a match, and losing the window does not stop the clock:
   a race where either side can freeze time is not a race. Everything else
   about the run is exactly the single-player game.
   ======================================================================== */
const VS = {
  state: 'off',           // 'off' | 'lobby' | 'countdown' | 'playing' | 'over'
  code: '',
  seed: 0,
  role: 'host',           // 'host' | 'guest'
  matchId: null,
  me:  { nick: '', held: 0, kills: 0, wave: 0, out: false },
  foe: { nick: '', held: 0, kills: 0, wave: 0, out: false, at: 0, joined: false },
  countdown: 0,
  goAt: 0,
  sendAt: 0,
  reported: false,
  _grid: '',              // last grid we sent, so an unchanged wall costs nothing
  get live() { return this.state === 'playing'; },
  get active() { return this.state === 'countdown' || this.state === 'playing' || this.state === 'over'; },
};
const VS_HZ = 10;                 // snapshots per second
const VS_TIMEOUT = 3.5;           // seconds of silence before we call it a drop

/* ------------------------------------------------------------------ wire ---
   One tiny interface, two implementations. `local` is a BroadcastChannel and
   works between two tabs of the same browser with no server at all — it is how
   the whole mode is testable offline, and it doubles as a hot-seat match on one
   machine. `remote` is a Supabase Realtime channel. Both deliver the same
   events, so nothing above this line knows which one is in use. */
const NET = {
  kind: 'none',
  ch: null,
  id: Math.random().toString(36).slice(2),
  handlers: {},
  on(k, fn) { (this.handlers[k] = this.handlers[k] || []).push(fn); return this; },
  fire(k, p) { for (const fn of (this.handlers[k] || [])) fn(p); },

  openLocal(code) {
    this.close();
    if (typeof BroadcastChannel === 'undefined') return false;
    this.kind = 'local';
    this.ch = new BroadcastChannel('greenhold:' + code);
    this.ch.onmessage = e => {
      const m = e.data;
      if (!m || m.from === this.id) return;     // our own shout, bounced back
      this.fire(m.k, m.p);
    };
    return true;
  },
  send(k, p) {
    if (!this.ch) return;
    if (this.kind === 'local') this.ch.postMessage({ k, p, from: this.id });
    else this.ch.send({ type: 'broadcast', event: k, payload: p });
  },
  close() {
    if (!this.ch) return;
    try { this.kind === 'local' ? this.ch.close() : this.ch.unsubscribe(); } catch (e) {}
    this.ch = null;
    this.kind = 'none';
  },
};

/* ----------------------------------------------------------------- ghost ---
   The opponent's field is a real Game object that is never updated: its fields
   are overwritten from the packets and then drawn with the ordinary renderer,
   which is why the mirror looks exactly like the game and not like a diagram. */
let ghost = null;

function makeGhost() {
  /* Constructing a Game fills a 7-bag, and that draws from the shared stream.
     Doing that here would shift our own piece order by however many shuffles
     the ghost helped itself to, so it gets a scratch stream for the duration. */
  const keep = STREAM.bag;
  STREAM.bag = new RNG(1);
  try {
    const g = new Game();
    g._next = [];
    g._byId = new Map();
    g.bag = { peek: n => g._next.slice(0, n), next: () => g._next[0] || 'I' };
    return g;
  } finally { STREAM.bag = keep; }
}

/* Draw any game into any canvas. The renderer is written against the module's
   single `ctx`/`CW`/`CH`, so the target is swapped around the call and put back
   in a finally — a throw inside the drawing must not leave the main loop
   painting into the opponent's half for the rest of the match. */
function renderInto(cv, g, dt) {
  const sCtx = ctx, sCW = CW, sCH = CH;
  try {
    ctx = cv._c2d || (cv._c2d = cv.getContext('2d'));
    CW = cv.clientWidth; CH = cv.clientHeight;
    g.draw(dt);
  } catch (e) {
  } finally {
    ctx = sCtx; CW = sCW; CH = sCH;
  }
}

/* -------------------------------------------------------------- the wire ---
   Everything is flat arrays of small integers: JSON of a heavy wave comes to a
   couple of kilobytes, and the wall is only sent when it has actually changed,
   which for a settled stack is almost never. */
const E_IDS = Object.keys(ENEMIES);
const T_IDS = Object.keys(TURRETS);

function packGrid(g) {
  const out = [];
  for (let y = 0; y < g.grid.length; y++)
    for (let x = 0; x < CFG.cols; x++) {
      const c = g.grid[y][x];
      if (c) out.push(x, y, T_IDS.indexOf(c.type), Math.max(1, Math.round(c.hp / c.max * 100)));
    }
  return out;
}

function snapshot(g) {
  const grid = packGrid(g);
  const key = grid.join(',');
  const changed = key !== VS._grid;
  VS._grid = key;
  return {
    hp: Math.round(g.hp), max: Math.round(g.maxHp), coins: Math.floor(g.coins),
    wave: g.wave, held: g.wavesHeld, kills: g.kills, armory: g.armory,
    phase: g.phase, prep: +Math.max(0, g.prepTimer).toFixed(2),
    left: g.enemiesLeft, total: g.waveTotal, over: g.gameOver,
    sector: g.sector.no, rift: +g.rift.toFixed(2), overheat: g.overheat,
    grid: changed ? grid : null,
    en: g.enemies.map(e => [e.uid, Math.round(e.x), Math.round(e.y),
        E_IDS.indexOf(e.type), Math.round(e.hp / e.max * 100), Math.round(e.spawnT * 100),
        (e.slow > 0 ? 1 : 0) | (e.burn > 0 ? 2 : 0) | (e.flash > 0 ? 4 : 0)]),
    sh: g.shots.map(s => [Math.round(s.x), Math.round(s.y), T_IDS.indexOf(s.def.key)]),
    bar: g.barrages.map(b => [b.col, +Math.max(0, b.t).toFixed(2)]),
    pc: g.piece ? [T_IDS.indexOf(g.piece.type), g.piece.rot, g.piece.cx, g.piece.cy] : null,
    hold: g.hold ? T_IDS.indexOf(g.hold) : -1,
    next: g.bag.peek(3).map(t => T_IDS.indexOf(t)),
    ban: g.banner ? [g.banner.text, g.banner.color, +g.banner.t.toFixed(2)] : null,
  };
}

function applySnapshot(g, p) {
  g.hp = p.hp; g.maxHp = p.max; g.coins = p.coins;
  g.wave = p.wave; g.armory = p.armory; g.kills = p.kills;
  g.phase = p.phase; g.prepTimer = p.prep; g.waveTotal = p.total;
  g.gameOver = p.over; g.overheat = p.overheat; g.rift = p.rift;
  g.toSpawn = Math.max(0, p.left - p.en.length);
  g.sector = SECTORS.find(s => s.no === p.sector) || SECTORS[0];

  if (p.grid) {
    let top = 0;
    for (let i = 1; i < p.grid.length; i += 4) top = Math.max(top, p.grid[i]);
    g.ensureRows(top + 2);
    for (let y = 0; y < g.grid.length; y++) g.grid[y].fill(null);
    for (let i = 0; i < p.grid.length; i += 4) {
      const x = p.grid[i], y = p.grid[i + 1], t = T_IDS[p.grid[i + 2]], hp = p.grid[i + 3];
      const def = TURRETS[t];
      if (!def) continue;
      g.grid[y][x] = { type: t, color: def.color, hp, max: 100, cd: 0,
                       flash: 0, muzzle: 0, strain: 0, off: 0,
                       seed: ((x * 31 + y * 17) % 97) / 97 };
    }
  }

  /* Enemies are matched by id and reused, so the mirror can glide them between
     packets instead of teleporting them ten times a second. */
  const seen = new Set();
  const list = [];
  for (const row of p.en) {
    const [uid, x, y, ti, hpPct, spawn, flags] = row;
    const def = ENEMIES[E_IDS[ti]];
    if (!def) continue;
    seen.add(uid);
    let e = g._byId.get(uid);
    if (!e) {
      e = { uid, type: def.id, def, x, y, tx: x, ty: y, max: 100, hp: hpPct,
            walk: (uid * 1.7) % 6.3, phase: (uid * 2.3) % 6.3,
            spawnT: spawn / 100, slow: 0, burn: 0, flash: 0, healRange: def.healRange };
      g._byId.set(uid, e);
    }
    e.tx = x; e.ty = y;
    e.hp = hpPct; e.max = 100;
    e.spawnT = spawn / 100;
    e.slow = (flags & 1) ? 1 : 0;
    e.burn = (flags & 2) ? 1 : 0;
    if (flags & 4) e.flash = 0.1;
    list.push(e);
  }
  for (const uid of [...g._byId.keys()]) if (!seen.has(uid)) g._byId.delete(uid);
  g.enemies = list;

  g.shots = p.sh.map(([x, y, ti]) => {
    const def = TURRETS[T_IDS[ti]] || TURRETS.I;
    return { x, y, tx: x, ty: y, def, color: def.color, arc: !!def.arc, t: 0 };
  });
  g.barrages = p.bar.map(([col, t]) => ({ col, t, dead: false }));

  const pt = p.pc && T_IDS[p.pc[0]];
  if (pt && ROTATIONS[pt]) {
    g.piece = { type: pt, rot: p.pc[1], cells: ROTATIONS[pt][p.pc[1]].map(c => c.slice()),
                cx: p.pc[2], cy: p.pc[3] };
    g.visY = p.pc[3];
  } else g.piece = null;

  g.hold = p.hold >= 0 ? T_IDS[p.hold] : null;
  g._next = p.next.map(i => T_IDS[i] || 'I');
  g.banner = p.ban ? { text: p.ban[0], color: p.ban[1], t: p.ban[2], life: 2.2 } : null;
}

/* Between packets the mirror animates on its own: positions ease towards the
   last thing we heard, and the decorative timers keep running, so the field
   reads as a live game rather than a slideshow at ten frames a second. */
function ghostTick(dt) {
  if (!ghost) return;
  ghost.time += dt;
  const k = ease(dt, 14);
  for (const e of ghost.enemies) {
    e.x += (e.tx - e.x) * k;
    e.y += (e.ty - e.y) * k;
    e.walk += dt * 5.5;
    if (e.flash > 0) e.flash -= dt;
  }
  for (const s of ghost.shots) { s.x += (s.tx - s.x) * k; s.y += (s.ty - s.y) * k; }
  for (const b of ghost.barrages) b.t = Math.max(0, b.t - dt);
  if (ghost.banner) {
    ghost.banner.t += dt;
    if (ghost.banner.t > ghost.banner.life) ghost.banner = null;
  }
  ghost.updateSettle(dt);
}

/* --------------------------------------------------------------- the run ---*/
function vsBeginMatch(seed) {
  VS.state = 'countdown';
  VS.countdown = 3;
  VS.goAt = performance.now() / 1000 + 3;
  VS.seed = seed >>> 0;
  VS.reported = false;
  VS._grid = '';
  VS.me.out = VS.foe.out = false;
  VS.me.held = VS.foe.held = 0;
  VS.me.kills = VS.foe.kills = 0;
  VS.foe.at = performance.now() / 1000;
  ghost = makeGhost();
  ui.halfFoe.hidden = false;
  ui.barMe.hidden = false;
  closeOnline();
  startGame(false, VS.seed);
  resize();
  vsSyncBars();
}

function vsEndMatch() {
  VS.state = 'off';
  ghost = null;
  ui.halfFoe.hidden = true;
  ui.barMe.hidden = true;
  ui.linkWarn.hidden = true;
  NET.close();
  resize();
}

/* Called every frame while a match is on: run the clock, ship a snapshot on
   schedule, notice a death, notice a silence. */
function vsTick(dt) {
  const now = performance.now() / 1000;

  if (VS.state === 'countdown') {
    const was = Math.ceil(VS.countdown);
    VS.countdown = Math.max(0, VS.goAt - now);
    const left = Math.ceil(VS.countdown);
    if (game) {
      game.paused = VS.countdown > 0;
      // one banner per whole second, so it counts rather than flickers
      if (left !== was) { game.banner = null; game.setBanner(T('vs_go', left), '#cf8a24'); }
    }
    if (VS.countdown <= 0) { VS.state = 'playing'; if (game) game.paused = false; }
    vsSyncBars();
    return;
  }
  if (!VS.active) return;

  // our own standing, and the moment we go out
  if (game && !VS.me.out) {
    VS.me.wave = game.wave;
    VS.me.held = game.wavesHeld;
    VS.me.kills = game.kills;
    if (game.gameOver) {
      VS.me.out = true;
      NET.send('dead', { held: VS.me.held, kills: VS.me.kills });
      vsMaybeFinish();
    }
  }

  if (now >= VS.sendAt && game && !VS.me.out) {
    VS.sendAt = now + 1 / VS_HZ;
    NET.send('s', snapshot(game));
  }

  // the opponent's line going quiet is information the player needs
  const gone = now - VS.foe.at > VS_TIMEOUT && !VS.foe.out;
  if (ui.linkWarn.hidden === gone) {
    ui.linkWarn.hidden = !gone;
    put(ui.linkWarn, T('vs_lost'));
  }
  vsSyncBars();
}

function vsMaybeFinish() {
  if (VS.state !== 'playing' || !(VS.me.out && VS.foe.out)) return;
  VS.state = 'over';
  const mine = VS.me.held, theirs = VS.foe.held;
  const won = mine > theirs || (mine === theirs && VS.me.kills > VS.foe.kills);
  const draw = mine === theirs && VS.me.kills === VS.foe.kills;
  VS.result = draw ? 'draw' : (won ? 'win' : 'loss');
  recordMatch();
  syncModal();
}

function vsSyncBars() {
  if (!VS.active) return;
  const me = VS.me, foe = VS.foe;
  put(ui.meNick, me.nick || T('vs_you'));
  put(ui.foeNick, foe.nick || T('vs_foe'));
  const mine = VS.state === 'countdown' ? T('vs_ready') : T('vs_standing', me.held, me.kills);
  const yours = VS.state === 'countdown' ? (foe.joined ? T('vs_ready') : T('vs_waiting'))
                                         : T('vs_standing', foe.held, foe.kills);
  put(ui.meState, me.out ? T('vs_out') + ' · ' + mine : mine);
  put(ui.foeState, foe.out ? T('vs_out') + ' · ' + yours : yours);
  cls(ui.barMe, 'out', me.out);
  cls(ui.barFoe, 'out', foe.out);
  cls(ui.barMe, 'lead', me.held > foe.held);
  cls(ui.barFoe, 'lead', foe.held > me.held);
}

NET.on('s', p => {
  VS.foe.at = performance.now() / 1000;
  VS.foe.joined = true;
  VS.foe.wave = p.wave;
  VS.foe.held = p.held;
  VS.foe.kills = p.kills;
  if (ghost) applySnapshot(ghost, p);
});
NET.on('dead', p => {
  VS.foe.at = performance.now() / 1000;
  VS.foe.out = true;
  VS.foe.held = p.held;
  VS.foe.kills = p.kills;
  vsMaybeFinish();
});
NET.on('left', () => {
  // the other side walked away: the match is decided and the survivor takes it
  if (!VS.active) return;
  VS.foe.out = true;
  if (!VS.me.out) {
    VS.me.out = true;
    VS.me.held = game ? game.wavesHeld : 0;
    VS.me.kills = game ? game.kills : 0;
    if (game) game.endRun();          // the run ends with the match
  }
  vsMaybeFinish();
});

   The Supabase client is fetched the first time this screen opens, which keeps
   the single-player game exactly as self-contained as it was: no network at
   all until you ask for an opponent.

   If the backend is unreachable — or anonymous sign-in is switched off in the
   project — the screen falls back to local rooms over BroadcastChannel. Two
   tabs on one machine play a full match that way, with no server at all.
   ======================================================================== */
const SB_URL  = 'https://hevmxtceexxryyaziact.supabase.co';
const SB_KEY  = 'sb_publishable_bOTZEkhtcF_e4uEnbh8sIg_446FBKh5';
/* Served from here rather than from a CDN, for the same reason as the fonts:
   a script tag pointed at jsdelivr.net hands the player's address to a third
   party. It is milder than the fonts were, since nothing loads until someone
   opens the online screen, but it is the same leak and it costs nothing to
   close. Pinned by copy rather than by a floating `@2` range, so the bundle
   cannot change under the game without anyone deciding that it should. */
const SB_CDN  = 'assets/vendor/supabase.js';   // supabase-js 2.116.0

const SB = {
  // `offline`: no client at all. `noAuth`: a client, but nobody can sign in
  // (anonymous sign-in switched off in the project) — rooms still work.
  lib: null, client: null, user: null, profile: null, offline: false, noAuth: false,
  get on() { return !!this.client && !!this.user; },
};

function loadScript(src) {
  return new Promise((ok, no) => {
    const el = document.createElement('script');
    el.src = src; el.async = true;
    el.onload = () => ok();
    el.onerror = () => no(new Error('cdn'));
    document.head.appendChild(el);
  });
}

async function sbInit() {
  if (SB.client || SB.offline) return SB.client;
  try {
    if (!window.supabase) await loadScript(SB_CDN);
    SB.client = window.supabase.createClient(SB_URL, SB_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'hf_auth' },
      realtime: { params: { eventsPerSecond: 20 } },
    });
    const { data } = await SB.client.auth.getSession();
    if (data && data.session) {
      SB.user = data.session.user;
      await sbLoadProfile();
    }
  } catch (e) {
    SB.offline = true;                 // no CDN, no network, or a blocked script
    SB.client = null;
  }
  return SB.client;
}

async function sbLoadProfile() {
  if (!SB.client || !SB.user) return null;
  const { data } = await SB.client.from('profiles').select('*').eq('id', SB.user.id).maybeSingle();
  SB.profile = data || null;
  return SB.profile;

/* One nickname, one anonymous user, one profile row. The unique index on
   lower(nick) is what makes "taken" an answer rather than a race. */
async function sbSignIn(nick) {
  await sbInit();
  if (!SB.client) throw new Error('offline');
  if (SB.noAuth) throw new Error('anonymous sign-ins are disabled');
  if (!SB.user) {

    if (error) throw error;
    SB.user = data.user;
  }

    .upsert({ id: SB.user.id, nick }, { onConflict: 'id' });
  if (error) throw error;
  await sbLoadProfile();
  return SB.profile;
}

async function sbSignOut() {
  if (SB.client) { try { await SB.client.auth.signOut(); } catch (e) {} }
  SB.user = null; SB.profile = null;
}

/* The personal best follows the profile, so it is the same number on any device
   the account is opened on. The comparison happens in the database — a client
   that has been open for an hour has no business deciding whether its cached
   copy of the number is still the highest one. */
async function sbPushBest(held) {
  if (!SB.on || !held) return;
  if (SB.profile) SB.profile.best_wave = Math.max(SB.profile.best_wave || 0, held);
  try { await SB.client.rpc('bump_best', { held }); } catch (e) {}
}

async function sbBoard() {

    .select('nick,best_wave,matches_won,matches_played')
    .order('best_wave', { ascending: false }).limit(10);

}

/* ------------------------------------------------------------- the room ---
   Both transports carry the same four events, so the lobby below does not know
   or care which one it is talking over. */
const ROOM = { code: '', host: false, ready: false, foeReady: false, remote: false };
const roomCode = () => {
  // no I, O, 0 or 1: a code is read aloud or typed from a screenshot
  const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 5; i++) out += abc[(Math.random() * abc.length) | 0];
  return out;
};

async function openRoomChannel(code) {
  ROOM.remote = false;
  if (SB.client) {
    try {
      NET.close();
      NET.kind = 'remote';
      const ch = SB.client.channel('match:' + code, { config: { broadcast: { self: false } } });
      for (const k of ['s', 'dead', 'left', 'hello', 'welcome', 'ready', 'go'])
        ch.on('broadcast', { event: k }, m => NET.fire(k, m.payload));
      /* subscribe() hands the channel back before the join has actually
         completed, and anything sent in that window is dropped on the floor —
         which is how the host's very first reply to a join went missing. Wait
         for the real status, and give up rather than hang. */
      const joined = await new Promise(done => {
        const bail = setTimeout(() => done(false), 8000);
        ch.subscribe(status => {
          if (status === 'SUBSCRIBED') { clearTimeout(bail); done(true); }
          else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') { clearTimeout(bail); done(false); }
        });
      });
      if (joined) { NET.ch = ch; ROOM.remote = true; return true; }
      try { ch.unsubscribe(); } catch (e2) {}
    } catch (e) { /* fall through to the local channel */ }
  }
  return NET.openLocal(code);
}

async function hostRoom() {
  const code = roomCode();
  ROOM.code = code; ROOM.host = true; ROOM.ready = false; ROOM.foeReady = false;
  VS.role = 'host';
  VS.code = code;
  VS.seed = newSeed();
  VS.foe.joined = false;
  VS.foe.nick = '';
  VS.me.nick = myNick();
  await openRoomChannel(code);
  if (SB.on) {
    const { data } = await SB.client.from('matches')
      .insert({ code, seed: VS.seed, host_id: SB.user.id }).select('id').maybeSingle();
    VS.matchId = data ? data.id : null;
  }
  VS.state = 'lobby';
  showRoom();
}

async function joinRoom(code) {
  code = (code || '').toUpperCase().trim();
  if (!/^[A-Z0-9]{5}$/.test(code)) { onError(T('on_codeBad')); return; }
  ROOM.code = code; ROOM.host = false; ROOM.ready = false; ROOM.foeReady = false;
  VS.role = 'guest';
  VS.code = code;
  VS.me.nick = myNick();
  VS.foe.joined = false;
  await openRoomChannel(code);
  if (SB.on) {
    const { data } = await SB.client.from('matches')
      .select('id,seed,host_id').eq('code', code).eq('status', 'open').maybeSingle();
    if (data) {
      VS.matchId = data.id;
      VS.seed = Number(data.seed) >>> 0;
      await SB.client.from('matches').update({ guest_id: SB.user.id }).eq('id', data.id);
    }
  }
  VS.state = 'lobby';
  showRoom();
  /* Knock until somebody answers. A single hello is at the mercy of whether the
     host's channel happened to be listening at that instant, and a lobby that
     silently never pairs up is the worst failure this screen can have. */
  knock();
}
function knock(n) {
  n = n || 0;
  if (VS.state !== 'lobby' || VS.foe.joined || n > 10) return;
  NET.send('hello', { nick: VS.me.nick });
  setTimeout(() => knock(n + 1), 800);
}

function leaveRoom() {
  NET.send('left', {});
  NET.close();
  VS.state = 'off';
  ROOM.code = ''; ROOM.ready = false; ROOM.foeReady = false;
  showOnlineHome();
}

function toggleReady() {
  ROOM.ready = !ROOM.ready;
  NET.send('ready', { nick: VS.me.nick, ready: ROOM.ready });
  maybeStart();
  renderRoom();
}

function maybeStart() {
  if (VS.state !== 'lobby') return;          // the match has already begun
  if (!ROOM.host || !ROOM.ready || !ROOM.foeReady || !VS.foe.joined) return;
  NET.send('go', { seed: VS.seed });
  if (SB.on && VS.matchId)
    SB.client.from('matches').update({ status: 'playing', started_at: new Date().toISOString() })
      .eq('id', VS.matchId).then(() => {}, () => {});
  vsBeginMatch(VS.seed);
}

NET.on('hello', p => {
  VS.foe.joined = true;
  VS.foe.nick = p.nick || T('vs_foe');
  if (ROOM.host) {
    NET.send('welcome', { nick: VS.me.nick, seed: VS.seed });
    // and say again where we stand, in case that went missing too
    if (ROOM.ready) NET.send('ready', { nick: VS.me.nick, ready: true });
  }
  renderRoom();
});
NET.on('welcome', p => {
  VS.foe.joined = true;
  VS.foe.nick = p.nick || T('vs_foe');
  VS.seed = p.seed >>> 0;
  renderRoom();
});
NET.on('ready', p => {
  VS.foe.joined = true;
  if (p.nick) VS.foe.nick = p.nick;
  ROOM.foeReady = !!p.ready;
  maybeStart();
  renderRoom();
});
NET.on('go', p => {
  if (VS.state !== 'lobby') return;
  vsBeginMatch(p.seed >>> 0);
});

/* the result of a finished match, written by whichever side gets there first */
async function pushMatchResult() {
  const held = VS.me.held, won = VS.result === 'win';
  if (!SB.on) { sbPushBest(held); return; }
  try {
    // one call, and the counting is done where the row is
    await SB.client.rpc('finish_match', { won, held });
    if (SB.profile) {
      SB.profile.matches_played = (SB.profile.matches_played || 0) + 1;
      SB.profile.matches_won = (SB.profile.matches_won || 0) + (won ? 1 : 0);
      SB.profile.best_wave = Math.max(SB.profile.best_wave || 0, held);
    }
    if (VS.matchId) {
      /* Both players write this row, so each one writes only what it knows.
         Naming the winner is the winner's job alone: when the loser also wrote
         the field — as null — whichever of the two landed second decided it,
         and a finished match ended up with nobody having won it. */
      const mine = ROOM.host ? 'host' : 'guest', yours = ROOM.host ? 'guest' : 'host';
      const row = { status: 'done', ended_at: new Date().toISOString() };
      row[mine + '_waves'] = VS.me.held;  row[mine + '_kills'] = VS.me.kills;
      row[yours + '_waves'] = VS.foe.held; row[yours + '_kills'] = VS.foe.kills;
      if (won) row.winner_id = SB.user.id;
      await SB.client.from('matches').update(row).eq('id', VS.matchId);
    }
  } catch (e) { /* a lost result is not worth interrupting the game for */ }
}

/* ---------------------------------------------------------------- screen ---*/
const myNick = () => (SB.profile && SB.profile.nick) || STORE.raw('nick', '') || T('vs_you');

function onError(msg) {
  put(ui.onErr, msg || '');
  ui.onErr.hidden = !msg;
}

async function openOnline() {
  onlineReturnTo = APP;
  APP = 'online';
  ui.online.hidden = false;
  ui.menu.hidden = true;
  ui.modal.hidden = true;
  onError('');
  put(ui.onWait, T('on_connecting'));
  ui.onWait.hidden = false;
  applyLayers();
  await sbInit();
  ui.onWait.hidden = true;
  if (SB.on && !SB.profile) await sbLoadProfile();
  if (SB.on && SB.profile) showOnlineHome(); else showOnlineAuth();
}
let onlineReturnTo = 'menu';
function closeOnline() {
  if (!ui.online || ui.online.hidden) return;
  ui.online.hidden = true;
  if (VS.active) { APP = 'game'; applyLayers(); return; }
  if (onlineReturnTo === 'game' && game) { APP = 'game'; syncModal(); }
  else showMenu();
}

function showOnlineAuth() {
  ui.onAuth.hidden = false; ui.onHome.hidden = true; ui.onRoom.hidden = true;
  put(ui.onAuthHint, (SB.offline || SB.noAuth) ? T('on_offlineHint') : T('on_authHint'));
  ui.onNick.value = STORE.raw('nick', '') || '';
  applyLayers();
}

async function showOnlineHome() {
  ui.onAuth.hidden = true; ui.onHome.hidden = false; ui.onRoom.hidden = true;
  const p = SB.profile;
  put(ui.onWho, p ? T('on_who', p.nick, p.best_wave || 0, p.matches_won || 0, p.matches_played || 0)
                  : T('on_whoLocal', myNick()));
  ui.onOut.hidden = !SB.on;
  renderBoard();
  applyLayers();
}

async function renderBoard() {
  if (!SB.on) { ui.onBoard.innerHTML = '<div class="bempty">' + T('on_boardOffline') + '</div>'; return; }
  const rows = await sbBoard();
  if (!rows.length) { ui.onBoard.innerHTML = '<div class="bempty">' + T('on_boardEmpty') + '</div>'; return; }
  ui.onBoard.innerHTML = '<div class="bhead">' + T('on_board') + '</div>' + rows.map((r, i) =>
    '<div class="brow"><span class="bno">' + (i + 1) + '</span>' +
    '<span class="bnick">' + esc(r.nick) + '</span>' +
    '<span class="bwave">' + T('on_rank', r.best_wave || 0) + '</span>' +
    '<span class="bwon">' + T('on_record', r.matches_won || 0, r.matches_played || 0) + '</span></div>').join('');
}
/* a nickname is other people's text: it goes in as text, never as markup */
const esc = t => String(t).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function showRoom() {
  ui.onAuth.hidden = true; ui.onHome.hidden = true; ui.onRoom.hidden = false;
  renderRoom();
  applyLayers();
}
function renderRoom() {
  if (ui.onRoom.hidden) return;
  put(ui.onRoomCode, ROOM.code);
  put(ui.onRoomHint, ROOM.remote ? T('on_roomHint') : T('on_roomHintLocal'));
  ui.onPlayers.innerHTML =
    '<li><b>' + esc(VS.me.nick) + '</b> <span>' + T(ROOM.ready ? 'on_isReady' : 'on_notReady') + '</span></li>' +
    '<li><b>' + (VS.foe.joined ? esc(VS.foe.nick) : '—') + '</b> <span>' +
      (VS.foe.joined ? T(ROOM.foeReady ? 'on_isReady' : 'on_notReady') : T('on_waitFoe')) + '</span></li>';
  put(ui.onReady, T(ROOM.ready ? 'on_unready' : 'on_ready'));
  cls(ui.onReady, 'sel', ROOM.ready);
  // only the host may pull the trigger, and only once both sides are in
  dis(ui.onReady, !VS.foe.joined && !ROOM.host);
}

function recordMatch() { pushMatchResult(); }

/* ============================== BOOT ==================================== */
game = new Game();
applySettings();
applyLanguage();
syncMuteButtons();
syncFullscreenButton();
showMenu();

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (APP === 'game') {
    /* Training holds the world at a crawl while a card is being read; every
       other run gets the real clock. The draw still gets real seconds, so the
       camera and the clouds keep their own pace and only the game slows. */
    game.update(game.tutorial ? dt * tutTimeScale() : dt);
    game.draw(dt);
    game.syncUI();
    if (VS.active) {
      // the opponent's half: glide what we last heard, then draw it with the
      // ordinary renderer pointed at the other canvas
      ghostTick(dt);
      renderInto(ghostCanvas, ghost, dt);
      vsTick(dt);
    }
    if (game.tutorial) tutorialTick(dt);
    if (game.gameOver && ui.modal.hidden && !VS.live) syncModal();
  } else if (APP === 'menu') {
    drawMenuFx(dt);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
