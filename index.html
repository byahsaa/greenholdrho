        const x = X(hx + life * 18), y = Y(base + hh + 14 + life * 46), r = (4 + life * 10) * k;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, 'rgba(250,248,244,' + (.55 * Math.sin(Math.PI * life)).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(250,248,244,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
      }
    }

    // the bell tower: the bell you ring hangs in that open top
    const bx = -176, bw = 26;
    ctx.fillStyle = H('#d3cbb7');
    ctx.fillRect(X(bx - bw), Y(base + 92), bw * k, 92 * k);
    ctx.fillStyle = 'rgba(80,66,50,.6)';
    ctx.fillRect(X(bx - bw * .72), Y(base + 84), bw * .44 * k, 13 * k);
    ctx.fillStyle = H('#c99a3a');
    ctx.beginPath(); ctx.arc(X(bx - bw / 2), Y(base + 76), 4.2 * k, Math.PI, 0); ctx.fill();
    ctx.fillStyle = H('#6f7c93');
    ctx.beginPath();
    ctx.moveTo(X(bx - bw - 3), Y(base + 92)); ctx.lineTo(X(bx - bw / 2), Y(base + 132));
    ctx.lineTo(X(bx + 3), Y(base + 92)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = H('#6f7c93'); ctx.lineWidth = Math.max(1, 1.5 * k);
    ctx.beginPath(); ctx.moveTo(X(bx - bw / 2), Y(base + 132)); ctx.lineTo(X(bx - bw / 2), Y(base + 142)); ctx.stroke();

    // round trees between the roofs
    ctx.fillStyle = H('#86ad62');
    for (const [x, r] of [[-150, 13], [-205, 11], [-330, 14], [-455, 12], [-520, 15]]) {
      ctx.beginPath(); ctx.arc(X(x), Y(base + r * 1.6), r * k, 0, 6.3); ctx.fill();
    }

    // the town wall, crenellated, with the gate by the Heart
    const wallL = -540;
    ctx.fillStyle = H('#cfc5ad');
    ctx.fillRect(X(wallL), Y(20), (-wallL) * k, 20 * k);
    ctx.fillStyle = 'rgba(96,82,60,.28)';
    ctx.fillRect(X(wallL), Y(20), (-wallL) * k, 3 * k);
    ctx.fillStyle = H('#cfc5ad');
    for (let x = wallL; x < -2; x += 12) ctx.fillRect(X(x), Y(26), 6 * k, 6 * k);
    // gatehouse
    ctx.fillStyle = H('#c7bca2');
    ctx.fillRect(X(-40), Y(42), 38 * k, 42 * k);
    for (let x = -40; x < -4; x += 10) ctx.fillRect(X(x), Y(48), 6 * k, 6 * k);
    ctx.fillStyle = 'rgba(70,56,40,.55)';
    ctx.beginPath();
    ctx.moveTo(X(-30), horizon); ctx.lineTo(X(-30), Y(16));
    ctx.arc(X(-21), Y(16), 9 * k, Math.PI, 0);
    ctx.lineTo(X(-12), horizon); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  /* THE TRAINING CAMERA. While a card is about something on the field, the
     view leans in on it: the Heart fills the free part of the screen when the
     card says "this is the Heart", the yard when the card is about building,
     the tear when the machines first come through. It is a blend on top of
     the ordinary framing above, so leaving a card eases straight back to it.

     The blend moves the focus point on screen from wherever the normal view
     has it to where the close-up wants it, while the scale travels
     geometrically; a plain lerp of two origins swings the subject out of
     frame halfway through. Input reads originX/scale like everything else, so
     aiming stays exact while zoomed. */
  applyCoachCamera(dt) {
    const want = this.coachView();
    this.camK = this.camK || 0;
    this.camK += ((want ? 1 : 0) - this.camK) * ease(dt, 3.4);
    if (want) {
      if (!this.cam || this.camK < .03) this.cam = Object.assign({}, want);
      else {
        const e = ease(dt, 3.8), c = this.cam;
        c.x += (want.x - c.x) * e; c.y += (want.y - c.y) * e;
        c.px += (want.px - c.px) * e; c.py += (want.py - c.py) * e;
        c.s = Math.exp(Math.log(c.s) + (Math.log(want.s) - Math.log(c.s)) * e);
      }
    }
    if (!this.cam) return;
    if (this.camK < .002 && !want) { this.cam = null; this.camK = 0; return; }
    const k = this.camK * this.camK * (3 - 2 * this.camK);       // smoothstep
    const c = this.cam, s0 = this.scale;
    const bx = this.originX + c.x * s0, by = this.originY - c.y * s0;
    const s1 = Math.exp(Math.log(s0) + (Math.log(c.s) - Math.log(s0)) * k);
    const px = bx + (c.px - bx) * k, py = by + (c.py - by) * k;
    this.scale = s1;
    this.originX = px - c.x * s1;
    this.originY = py + c.y * s1;
  }

  /* What the current card wants framed, as a world rectangle fitted into the
     part of the field the card itself is not covering. Null when nothing. */
  coachView() {
    const t = this.tutorial;
    if (!t || ui.tut.hidden || choiceOpen || storyOpen) return null;
    const s = TUT_STEPS[t.step];
    if (!s || !s.cam) return null;
    // a live card leans in only while its reading window runs, then hands the
    // player the whole field back for the fight
    if (s.live && !(t.read > 0)) return null;
    const cell = CFG.cell, boardW = CFG.cols * cell;
    let l, r, b, tp;
    if (s.cam === 'core') {
      l = -CFG.coreW - 40; r = 44; b = -14; tp = CFG.coreH + 56;
    } else if (s.cam === 'board') {
      let hi = Math.max(this.topRow() + 1, 3);
      if (this.piece) hi = Math.max(hi, this.visY + Math.max(...this.piece.cells.map(c => c[1])) + 1);
      l = -CFG.coreW - 14; r = boardW + 26; b = -16; tp = (hi + 2.2) * cell;
      // a row card hangs its signboard off the right end of the row: leave room
      if (s.spot === 'row') r += 190;
    } else if (s.cam === 'line') {
      /* the line only means something measured against the ground and the
         stack, so this one pulls back to take in both, with room on the
         right for its signboard */
      l = -CFG.coreW - 14; r = boardW + 210;
      b = -16; tp = (CFG.overheatRow + 2.6) * cell;
    } else if (s.cam === 'rift') {
      const rx = boardW + CFG.approach;
      l = rx - 230; r = rx + 90; b = -16; tp = 262;
    } else return null;
    const a = coachFreeArea();
    const fw = Math.max(80, a.r - a.l), fh = Math.max(80, a.b - a.t);
    let sc = Math.max(CFG.minZoom, Math.min(CFG.coachMaxZoom, fw / (r - l), fh / (tp - b)));
    /* The Heart gets a real close-up once. The yard and the tear only lean in
       a little: those cards are read while you build or watch, and a close-up
       there hides the rest of the field. */
    const base = this.viewScale || sc;
    if (s.cam === 'board') sc = Math.min(sc, base * 1.35);
    else if (s.cam === 'rift') sc = Math.min(sc, base * 1.6);
    /* When the framed thing is shorter than the space, stand it on the bottom
       of the frame rather than floating it in the middle: these are all
       things on the ground, and a band of soil under them reads as a gap. */
    const rectH = (tp - b) * sc;
    const py = rectH < fh ? a.b - rectH / 2 : (a.t + a.b) / 2;
    return { x: (l + r) / 2, y: (b + tp) / 2, s: sc, px: (a.l + a.r) / 2, py };
  }

  /* world → screen */
  sx(wx) { return this.originX + wx * this.scale; }
  sy(wy) { return this.originY - wy * this.scale; }
  get readK() { return Math.max(1, CFG.minReadScale / this.scale); }

  drawGround() {
    const w = CFG.cols * CFG.cell + CFG.approach;
    /* The ground runs edge to edge of the canvas, however wide the window is.
       It used to stop just past the tear, and on a wide screen everything to
       the right of that was bare canvas. Past the tear it is the harvest's side
       of the valley: the grass taken off square by square, bare soil left. */
    const sc = this.scale || 1;
    const xl = Math.floor(Math.min(-CFG.coreW - 20, -this.originX / sc - 12) / 7) * 7;
    const xr = Math.max(w + 20, (CW - this.originX) / sc + 12);
    const bare = w + 26;                     // where the harvested ground begins
    const depth = Math.max(40, (CH - this.originY) / sc + 4);

    // turf: soil band under a lip of grass
    ctx.fillStyle = '#6f5233';
    ctx.fillRect(xl, 0, xr - xl, depth);
    ctx.fillStyle = '#5f8a3c';
    ctx.fillRect(xl, 0, bare - xl, 7);
    ctx.fillStyle = '#74a349';
    ctx.fillRect(xl, 0, bare - xl, 3.5);

    if (xr > bare) {
      // the far side: soil gone grey, and the turf lifted in cell-sized squares
      ctx.fillStyle = 'rgba(58,54,62,.22)';
      ctx.fillRect(bare, 0, xr - bare, depth);
      ctx.fillStyle = '#5d5448';
      ctx.fillRect(bare, 0, xr - bare, 3);
      for (let x = bare + 6; x < xr; x += 38) {
        const n = (x * 13) % 7;
        if (n < 4) {
          ctx.fillStyle = 'rgba(36,30,26,.35)';
          ctx.fillRect(x, 0, 14 + n * 3, 5 + (n % 2) * 2);
        } else {
          // a last square of turf the harvest has not reached yet
          ctx.fillStyle = '#5f8a3c';
          ctx.fillRect(x, -2, 12, 5);
          ctx.fillStyle = '#74a349';
          ctx.fillRect(x, -2, 12, 2);
        }
      }
    }

    // blades along the lip — the settlement stands in real grass
    ctx.strokeStyle = 'rgba(96,140,62,.85)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (let x = xl; x < bare; x += 7) {
      const h = 4 + ((Math.abs(x) * 37) % 5);
      const lean = Math.sin(this.time * .8 + x * .09) * 1.8;
      ctx.moveTo(x, 0);
      ctx.lineTo(x + lean, -h);
    }
    ctx.stroke();

    // pebbles in the soil
    ctx.fillStyle = 'rgba(255,255,255,.09)';
    for (let x = xl; x < xr; x += 29) {
      const ax = Math.abs(x);
      const yy = 12 + ((ax * 13) % 22);
      ctx.fillRect(x + ((ax * 7) % 11), yy, 3, 2);
    }

    const oy = -CFG.overheatRow * CFG.cell;
    const hy = -CFG.heightLimit * CFG.cell;
    ctx.fillStyle = this.overheat ? 'rgba(191,68,51,.13)' : 'rgba(191,68,51,.05)';
    ctx.fillRect(0, hy, CFG.cols * CFG.cell, oy - hy);
    ctx.strokeStyle = 'rgba(191,68,51,.6)'; ctx.lineWidth = 1.2;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(CFG.cols * CFG.cell, oy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(191,68,51,.9)';
    ctx.beginPath(); ctx.moveTo(0, hy); ctx.lineTo(CFG.cols * CFG.cell, hy); ctx.stroke();

    // building plots, marked out in the turf like a foundation grid
    ctx.strokeStyle = 'rgba(70,55,32,.1)'; ctx.lineWidth = 1;
    const t = Math.min(CFG.overheatRow, Math.max(this.topRow() + 3, 5));
    for (let x = 0; x <= CFG.cols; x++) {
      ctx.beginPath();
      ctx.moveTo(x * CFG.cell, 0);
      ctx.lineTo(x * CFG.cell, -t * CFG.cell);
      ctx.stroke();
    }
  }

  /* THE FARMER. Whoever is holding this valley together: straw hat, overalls,
     a pitchfork, standing at the town gate beside the Heart and facing the
     ridge. Idle most of the time, he flinches when the Heart takes a hit and
     throws the fork up when the bell goes. World space, so he sits on the
     turf and scales with everything else. */
  drawFarmer() {
    const fx = -CFG.coreW - 20;
    const t = this.time || 0;
    const breath = calm ? 0 : Math.sin(t * 2.1) * .5;
    const flinch = this.hurtFlash > 0 && !calm ? Math.sin(t * 60) * 1.2 * this.hurtFlash : 0;
    const cheer = Math.min(1, (this.emp || 0) * 3);
    const x = fx + flinch;
    ctx.save();
    // shadow
    ctx.fillStyle = 'rgba(40,30,20,.22)';
    ellipse(x, 0, 12, 2.6); ctx.fill();
    // boots and overall legs
    ctx.fillStyle = '#5a3d26';
    ctx.fillRect(x - 6.5, -4, 5.5, 4); ctx.fillRect(x + 1, -4, 5.5, 4);
    ctx.fillStyle = '#3f6aa0';
    ctx.fillRect(x - 6, -19, 5, 15.5); ctx.fillRect(x + 1, -19, 5, 15.5);
    const by = breath;                         // the upper body rises and falls
    // shirt, bib and straps
    ctx.fillStyle = '#c4533c';
    rr(x - 7.5, -34 + by, 15, 16, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(120,40,28,.5)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.moveTo(x - 7.5, -29 + by); ctx.lineTo(x + 7.5, -29 + by); ctx.stroke();
    ctx.fillStyle = '#3f6aa0';
    ctx.fillRect(x - 5, -27 + by, 10, 9);
    ctx.fillRect(x - 5, -33 + by, 2, 6); ctx.fillRect(x + 3, -33 + by, 2, 6);
    // the far arm, hanging
    ctx.fillStyle = '#b44a35';
    rr(x - 10, -32 + by, 3.6, 12, 1.6); ctx.fill();
    ctx.fillStyle = '#e9b995';
    ctx.beginPath(); ctx.arc(x - 8.2, -19.5 + by, 2, 0, 6.3); ctx.fill();
    // the pitchfork, planted, or thrown up when the bell rings
    const lift = cheer * 9;
    const px = x + 12;
    ctx.strokeStyle = '#8b5e34'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, 2 - lift); ctx.lineTo(px, -54 - lift); ctx.stroke();
    ctx.strokeStyle = '#8e959c'; ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(px - 4, -54 - lift); ctx.lineTo(px + 4, -54 - lift);
    for (const dx of [-4, 0, 4]) { ctx.moveTo(px + dx, -54 - lift); ctx.lineTo(px + dx, -62 - lift); }
    ctx.stroke();
    // the near arm, holding the fork
    ctx.fillStyle = '#c4533c';
    rr(x + 5, -31 + by - lift * .6, 7, 3.6, 1.6); ctx.fill();
    ctx.fillStyle = '#e9b995';
    ctx.beginPath(); ctx.arc(px, -29.5 + by - lift * .6, 2.1, 0, 6.3); ctx.fill();
    // head, looking at the ridge
    ctx.beginPath(); ctx.arc(x, -39.5 + by, 5.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = '#3a2a1c';
    const blink = !calm && (t % 4.2) < .12;
    ctx.fillRect(x + 2.4, -40.5 + by, 1.4, blink ? .4 : 1.6);
    // straw hat
    ctx.fillStyle = '#e2c066';
    ellipse(x, -44 + by, 10.5, 2.3); ctx.fill();
    ctx.fillStyle = '#d8b457';
    rr(x - 5.5, -50.5 + by, 11, 7, 2.5); ctx.fill();
    ctx.fillStyle = '#a8452f';
    ctx.fillRect(x - 5.5, -45.8 + by, 11, 1.6);
    ctx.restore();
  }

  /* THE HEART — a stone wellhead over the old spring. Its water level is
     the health bar: as the Heart fails, the spring drops and goes dull. */
  drawCore() {
    const h = CFG.coreH, w = CFG.coreW;
    const ratio = Math.max(0, this.hp / this.maxHp);
    const col = ratio > .5 ? '#4a90c4' : ratio > .25 ? '#cf8a24' : '#bf4433';

    // drystone shaft
    rr(-w, -h, w, h, 6);
    ctx.fillStyle = '#8f8a7c'; ctx.fill();
    ctx.save(); ctx.clip();
    // coursed stones
    ctx.strokeStyle = 'rgba(60,50,36,.3)'; ctx.lineWidth = 1;
    for (let y = -h + 9; y < 0; y += 11) {
      ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(0, y); ctx.stroke();
      const off = ((y / 11) | 0) % 2 ? w * .5 : w * .28;
      ctx.beginPath(); ctx.moveTo(-w + off, y); ctx.lineTo(-w + off, y + 11); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.16)';
    ctx.fillRect(-w, -h, w * .3, h);

    // the water itself
    const top = -h * ratio;
    const wob = Math.sin(this.time * 1.7) * 1.4;
    ctx.fillStyle = hexA(col, .85);
    ctx.fillRect(-w + 4, top + wob, w - 8, -top);
    ctx.fillStyle = hexA('#ffffff', .35);
    ctx.fillRect(-w + 4, top + wob, w - 8, 2.5);
    ctx.restore();

    rr(-w + .9, -h + .9, w - 1.8, h - 1.8, 5);
    ctx.strokeStyle = 'rgba(58,46,30,.55)'; ctx.lineWidth = 1.8; ctx.stroke();

    // mossy capstone and a timber frame over it
    ctx.fillStyle = '#6f9a44';
    ctx.fillRect(-w - 3, -h - 5, w + 6, 5);
    ctx.fillStyle = '#7a5a35';
    ctx.fillRect(-w * .82, -h - 26, 3.5, 21);
    ctx.fillRect(-w * .28, -h - 26, 3.5, 21);
    ctx.fillRect(-w - 2, -h - 29, w + 4, 4);

    // the light under the water, breathing
    const pulse = 4 + Math.sin(this.time * 2.4) * 1.8;
    ctx.fillStyle = hexA(col, .3);
    ctx.beginPath(); ctx.arc(-w / 2, -h * Math.max(.12, ratio) + 8, pulse * 2.4, 0, 6.3); ctx.fill();
    ctx.fillStyle = hexA('#ffffff', .8);
    ctx.beginPath(); ctx.arc(-w / 2, -h * Math.max(.12, ratio) + 8, pulse * .5, 0, 6.3); ctx.fill();
  }

  drawGrid() {
    for (let y = 0; y < this.grid.length; y++)
      for (let x = 0; x < CFG.cols; x++) {
        const c = this.grid[y][x];
        if (c) this.drawModule(x, y + (c.off || 0), c, 1);
      }
  }

  /* A BUILDING. Timber gets boards and grain; stone gets courses and chips.
     Both take a dark frame so the wall reads as a wall from across the field,
     and both show their wear as splits and a condition strip. */
  drawModule(gx, gy, c, alpha) {
    const s = CFG.cell, p = 1.5, sz = s - p * 2;
    const px = gx * s + p, py = -(gy + 1) * s + p;
    const dmg = 1 - Math.max(0, c.hp) / c.max;
    const def = TURRETS[c.type];
    const strained = c.strain > 0;
    const stone = def.mat === 'stone';

    ctx.globalAlpha = alpha;

    // ground shadow so the block sits rather than floats
    ctx.fillStyle = 'rgba(50,38,22,.16)';
    rr(px + 1, py + 2, sz, sz, 4); ctx.fill();

    // body
    rr(px, py, sz, sz, stone ? 3 : 4);
    ctx.fillStyle = dmg > .5 ? shade(c.color, .82) : c.color;
    ctx.fill();

    ctx.save();
    ctx.clip();
    if (stone) {
      // three courses, offset, with a chipped highlight
      ctx.strokeStyle = 'rgba(48,40,28,.34)'; ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        const yy = py + (sz / 3) * i;
        ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + sz, yy); ctx.stroke();
        const ox = i % 2 ? sz * .42 : sz * .66;
        ctx.beginPath(); ctx.moveTo(px + ox, yy); ctx.lineTo(px + ox, yy - sz / 3); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.2)';
      ctx.fillRect(px, py, sz, 2);
      ctx.fillStyle = 'rgba(40,32,20,.16)';
      for (let i = 0; i < 3; i++)
        ctx.fillRect(px + 3 + ((i * 11 + (c.seed * 17 | 0)) % (sz - 7)), py + 5 + i * 7, 2, 2);
    } else {
      // horizontal boards with grain
      ctx.fillStyle = shade(c.color, 1.12);
      ctx.fillRect(px, py, sz, sz * .3);
      ctx.strokeStyle = 'rgba(60,42,22,.3)'; ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        const yy = py + (sz / 3) * i;
        ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + sz, yy); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(60,42,22,.16)';
      for (let i = 0; i < 3; i++) {
        const yy = py + 4 + i * (sz / 3);
        ctx.beginPath();
        ctx.moveTo(px + 2, yy);
        ctx.quadraticCurveTo(px + sz * .5, yy + (i % 2 ? 1.6 : -1.6), px + sz - 2, yy);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      ctx.fillRect(px, py, sz, 1.6);
    }
    ctx.fillStyle = 'rgba(40,30,16,.24)';
    ctx.fillRect(px, py + sz - 2.5, sz, 2.5);
    ctx.restore();

    // frame
    rr(px, py, sz, sz, stone ? 3 : 4);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = strained ? 'rgba(191,68,51,.95)' : shade(c.color, .5);
    ctx.stroke();

    // pegs / corner blocks
    ctx.fillStyle = 'rgba(52,38,20,.5)';
    for (const [bx, by] of [[3, 3], [sz - 3, 3], [3, sz - 3], [sz - 3, sz - 3]]) {
      ctx.beginPath(); ctx.arc(px + bx, py + by, 1.1, 0, 6.3); ctx.fill();
    }

    this.drawGlyph(def.glyph, px, py, sz, c.color, dmg);

    if (c.muzzle > 0) {
      rr(px, py, sz, sz, 4);
      ctx.fillStyle = 'rgba(255,246,214,' + (0.45 * (c.muzzle / 0.12)) + ')';
      ctx.fill();
    }
    if (c.flash > 0) {
      rr(px, py, sz, sz, 4);
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fill();
    }

    // splits open up as it takes damage
    if (dmg > 0.25) {
      ctx.strokeStyle = 'rgba(40,28,14,.6)'; ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(px + sz * .22, py + 2);
      ctx.lineTo(px + sz * .46, py + sz * .55);
      ctx.lineTo(px + sz * .32, py + sz - 2);
      if (dmg > .6) { ctx.moveTo(px + sz - 2, py + sz * .32); ctx.lineTo(px + sz * .56, py + sz * .5); }
      ctx.stroke();
    }

    /* condition strip. readK is what keeps it readable: the bar lives in world
       space, so without it a wall tall enough to pull the camera back to half
       zoom renders this under a pixel. The dark tray doubles as the empty half,
       and it is the only thing that separates a green bar from honey timber. */
    if (dmg > 0.02) {
      const h = 3.2 * this.readK;
      const bw = sz - 4, bx = px + 2, by = py + sz - h - 1.5;
      ctx.fillStyle = 'rgba(40,30,16,.85)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, h + 2);
      ctx.fillStyle = dmg > .6 ? '#bf4433' : dmg > .3 ? '#cf8a24' : '#5d9c41';
      ctx.fillRect(bx, by, bw * (1 - dmg), h);
    }

    if (strained) {
      ctx.fillStyle = hexA('#bf4433', .5 + Math.sin(this.time * 12) * .35);
      ctx.beginPath(); ctx.arc(px + sz - 4.5, py + 4.5, 2, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* the skull and the warning used to be font glyphs, and a font glyph is
     whatever the player's machine decides it is. Everything else here is drawn. */
  drawMark(kind, x, y, s) {
    const plate = 'rgba(252,247,234,.95)';
    ctx.lineJoin = ctx.lineCap = 'round';
    if (kind === 'skull') {
      const r = s * .38;
      ctx.beginPath();
      ctx.arc(x, y, r, Math.PI, 0);
      ctx.lineTo(x + r * .62, y + r * .58);
      ctx.lineTo(x + r * .34, y + r * .58);
      ctx.lineTo(x + r * .34, y + r * 1.02);
      ctx.lineTo(x - r * .34, y + r * 1.02);
      ctx.lineTo(x - r * .34, y + r * .58);
      ctx.lineTo(x - r * .62, y + r * .58);
      ctx.closePath();
      // the bar fill behind it is nearly the same value as the ink
      ctx.strokeStyle = plate; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.fillStyle = '#5a2418'; ctx.fill();
      ctx.fillStyle = plate;
      ctx.beginPath();
      ctx.arc(x - r * .4, y - r * .06, r * .31, 0, 6.3);
      ctx.arc(x + r * .4, y - r * .06, r * .31, 0, 6.3);
      ctx.fill();
      return;
    }
    const r = s * .5;
    ctx.lineWidth = Math.max(1.3, s * .14);
    ctx.beginPath();
    ctx.moveTo(x, y - r); ctx.lineTo(x + r * 1.06, y + r * .8); ctx.lineTo(x - r * 1.06, y + r * .8);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - r * .34); ctx.lineTo(x, y + r * .16); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y + r * .48, Math.max(.9, s * .08), 0, 6.3); ctx.fill();
  }

  drawGlyph(g, px, py, s, color, dmg) {
    const cx = px + s / 2, cy = py + s / 2;
    const ink = 'rgba(44,32,18,.8)';
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.5;
    switch (g) {
      case 'bolt':        // ballista: a bolt on rails
        ctx.fillRect(px + 5, cy - 1.4, s - 10, 2.8);
        ctx.beginPath();
        ctx.moveTo(px + 4, cy); ctx.lineTo(px + 9, cy - 3.4); ctx.lineTo(px + 9, cy + 3.4);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(44,32,18,.5)';
        ctx.beginPath(); ctx.moveTo(px + s - 7, cy - 5); ctx.lineTo(px + s - 7, cy + 5); ctx.stroke();
        break;
      case 'rock':        // catapult: stone in the sling
        ctx.beginPath(); ctx.arc(cx + 1, cy - 2, s * .19, 0, 6.3); ctx.fill();
        ctx.strokeStyle = ink; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(cx - s * .26, cy + s * .24);
        ctx.quadraticCurveTo(cx, cy + s * .04, cx + s * .26, cy + s * .22);
        ctx.stroke();
        break;
      case 'bees': {      // beehive: skep with bees around it
        ctx.beginPath();
        ctx.moveTo(cx - s * .22, cy + s * .2);
        ctx.quadraticCurveTo(cx - s * .24, cy - s * .2, cx, cy - s * .24);
        ctx.quadraticCurveTo(cx + s * .24, cy - s * .2, cx + s * .22, cy + s * .2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,244,210,.75)';
        for (let i = 0; i < 2; i++) {
          const a = this.time * 3 + i * 3.1;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(a) * s * .3, cy + Math.sin(a) * s * .22, 1.3, 0, 6.3);
          ctx.fill();
        }
        break;
      }
      case 'bow':         // repeater: two limbs and a string
        ctx.strokeStyle = ink; ctx.lineWidth = 1.7;
        for (const off of [-3.2, 3.2]) {
          ctx.beginPath();
          ctx.moveTo(px + s - 6, cy + off - 3);
          ctx.quadraticCurveTo(px + 4, cy + off, px + s - 6, cy + off + 3);
          ctx.stroke();
        }
        ctx.fillRect(px + 5, cy - 1, s - 11, 2);
        break;
      case 'tar':         // kiln: a pot with a drip
        ctx.beginPath();
        ctx.moveTo(cx - s * .2, cy - s * .14);
        ctx.lineTo(cx + s * .2, cy - s * .14);
        ctx.lineTo(cx + s * .14, cy + s * .22);
        ctx.lineTo(cx - s * .14, cy + s * .22);
        ctx.closePath(); ctx.fill();
        ctx.fillRect(cx - s * .26, cy - s * .2, s * .52, 2.4);
        ctx.fillStyle = hexA(color, .95);
        ctx.beginPath(); ctx.arc(cx, cy + s * .3, 1.9, 0, 6.3); ctx.fill();
        break;
      case 'flame':       // fire tower: a lit brazier
        ctx.fillRect(cx - s * .22, cy + s * .16, s * .44, 2.6);
        ctx.fillStyle = hexA(color, .95);
        ctx.beginPath();
        ctx.moveTo(cx, cy - s * .28 - Math.sin(this.time * 6) * 1.5);
        ctx.quadraticCurveTo(cx + s * .17, cy + s * .04, cx, cy + s * .14);
        ctx.quadraticCurveTo(cx - s * .17, cy + s * .04, cx, cy - s * .28);
        ctx.closePath(); ctx.fill();
        break;
      case 'water':       // spring: a bucket and ripples
        ctx.beginPath();
        ctx.moveTo(cx - s * .2, cy - s * .1);
        ctx.lineTo(cx + s * .2, cy - s * .1);
        ctx.lineTo(cx + s * .14, cy + s * .24);
        ctx.lineTo(cx - s * .14, cy + s * .24);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = ink; ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(cx - s * .2, cy - s * .1);
        ctx.quadraticCurveTo(cx, cy - s * .32, cx + s * .2, cy - s * .1);
        ctx.stroke();
        ctx.fillStyle = hexA(color, .9);
        ctx.fillRect(cx - s * .12, cy - s * .04, s * .24, 2);
        break;
    }
  }

  drawPiece() {
    if (!this.piece) return;
    const p = this.piece, def = TURRETS[p.type], s = CFG.cell;
    const gy = this.ghostY();

    if (!def.support) {
      ctx.strokeStyle = hexA(def.color, .3); ctx.lineWidth = 1.2;
      ctx.setLineDash([5, 6]);
      const [dx0, dy0] = p.cells[0];
      ctx.beginPath();
      ctx.arc((p.cx + dx0 + .5) * s, -((gy + dy0 + .5) * s), def.range, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.strokeStyle = hexA(def.color, .55); ctx.lineWidth = 1.6;
    p.cells.forEach(([dx, dy]) => {
      rr((p.cx + dx) * s + 3, -(gy + dy + 1) * s + 3, s - 6, s - 6, 4);
      ctx.stroke();
    });

    const ghost = { type: p.type, color: def.color, hp: 1, max: 1, flash: 0, muzzle: 0, strain: 0, seed: 0.5 };
    p.cells.forEach(([dx, dy]) => this.drawModule(p.cx + dx, this.visY + dy, ghost, 1));
  }

  /* ==========================================================================
     ENEMY ART. Every hostile is drawn procedurally as an actual creature —
     jointed legs that stride in time with its speed, wings that beat, eyes
     that face the way it walks. Silhouette does the talking: you should be
     able to name what is coming at you from across the field, at any zoom.
     Everything faces LEFT, because that is where the core is.
     ======================================================================== */
  drawEnemyBody(e, x, y, r, col, hit, k) {
    const d = e.def;
    const w = e.walk || 0;
    const body = hit ? '#ffffff' : col;
    const dark = hit ? '#e8f2ff' : shade(col, .58);
    const lite = hit ? '#ffffff' : shade(col, 1.35);
    const ink = 'rgba(6,12,22,.72)';

    /* Every machine looks at the world through the same red optic. It is the
       one warm colour they own, and it is how you spot them in the grass. */
    const lensCol = d.heals ? '#5fe0c8' : '#e0503f';
    const eye = (ex, ey, er) => {
      ctx.fillStyle = hexA(lensCol, .3);
      ctx.beginPath(); ctx.arc(ex, ey, er * 2.6, 0, 6.3); ctx.fill();
      ctx.fillStyle = hit ? '#ffffff' : lensCol;
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, 6.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,236,228,.9)';
      ctx.beginPath(); ctx.arc(ex - er * .3, ey - er * .32, er * .36, 0, 6.3); ctx.fill();
    };
    const outline = () => { ctx.strokeStyle = ink; ctx.lineWidth = Math.max(1.1, r * .13); ctx.stroke(); };

    switch (d.id) {

      /* ---- GRUNT: low six-legged crawler, heavy carapace, one big eye ---- */
      case 'grunt': {
        const bob = Math.sin(w * 2) * r * .09;
        ctx.strokeStyle = dark;
        for (let i = 0; i < 3; i++) {
          const ph = w * 2 + i * 2.1;
          const bx = x + (i - 1) * r * .5, by = y + r * .2 + bob;
          limb(bx, by, bx - r * .15 + Math.sin(ph) * r * .34, y + r * 1.06,
            Math.cos(ph) * r * .26, Math.max(1.2, r * .17));
        }
        ctx.fillStyle = body;
        ellipse(x, y + bob, r * .96, r * .74, -.1); ctx.fill(); outline();
        ctx.fillStyle = dark;
        ellipse(x + r * .16, y - r * .22 + bob, r * .7, r * .38, -.22); ctx.fill();
        ctx.fillStyle = lite;
        ellipse(x + r * .16, y - r * .3 + bob, r * .5, r * .16, -.22); ctx.fill();
        eye(x - r * .52, y + bob, r * .2);
        break;
      }

      /* ---- RUNNER: two long legs, leaning into the sprint, motion trail ---- */
      case 'runner': {
        const bob = Math.sin(w * 3.4) * r * .16;
        for (let i = 3; i >= 1; i--) {   // speed trail, fading back
          ctx.fillStyle = hexA(col, .2 / i);
          ellipse(x + i * r * .5, y + bob, r * (.8 - i * .13), r * (.3 - i * .05), -.25); ctx.fill();
        }
        ctx.strokeStyle = dark;
        for (let i = 0; i < 2; i++) {
          const ph = w * 3.4 + i * Math.PI;
          limb(x + r * .2, y + r * .25 + bob, x + Math.sin(ph) * r * .6, y + r * 1.1,
            Math.cos(ph) * r * .45, Math.max(1.2, r * .16));
        }
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(x - r * 1.15, y + bob);
        ctx.quadraticCurveTo(x - r * .1, y - r * .72 + bob, x + r * .95, y - r * .2 + bob);
        ctx.quadraticCurveTo(x + r * .7, y + r * .5 + bob, x - r * 1.15, y + bob);
        ctx.closePath(); ctx.fill(); outline();
        ctx.fillStyle = lite;
        ellipse(x - r * .1, y - r * .3 + bob, r * .4, r * .1, -.35); ctx.fill();
        eye(x - r * .66, y - r * .06 + bob, r * .17);
        break;
      }

      /* ---- FLYER: light drone, two beating wings, sensor eye underneath ---- */
      case 'flyer': {
        const beat = Math.sin(w * 9);
        ctx.fillStyle = hexA(col, .5);
        ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1, r * .1);
        for (const s of [-1, 1]) {
          ctx.save();
          ctx.translate(x, y - r * .1);
          ctx.scale(1, 1);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.quadraticCurveTo(r * .5 * s, (-r * .5 - beat * r * .55) * 1, r * 1.5 * s, -beat * r * .5 - r * .15);
          ctx.quadraticCurveTo(r * .7 * s, r * .3, 0, r * .16);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = body;
        ellipse(x, y, r * .62, r * .82, 0); ctx.fill(); outline();
        ctx.fillStyle = dark;
        ellipse(x, y - r * .3, r * .42, r * .3, 0); ctx.fill();
        eye(x - r * .12, y + r * .34, r * .21);
        break;
      }

      /* ---- BRUTE: armour-plated bulk on four thick legs, smoking stacks ---- */
      case 'brute': {
        const step = Math.sin(w * 1.5);
        const bob = Math.abs(step) * r * .07;
        ctx.strokeStyle = dark;
        for (let i = 0; i < 4; i++) {
          const ph = w * 1.5 + (i % 2) * Math.PI + Math.floor(i / 2) * .7;
          const bx = x + (i < 2 ? -1 : 1) * r * .5;
          limb(bx, y + r * .1 + bob, bx + Math.sin(ph) * r * .34, y + r * 1.12,
            Math.cos(ph) * r * .22, Math.max(2, r * .26));
        }
        ctx.fillStyle = hexA(col, .22);
        for (let i = 0; i < 2; i++) {
          const t = ((this.time * .7 + i * .5) % 1);
          ellipse(x + r * .45 - t * r * .3, y - r * .95 - t * r * 1.2, r * (.12 + t * .3), r * (.12 + t * .3));
          ctx.fill();
        }
        ctx.fillStyle = dark;
        ctx.fillRect(x + r * .2, y - r * 1.1 + bob, r * .18, r * .35);
        ctx.fillRect(x + r * .5, y - r * 1.05 + bob, r * .18, r * .3);
        ctx.fillStyle = body;
        rr(x - r * .95, y - r * 1.0 + bob, r * 1.9, r * 1.28, r * .3); ctx.fill(); outline();
        ctx.fillStyle = dark;
        for (let i = 0; i < 3; i++) rr(x - r * .8 + i * r * .58, y - r * .93 + bob, r * .44, r * 1.14, r * .12), ctx.fill();
        ctx.fillStyle = lite;
        rr(x - r * .8, y - r * .93 + bob, r * 1.6, r * .16, r * .07); ctx.fill();
        eye(x - r * .62, y - r * .5 + bob, r * .17);
        eye(x - r * .62, y - r * .04 + bob, r * .17);
        break;
      }

      /* ---- SAPPER: a walking bomb. The blinker speeds up near the wall. ---- */
      case 'sapper': {
        const urgency = 3 + Math.max(0, 6 - e.x / 40);
        const blink = (Math.sin(this.time * urgency * 2) + 1) / 2;
        ctx.strokeStyle = dark;
        for (let i = 0; i < 2; i++) {
          const ph = w * 3 + i * Math.PI;
          limb(x + (i ? r * .3 : -r * .3), y + r * .4, x + (i ? r * .4 : -r * .4) + Math.sin(ph) * r * .2,
            y + r * 1.05, Math.cos(ph) * r * .22, Math.max(1.1, r * .13));
        }
        ctx.fillStyle = hexA('#ff4d4d', blink * .5);
        ctx.beginPath(); ctx.arc(x, y, r * 1.6, 0, 6.3); ctx.fill();
        ctx.fillStyle = body;
        rr(x - r * .78, y - r * .78, r * 1.56, r * 1.56, r * .4); ctx.fill(); outline();
        ctx.fillStyle = dark;
        ctx.fillRect(x - r * .8, y - r * .2, r * 1.6, r * .18);
        ctx.fillRect(x - r * .8, y + r * .24, r * 1.6, r * .18);
        ctx.fillStyle = hit ? '#fff' : 'rgb(' + Math.round(120 + blink * 135) + ',40,60)';
        ctx.beginPath(); ctx.arc(x, y - r * .5, r * .26, 0, 6.3); ctx.fill();
        eye(x - r * .42, y + r * .52, r * .13);
        break;
      }

      /* ---- BULWARK: hex body behind a riveted shield. Burn it, don't shoot. ---- */
      case 'bulwark': {
        const bob = Math.sin(w * 1.8) * r * .06;
        ctx.strokeStyle = dark;
        for (let i = 0; i < 2; i++) {
          const ph = w * 1.8 + i * Math.PI;
          limb(x + (i ? r * .35 : -r * .1), y + r * .5 + bob, x + (i ? r * .5 : 0) + Math.sin(ph) * r * .25,
            y + r * 1.05, Math.cos(ph) * r * .2, Math.max(1.6, r * .2));
        }
        ctx.fillStyle = body;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = Math.PI / 6 + i * Math.PI / 3;
          ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r * .85, y + bob + Math.sin(a) * r * .85);
        }
        ctx.closePath(); ctx.fill(); outline();
        eye(x - r * .3, y + bob, r * .18);
        ctx.fillStyle = hit ? '#fff' : '#cfe0f5';
        ctx.beginPath();
        ctx.moveTo(x - r * .72, y - r * 1.02 + bob);
        ctx.quadraticCurveTo(x - r * 1.5, y + bob, x - r * .72, y + r * 1.02 + bob);
        ctx.quadraticCurveTo(x - r * .95, y + bob, x - r * .72, y - r * 1.02 + bob);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(6,12,22,.55)'; ctx.lineWidth = Math.max(1, r * .1); ctx.stroke();
        ctx.fillStyle = 'rgba(6,12,22,.4)';
        for (let i = -1; i <= 1; i++) {
          ctx.beginPath(); ctx.arc(x - r * .95, y + i * r * .45 + bob, r * .09, 0, 6.3); ctx.fill();
        }
        break;
      }

      /* ---- SPAWNLING: a wriggling three-segment grub ---- */
      case 'spawnling': {
        ctx.strokeStyle = dark; ctx.lineWidth = Math.max(.8, r * .14);
        for (let i = 0; i < 3; i++) {
          const ph = w * 5 + i * 1.4;
          const sxp = x + (i - 1) * r * .6;
          ctx.beginPath();
          ctx.moveTo(sxp, y + r * .3);
          ctx.lineTo(sxp + Math.sin(ph) * r * .3, y + r * .95);
          ctx.stroke();
        }
        for (let i = 2; i >= 0; i--) {
          const wob = Math.sin(w * 5 - i * .9) * r * .22;
          ctx.fillStyle = i === 0 ? body : shade(hit ? '#ffffff' : col, 1 - i * .16);
          if (hit) ctx.fillStyle = '#ffffff';
          ellipse(x + (i - .6) * r * .62, y + wob, r * (.62 - i * .08), r * (.55 - i * .06));
          ctx.fill();
          ctx.strokeStyle = ink; ctx.lineWidth = Math.max(.9, r * .13); ctx.stroke();
        }
        eye(x - r * .78, y + Math.sin(w * 5) * r * .22, r * .16);
        break;
      }

      /* ---- HIVE: a walking womb; you can see the brood moving inside ---- */
      case 'hive': {
        const pulse = 1 + Math.sin(this.time * 2.4) * .06;
        const bob = Math.sin(w * 1.6) * r * .06;
        ctx.strokeStyle = dark;
        for (let i = 0; i < 4; i++) {
          const ph = w * 1.6 + i * 1.6;
          const bx = x + (i - 1.5) * r * .42;
          limb(bx, y + r * .5 + bob, bx + Math.sin(ph) * r * .22, y + r * 1.05,
            Math.cos(ph) * r * .18, Math.max(1.2, r * .15));
        }
        ctx.fillStyle = body;
        ellipse(x, y + bob, r * .92 * pulse, r * .96 * pulse); ctx.fill(); outline();
        ctx.save();
        ctx.clip();
        ctx.fillStyle = hit ? '#dff' : shade(col, .5);
        for (let i = 0; i < 3; i++) {
          const a = this.time * .9 + i * 2.1;
          ellipse(x + Math.cos(a) * r * .34, y + bob + Math.sin(a) * r * .34, r * .26, r * .3);
          ctx.fill();
        }
        ctx.restore();
        ctx.fillStyle = lite;
        ellipse(x - r * .25, y - r * .4 + bob, r * .3, r * .12, -.5); ctx.fill();
        eye(x - r * .5, y + r * .2 + bob, r * .15);
        break;
      }

      /* ---- MENDER: hovering support platform, ring emitter, med cross ---- */
      case 'mender': {
        const hover = Math.sin(this.time * 2.6) * r * .18;
        const spin = this.time * 2.2;
        ctx.strokeStyle = hexA(hit ? '#ffffff' : col, .55);
        ctx.lineWidth = Math.max(1, r * .11);
        ellipse(x, y + hover, r * 1.15, r * .34 * Math.abs(Math.cos(spin)) + r * .1); ctx.stroke();
        ctx.fillStyle = body;
        ellipse(x, y + hover, r * .66, r * .56); ctx.fill(); outline();
        ctx.fillStyle = dark;
        ellipse(x, y + hover + r * .12, r * .5, r * .3); ctx.fill();
        ctx.fillStyle = hit ? '#fff' : '#ffffff';
        ctx.fillRect(x - r * .1, y + hover - r * .82, r * .2, r * .5);
        ctx.fillRect(x - r * .3, y + hover - r * .66, r * .6, r * .18);
        ctx.fillStyle = hexA(hit ? '#ffffff' : col, .35);
        ctx.beginPath(); ctx.arc(x, y + hover - r * .6, r * .5, 0, 6.3); ctx.fill();
        eye(x - r * .34, y + hover, r * .15);
        ctx.fillStyle = hexA(col, .25);
        ellipse(x, y + r * 1.05, r * .7, r * .16); ctx.fill();
        break;
      }

      /* ---- GUNSHIP: armoured flyer, rotor blur, two slung cannons ---- */
      case 'gunship': {
        const beat = this.time * 22;
        for (const sxp of [-r * .62, r * .62]) {
          ctx.fillStyle = hexA(hit ? '#ffffff' : '#cfe0f5', .16);
          ellipse(x + sxp, y - r * .78, r * .55, r * .13); ctx.fill();
          ctx.strokeStyle = hexA(hit ? '#ffffff' : '#e8f2ff', .7);
          ctx.lineWidth = Math.max(1.2, r * .1);
          ctx.beginPath();
          ctx.ellipse(x + sxp, y - r * .78, r * .55, r * .13 * Math.abs(Math.cos(beat + sxp)), 0, 0, 6.3);
          ctx.stroke();
        }
        ctx.strokeStyle = dark; ctx.lineWidth = Math.max(1.2, r * .13);
        ctx.beginPath();
        ctx.moveTo(x - r * .62, y - r * .72); ctx.lineTo(x + r * .62, y - r * .72);
        ctx.moveTo(x - r * .62, y - r * .72); ctx.lineTo(x - r * .3, y - r * .2);
        ctx.moveTo(x + r * .62, y - r * .72); ctx.lineTo(x + r * .3, y - r * .2);
        ctx.stroke();
        ctx.fillStyle = body;
        ctx.beginPath();
        ctx.moveTo(x - r * 1.15, y);
        ctx.quadraticCurveTo(x - r * .2, y - r * .62, x + r * .95, y - r * .34);
        ctx.lineTo(x + r * .95, y + r * .34);
        ctx.quadraticCurveTo(x - r * .2, y + r * .62, x - r * 1.15, y);
        ctx.closePath(); ctx.fill(); outline();
        ctx.fillStyle = dark;
        for (const sy2 of [-r * .5, r * .5]) rr(x - r * .5, y + sy2 - r * .11, r * .95, r * .22, r * .1), ctx.fill();
        ctx.fillStyle = lite;
        ellipse(x - r * .1, y - r * .3, r * .45, r * .1, -.16); ctx.fill();
        eye(x - r * .7, y, r * .2);
        break;
      }

      /* ---- COLOSSUS: the thing the Rift built on purpose ---- */
      case 'colossus': {
        const step = Math.sin(w * .9);
        const bob = Math.abs(step) * r * .05;
        const rage = .5 + Math.sin(this.time * 3) * .5;
        ctx.fillStyle = hexA(col, .1 + rage * .1);
        ctx.beginPath(); ctx.arc(x, y, r * 2.1, 0, 6.3); ctx.fill();
        ctx.strokeStyle = dark;
        for (let i = 0; i < 4; i++) {
          const ph = w * .9 + (i % 2) * Math.PI + Math.floor(i / 2) * .8;
          const bx = x + (i < 2 ? -1 : 1) * r * .55;
          limb(bx, y + r * .45 + bob, bx + Math.sin(ph) * r * .34, y + r * 1.1,
            Math.cos(ph) * r * .24, Math.max(3, r * .3));
        }
        ctx.fillStyle = dark;
        ctx.beginPath();
        ctx.moveTo(x - r * .3, y - r * .8 + bob);
        ctx.lineTo(x - r * .75, y - r * 1.5 + bob);
        ctx.lineTo(x - r * .05, y - r * .95 + bob);
        ctx.moveTo(x + r * .3, y - r * .8 + bob);
        ctx.lineTo(x + r * .75, y - r * 1.5 + bob);
        ctx.lineTo(x + r * .05, y - r * .95 + bob);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = body;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const a = i * Math.PI / 4 - Math.PI / 8;
          const rad = i % 2 ? r * .78 : r * 1.02;
          ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rad, y + bob + Math.sin(a) * rad);
        }
        ctx.closePath(); ctx.fill(); outline();
        ctx.fillStyle = dark;
        for (let i = 0; i < 3; i++) {
          rr(x - r * .85 + i * r * .6, y - r * .5 + bob, r * .46, r * 1.0, r * .1); ctx.fill();
        }
        ctx.fillStyle = hexA(hit ? '#ffffff' : lite, .3 + rage * .4);
        rr(x - r * .7, y - r * .12 + bob, r * 1.4, r * .2, r * .1); ctx.fill();
        for (let i = -2; i <= 2; i++) eye(x - r * .45 + i * r * .1, y - r * .55 + bob, r * .11);
        break;
      }

      default:
        ctx.fillStyle = body;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); outline();
    }
  }

  drawEnemies() {
    const k = this.readK;
    const groundY = this.sy(0);
    // the tear line, in screen space; nothing is drawn on its far side
    const tearX = this.sx(CFG.cols * CFG.cell + CFG.approach);

    for (const e of this.enemies) {
      const d = e.def;
      const x = this.sx(e.x), y = this.sy(e.y);
      const em = e.spawnT === undefined ? 1 : e.spawnT;
      /* Only a carrier's printlings grow in where they stand. Everything else
         is full size from the first frame and is revealed by the tear instead:
         the part still on the far side is clipped away, so it walks out. */
      const r = d.r * this.scale * k * (e.split ? .55 + .45 * em : 1);
      const hit = e.flash > 0;
      if (e.split && em < 1) ctx.globalAlpha = em;
      // the aura is the widest thing drawn, so it decides when clipping ends
      const crossing = !e.split && x + r * 1.8 > tearX;
      if (crossing) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(-40, -40, Math.max(0, tearX + 40), CH + 80);
        ctx.clip();
      }

      // healer link lines, drawn under everyone
      if (d.heals) {
        ctx.strokeStyle = hexA(d.color, .22); ctx.lineWidth = 1.2;
        for (const o of this.enemies) {
          if (o === e || Math.hypot(o.x - e.x, o.y - e.y) > d.healRange) continue;
          ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(this.sx(o.x), this.sy(o.y)); ctx.stroke();
        }
      }

      // contact shadow — grounds the creature on the field
      if (groundY > y - r && groundY < CH + 40) {
        const lift = Math.max(0, (groundY - y) / (r * 6));
        ctx.fillStyle = 'rgba(0,0,0,' + (d.flying ? .2 : .34) * Math.max(.25, 1 - lift) + ')';
        ellipse(x, groundY, r * (d.flying ? .7 : .95), r * .22); ctx.fill();
      }

      // a soft dark aura instead of a glow: on a sunlit meadow the machines
      // need to read as heavy silhouettes, not as light sources
      ctx.fillStyle = d.boss ? 'rgba(30,24,18,.2)' : 'rgba(30,24,18,.11)';
      ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill();

      this.drawEnemyBody(e, x, y, r, d.color, hit, k);

      // status: frozen crust, then flames on top of everything
      if (e.slow > 0) {
        ctx.strokeStyle = 'rgba(142,240,255,.85)'; ctx.lineWidth = Math.max(1.4, r * .13);
        ctx.beginPath(); ctx.arc(x, y, r * 1.24, 0, Math.PI * 2); ctx.stroke();
        ctx.fillStyle = 'rgba(142,240,255,.5)';
        for (let i = 0; i < 5; i++) {
          const a = i * 1.257 + e.phase;
          ctx.beginPath();
          ctx.moveTo(x + Math.cos(a) * r * 1.2, y + Math.sin(a) * r * 1.2);
          ctx.lineTo(x + Math.cos(a + .3) * r * 1.55, y + Math.sin(a + .3) * r * 1.55);
          ctx.lineTo(x + Math.cos(a - .3) * r * 1.5, y + Math.sin(a - .3) * r * 1.5);
          ctx.closePath(); ctx.fill();
        }
      }
      if (e.burn > 0) {
        for (let i = 0; i < 3; i++) {
          const fx2 = x + (i - 1) * r * .5 + Math.sin(this.time * 9 + i * 2) * r * .16;
          const h = r * (.7 + Math.sin(this.time * 13 + i * 3) * .28);
          ctx.fillStyle = i === 1 ? 'rgba(255,220,120,.9)' : 'rgba(255,120,40,.8)';
          ctx.beginPath();
          ctx.moveTo(fx2 - r * .2, y - r * .8);
          ctx.quadraticCurveTo(fx2, y - r * .8 - h, fx2 + r * .2, y - r * .8);
          ctx.closePath(); ctx.fill();
        }
      }

      if (!d.boss) {   // bosses get the big bar up top instead
        const ratio = Math.max(0, e.hp / e.max);
        if (ratio < 1 || d.armor) {
          const bw = r * 2.1, hh = Math.max(3, 3.5 * k), by = y - r * 1.5 - 5 * k - hh;
          ctx.fillStyle = 'rgba(38,30,20,.55)';
          ctx.fillRect(x - bw / 2 - 1, by - 1, bw + 2, hh + 2);
          ctx.fillStyle = ratio > .5 ? '#5d9c41' : ratio > .25 ? '#cf8a24' : '#bf4433';
          ctx.fillRect(x - bw / 2, by, bw * ratio, hh);
          if (d.armor) {   // armour pips tell you plain bullets will glance
            ctx.fillStyle = 'rgba(222,230,236,.9)';
            ctx.fillRect(x - bw / 2, by - hh * .9, bw * .3, hh * .55);
          }
        }
      }
      ctx.globalAlpha = 1;
      if (crossing) {
        ctx.restore();
        /* the seam where the body meets the tear: a cold rim of light down the
           cut, brightest while most of the machine is still on the far side */
        const inside = Math.min(1, Math.max(0, (x + r - tearX) / (2 * r)));
        if (inside > 0) {
          const hgt = r * (d.flying ? 1.3 : 1.45);
          const a = .35 + inside * .55;
          ctx.fillStyle = 'rgba(142,159,216,' + (a * .45).toFixed(3) + ')';
          ellipse(tearX, y, Math.max(3, r * .28), hgt); ctx.fill();
          ctx.strokeStyle = 'rgba(238,246,255,' + a.toFixed(3) + ')';
          ctx.lineWidth = Math.max(1.5, r * .12);
          ctx.beginPath();
          ctx.moveTo(tearX, y - hgt);
          ctx.quadraticCurveTo(tearX + r * .18 * Math.sin(this.time * 9 + e.phase), y, tearX, y + hgt);
          ctx.stroke();
        }
      }
    }
  }

  /* The machines have always come out of the same spot on the ridge, and the
     codex already credits the Rift with building the colossus. Until now that
     spot was bare meadow, so they arrived out of nothing. Screen space, drawn
     before the mobs so they step out in front of it. */
  drawRift() {
    if (this.rift < .02) return;
    const sc = this.scale * this.readK;
    const cx = this.sx(CFG.cols * CFG.cell + CFG.approach);
    if (cx < -80 || cx > CW + 80) return;
    const y0 = this.sy(0), y1 = this.sy(230), mid = (y0 + y1) / 2;
    const open = this.rift, flare = Math.max(0, this.riftFlash);
    // width comes off its own height, not off the zoom: tied to scale the tear
    // thinned into a thread every time a tall wall pulled the camera back
    const h = y0 - y1;
    const w = h * (.072 + flare * .055) * open * (1 + Math.sin(this.time * 1.9) * .09);

    // a scorch on the turf, or the tear reads as floating above the meadow
    ctx.fillStyle = 'rgba(38,32,44,' + (.2 + open * .2) + ')';
    ellipse(cx, y0, h * .19 * open, h * .045 * open); ctx.fill();

    const lens = mul => {
      ctx.beginPath();
      ctx.moveTo(cx, y1);
      ctx.quadraticCurveTo(cx + w * mul, mid, cx, y0);
      ctx.quadraticCurveTo(cx - w * mul, mid, cx, y1);
      ctx.closePath();
    };

    /* Stacked translucent passes rather than a blur. There is no shadowBlur
       anywhere in this file: every light source here is faked by layering,
       and the palette is the machines' own cold blue, never the village's. */
    lens(4.2);  ctx.fillStyle = hexA('#8e9fd8', .07 + open * .11); ctx.fill();
    lens(2.4);  ctx.fillStyle = hexA('#8e9fd8', .11 + open * .17); ctx.fill();
    lens(1.25); ctx.fillStyle = hexA('#c6d2e4', .18 + open * .3); ctx.fill();
    lens(.5);   ctx.fillStyle = 'rgba(42,47,61,' + (.5 + open * .35) + ')'; ctx.fill();

    ctx.strokeStyle = 'rgba(238,246,255,' + (.26 + open * .5) + ')';
    ctx.lineWidth = Math.max(1.1, (1.7 + flare * 2) * sc);
    ctx.beginPath();
    for (let i = 0; i <= 8; i++) {
      const t = i / 8, yy = y1 + (y0 - y1) * t;
      const j = Math.sin(this.time * 6 + i * 1.7) * w * .22 * (1 + flare);
      i ? ctx.lineTo(cx + j, yy) : ctx.moveTo(cx + j, yy);
    }
    ctx.stroke();

    // sparks read off the clock, so they cost nothing and keep no state
    ctx.fillStyle = hexA('#dbe4ff', .45 + open * .4);
    for (let i = 0; i < 7; i++) {
      const p = (this.time * .5 + i * .137) % 1;
      const ss = Math.max(1, (1.4 - p) * sc * 1.2);
      ctx.fillRect(cx + Math.sin(this.time * 2.4 + i * 1.7) * w * 2.2,
                   y0 - (y0 - y1) * p, ss, ss);
    }
  }

  drawShots() {
    const k = this.readK;
    for (const s of this.shots) {
      const x = this.sx(s.x), y = this.sy(s.y);
      const r = (s.arc ? 4.5 : 3) * this.scale * k;
      ctx.globalAlpha = .35;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(x, y, r * .5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = .85;
      ctx.beginPath(); ctx.arc(x - r * .25, y - r * .25, r * .35, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  drawFx() {
    const k = this.readK * this.scale;
    for (const p of this.fx) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
      ctx.fillStyle = p.color;
      const r = p.r * k;
      ctx.fillRect(this.sx(p.x) - r, this.sy(p.y) - r, r * 2, r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.font = '800 ' + Math.round(11.5 * this.readK) + 'px ' + FM;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.lineJoin = 'round';
    for (const t of this.texts) {
      ctx.globalAlpha = Math.max(0, 1 - t.t / t.life);
      ctx.strokeStyle = 'rgba(255,250,232,.9)';
      ctx.strokeText(t.text, this.sx(t.x), this.sy(t.y));
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, this.sx(t.x), this.sy(t.y));
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';

    if (this.emp > 0) {
      ctx.globalAlpha = this.emp;
      ctx.strokeStyle = 'rgba(255,252,238,.95)'; ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(this.sx(CFG.cols * CFG.cell / 2), this.sy(CFG.cell), (0.45 - this.emp) * 1800 * this.scale, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* WHERE THE COACH IS POINTING. The card names a target and this draws the
     light on it, so "the spring on the left is the Heart" stops being a
     sentence the player has to solve. Buttons and stats are lit in CSS; these
     live on the canvas and move with the camera.

     A ring alone only changed a colour on something the player still had to
     find, so every spot also carries its name on a signboard in large type,
     next to the thing itself, popping in when the card opens. */
  drawCoachSpot() {
    this.coachLabelBox = null;
    const t = this.tutorial;
    if (!t || ui.tut.hidden) return;
    const s = TUT_STEPS[t.step];
    if (!s || !s.spot) return;
    const cell = CFG.cell, boardW = CFG.cols * cell;
    let lab = null;

    if (s.spot === 'core') {
      const x = this.sx(-CFG.coreW / 2), y = this.sy(CFG.coreH * .55);
      const r = Math.max(CFG.coreW, CFG.coreH) * .58 * this.scale + 12;
      this.coachRing(x, y, r);
      lab = { x, y, r, side: 'above' };
    } else if (s.spot === 'rift') {
      // ring the whole tear, not a spot at its foot
      const x = this.sx(boardW + CFG.approach), y = this.sy(115);
      const ry = 115 * this.scale + 16, rx = Math.max(34, ry * .42);
      this.coachRing(x, y, rx, ry);
      lab = { x, y, r: ry, side: 'above' };
    } else if (s.spot === 'piece' && this.piece) {
      const p = this.piece;
      let sum = 0, sumY = 0;
      for (const [cx, cy] of p.cells) { sum += cx; sumY += cy; }
      const n = p.cells.length;
      const x = this.sx((p.cx + sum / n + .5) * cell), y = this.sy((this.visY + sumY / n + .5) * cell);
      const r = cell * 1.5 * this.scale + 10;
      this.coachRing(x, y, r);
      lab = { x, y, r, side: 'above' };
    } else if (s.spot === 'row') {
      this.coachBox(this.sx(0), this.sy(cell), boardW * this.scale, cell * this.scale);
      lab = { x: this.sx(boardW) + 16, y: this.sy(cell / 2), r: 0, side: 'right' };
    } else if (s.spot === 'line') {
      const y = this.sy(CFG.overheatRow * cell);
      this.coachBox(this.sx(0), y - 9, boardW * this.scale, 18);
      lab = { x: this.sx(boardW) + 16, y, r: 0, side: 'right', ax: this.sx(boardW / 2) };
    } else if (s.spot === 'shell') {
      const b = this.barrages.find(x => !x.dead);
      if (b) {
        const sh = this.shellAt(b);
        const r = Math.max(6, 8.5 * this.scale * this.readK) * 2.2 + 8;
        this.coachRing(sh.x, sh.y, r);
        lab = { x: sh.x + r + 14, y: sh.y, r: 0, side: 'right', ax: sh.x, pt: true };
      }
    } else if (s.spot === 'store' && this.holdBox) {
      const b = this.holdBox;
      this.coachBox(b.x, b.y, b.w, b.h);
      lab = { x: b.x + b.w / 2, y: b.y + b.h / 2, r: b.h / 2 + 6, side: 'below' };
    }
    if (!lab || !s.label && s.spot !== 'store') return;
    const name = s.spot === 'store' ? T('hold_touch')
      : s.label === 'piece' ? (this.piece ? turretName(TURRETS[this.piece.type]) : '')
      : s.label === 'core' ? T('core') : T('cl_' + s.label);
    if (name) this.coachLabel(name, lab);
  }

  /* The signboard: the target's name in display type big enough to read from
     across the room, on a parchment plate with a notch pointing at the thing.
     It pops in over a third of a second when the card opens and never covers
     the card itself. */
  coachLabel(text, at) {
    const t = this.tutorial;
    const p = Math.min(1, (t && t.since || 0) / .38);
    const back = 1 + 2.70158 * Math.pow(p - 1, 3) + 1.70158 * Math.pow(p - 1, 2);
    const pop = calm ? 1 : .35 + .65 * back;
    // big, but not bigger than a narrow phone field can carry
    const fs = Math.round(Math.max(20, Math.min(38, CH * .068, CW * .06)));
    ctx.save();
    ctx.font = '600 ' + fs + 'px ' + FD;
    if ('letterSpacing' in ctx) ctx.letterSpacing = '2px';
    const txt = String(text).toUpperCase();
    const w = ctx.measureText(txt).width + 34, h = fs + 18;
    const free = coachFreeArea();
    let cx = at.x, cy, notch = 'down';
    const roomR = at.x + w <= Math.min(CW - 8, free.r);
    // the mirror spot on the other side of the target, for a sign that hangs off a point
    const leftX = at.ax !== undefined && at.r === 0 && at.ax !== at.x ? at.ax - (at.x - at.ax) - w / 2 : null;
    if (at.side === 'right' && !roomR && leftX !== null && leftX - w / 2 >= 8 && at.pt) {
      cx = leftX; cy = at.y; notch = 'right';
    } else if (at.side === 'right' && !roomR && at.ax !== undefined) {
      // no room beside it on a narrow field: stand over the middle of it instead
      cx = at.ax; cy = at.y - h / 2 - 16; notch = 'down';
    } else if (at.side === 'right') { cx = at.x + w / 2; cy = at.y; notch = 'left'; }
    else if (at.side === 'below') { cy = at.y + at.r + h / 2 + 12; notch = 'up'; }
    else {
      cy = at.y - at.r - h / 2 - 12;
      if (cy - h / 2 < 6) { cy = at.y + at.r + h / 2 + 12; notch = 'up'; }
      if (cy + h / 2 > CH - 6) { cx = at.x + at.r + w / 2 + 14; cy = at.y; notch = 'left'; }
    }
    const minX = w / 2 + 8, maxX = Math.max(minX, Math.min(CW - 8, free.r) - w / 2);
    const shifted = Math.max(minX, Math.min(maxX, cx));
    if ((notch === 'left' || notch === 'right') && shifted !== cx) notch = 'none';
    cx = shifted;
    cy = Math.max(h / 2 + 6, Math.min(CH - h / 2 - 6, cy));
    if (!calm) cy += Math.sin(this.time * 2.6) * 2.2;

    this.coachLabelBox = { l: cx - w / 2 - 12, r: cx + w / 2 + 12, t: cy - h / 2 - 12, b: cy + h / 2 + 12 };
    ctx.translate(cx, cy);
    ctx.scale(pop, pop);
    ctx.globalAlpha = Math.min(1, p * 2.5);
    ctx.beginPath();
    rr(-w / 2, -h / 2, w, h, 10);
    ctx.fillStyle = 'rgba(255,250,236,.97)'; ctx.fill();
    ctx.lineWidth = 2.6; ctx.strokeStyle = 'rgba(47,100,64,.95)'; ctx.stroke();
    // the notch, pointing at the target
    ctx.fillStyle = 'rgba(47,100,64,.95)';
    ctx.beginPath();
    if (notch === 'down') { ctx.moveTo(-9, h / 2 - 1); ctx.lineTo(9, h / 2 - 1); ctx.lineTo(0, h / 2 + 10); }
    else if (notch === 'up') { ctx.moveTo(-9, -h / 2 + 1); ctx.lineTo(9, -h / 2 + 1); ctx.lineTo(0, -h / 2 - 10); }
    else if (notch === 'left') { ctx.moveTo(-w / 2 + 1, -9); ctx.lineTo(-w / 2 + 1, 9); ctx.lineTo(-w / 2 - 10, 0); }
    else if (notch === 'right') { ctx.moveTo(w / 2 - 1, -9); ctx.lineTo(w / 2 - 1, 9); ctx.lineTo(w / 2 + 10, 0); }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#2f6440';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, 0, 1);
    ctx.restore();
  }

  /* One dashed ice-green outline, breathing, in two weights so it reads over
     grass and over sky alike. The march and the breath both stop under
     `calm`, which is where every other animation in here stops too. */
  coachStroke(draw) {
    const pulse = calm ? .5 : Math.sin(this.time * 3.2) * .5 + .5;
    ctx.save();
    ctx.setLineDash([8, 7]);
    ctx.lineDashOffset = calm ? 0 : -this.time * 26;
    ctx.strokeStyle = 'rgba(93,156,65,' + (.18 + pulse * .16).toFixed(3) + ')';
    ctx.lineWidth = 9;
    draw(pulse);
    ctx.strokeStyle = 'rgba(47,100,64,.95)';
    ctx.lineWidth = 2.6;
    draw(pulse);
    ctx.restore();
  }
  coachRing(x, y, r, ry) {
    this.coachStroke(pulse => {
      ctx.beginPath();
      if (ry) ctx.ellipse(x, y, r + pulse * 4, ry + pulse * 4, 0, 0, 6.3);
      else ctx.arc(x, y, r + pulse * 4, 0, 6.3);
      ctx.stroke();
    });
  }
  coachBox(x, y, w, h) {
    this.coachStroke(pulse => {
      const p = 3 + pulse * 3;
      rr(x - p, y - p, w + p * 2, h + p * 2, 8);
      ctx.stroke();
    });
  }

  drawPanels() {
    const BW = 48, BH = 38, GAP = 6;
    const stripW = BW * 4 + GAP * 3 + 14;
    const fieldC = this.originX + CFG.cols * CFG.cell * this.scale / 2;
    // while the training card floats top right, the strip keeps out from under it
    const stripR = this.tutorial ? Math.min(CW, coachFreeArea().r + 10) : CW;
    const x0 = Math.round(Math.min(Math.max(fieldC - stripW / 2, 8), stripR - stripW - 8));
    const y0 = 18;

    const box = (x, y, type, size, dim) => {
      rr(x, y, BW, BH, 6);
      ctx.fillStyle = 'rgba(252,247,234,.9)'; ctx.fill();
      ctx.strokeStyle = 'rgba(120,92,58,.4)'; ctx.lineWidth = 1; ctx.stroke();
      if (!type) return;
      const def = TURRETS[type], cells = SHAPES[type];
      const w = Math.max(...cells.map(c => c[0])) + 1;
      const h = Math.max(...cells.map(c => c[1])) + 1;
      const ox = x + BW / 2 - w * size / 2, oy = y + BH / 2 - h * size / 2;
      ctx.globalAlpha = dim ? .55 : 1;
      ctx.fillStyle = def.color;
      cells.forEach(([cx2, cy2]) => {
        rr(ox + cx2 * size, oy + (h - 1 - cy2) * size, size - 1.5, size - 1.5, 1.6);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    };

    ctx.font = '700 8.5px ' + FM;
    ctx.fillStyle = '#7d6b53';
    ctx.fillText(TT('hold'), x0, y0 - 5);
    box(x0, y0, this.hold, 8, this.holdUsed);
    this.holdBox = { x: x0, y: y0, w: BW, h: BH };   // the training card points at it

    const nx = x0 + BW + 14;
    ctx.fillStyle = '#7d6b53';
    ctx.fillText(T('next'), nx, y0 - 5);
    const nextThree = this.bag.peek(3);
    for (let i = 0; i < 3; i++) box(nx + i * (BW + GAP), y0, nextThree[i], i === 0 ? 8.5 : 6.5, i > 0);

    const nd = TURRETS[nextThree[0]];
    ctx.fillStyle = nd.color;
    ctx.font = '600 12px ' + FD;
    ctx.fillText(T('sh_' + nd.key), nx, y0 + BH + 13);

    // strain / limit markers, pinned to the right edge of the canvas; they
    // stand down while the training signboard is naming the same line
    const namingLine = this.tutorial && TUT_STEPS[this.tutorial.step].spot === 'line';
    ctx.font = '700 9px ' + FM;
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(150,45,30,.95)';
    const ry = this.sy(CFG.overheatRow * CFG.cell), ly = this.sy(CFG.heightLimit * CFG.cell);
    if (!namingLine && ry > 12 && ry < CH) ctx.fillText(T('strain'), CW - 8, ry - 4);
    if (!namingLine && ly > 12 && ly < CH) ctx.fillText(T('limit'), CW - 8, ly - 4);
    ctx.textAlign = 'left';

    if (this.overheat > 0 && !this.gameOver) {
      ctx.font = '500 14px ' + FD;
      ctx.textAlign = 'center';
      const msg = T('overheatWarn', this.overheat);
      const tw = ctx.measureText(msg).width, pw = tw + 36;
      // a plate behind it, or the mobs underneath make the warning unreadable
      rr(CW / 2 - pw / 2, CH - 26, pw, 20, 6);
      ctx.fillStyle = 'rgba(252,247,234,.92)'; ctx.fill();
      ctx.strokeStyle = 'rgba(191,68,51,.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = calm ? .95 : .65 + Math.sin(this.time * 7) * .33;
      ctx.fillStyle = ctx.strokeStyle = '#bf4433';
      this.drawMark('warn', CW / 2 - pw / 2 + 14, CH - 16, 11);
      ctx.fillStyle = '#bf4433';
      ctx.fillText(msg, CW / 2 + 9, CH - 12);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  }

  drawBossBar() {
    const b = this.boss;
    if (!b) return;
    // sits in the empty sky above the fight, never on top of the mobs
    const w = Math.min(360, CW - 60), x = (CW - w) / 2, y = 82;
    ctx.fillStyle = 'rgba(252,247,234,.92)';
    rr(x - 3, y - 3, w + 6, 20, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(120,92,58,.45)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = 'rgba(168,52,31,.22)';
    ctx.fillRect(x, y, w, 14);
    ctx.fillStyle = '#a8341f';
    ctx.fillRect(x, y, w * Math.max(0, b.hp / b.max), 14);
    ctx.font = '500 12px ' + FD;
    ctx.textAlign = 'center';
    const name = enemyName(b.def), nw = ctx.measureText(name).width;
    // at full health the ink and the bar fill are the same value, so both the
    // mark and the name carry the plate colour around them
    ctx.strokeStyle = 'rgba(252,247,234,.95)'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
    ctx.strokeText(name, CW / 2 + 8, y + 11);
    ctx.fillStyle = '#5a2418';
    ctx.fillText(name, CW / 2 + 8, y + 11);
    this.drawMark('skull', CW / 2 - nw / 2 - 2, y + 6.5, 14);
    ctx.textAlign = 'left';
  }

  drawBanner() {
    if (!this.banner) return;
    const b = this.banner;
    const k = Math.min(1, b.t / .18);
    const fade = b.t > b.life - .5 ? (b.life - b.t) / .5 : 1;
    ctx.globalAlpha = Math.max(0, Math.min(1, fade));
    ctx.textAlign = 'center';
    /* sized to the field: on a phone the full size ran off both edges */
    let fs = 21 + k * 7;
    ctx.font = '600 ' + fs + 'px ' + FD;
    const fitW = ctx.measureText(b.text).width;
    if (fitW > CW - 24) { fs = Math.max(12, fs * (CW - 24) / fitW); ctx.font = '600 ' + fs.toFixed(1) + 'px ' + FD; }
    /* centred on the field, unless the floating coach card is sitting on that
       spot: then centred on the sky left of the card, clamped to the canvas */
    let bx = CW / 2, by = CH * 0.3;
    const half = ctx.measureText(b.text).width / 2 + 10;
    const cl = this.tutorial ? coachFloatLeft() : null;
    if (cl !== null && bx + half > cl) bx = Math.max(half, Math.min(bx, cl - half));
    /* and around a training signboard: over it if that clears the piece
       strip, otherwise under it */
    const lb = this.tutorial && this.coachLabelBox;
    if (lb && bx + half > lb.l && bx - half < lb.r && by + 8 > lb.t && by - fs < lb.b) {
      by = lb.t - 8 - fs > 80 ? lb.t - 8 : Math.min(CH - 12, lb.b + fs + 4);
    }
    // a cream outline keeps banner text legible over sky, grass or a crowd
    ctx.lineWidth = 4.5;
    ctx.strokeStyle = 'rgba(255,250,232,.92)';
    ctx.lineJoin = 'round';
    ctx.strokeText(b.text, bx, by);
    ctx.fillStyle = b.color;
    ctx.fillText(b.text, bx, by);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  /* ------------------------------ HUD ----------------------------------- */
  /* One DOM write per value that actually changed. The HUD used to reassign
     every string, class, style and disabled flag on every frame — sixty times a
     second for a wave counter that changes once a minute. `put`, `dis` and `cls`
     below compare first and skip the write, which is also what keeps the
     screen reader from re-reading an unchanged button. */
  syncUI() {
    const live = this.live, over = this.gameOver;
    const cost = this.buyCost, coins = Math.floor(this.coins);
    const bill = this.upkeepParts;

    put(ui.coins, coins);
    put(ui.coreHp, Math.ceil(this.hp) + '/' + Math.round(this.maxHp));
    put(ui.wave, this.wave);
    put(ui.armory, this.armory + (this.armory ? '  ×' + this.dmgMult.toFixed(1) : ''));
    put(ui.upkeep, '-' + bill.due);
    sty(ui.upkeep, 'color', this.coins >= bill.due ? '#a06a2a' : '#bf4433');
    /* both halves of the bill, spelled out where the number is: the buildings
       bill and the cut of the hoard, with the one you are actually paying */
    att(ui.upkeepStat, 'title', T('upkeepHint', bill.perBlock, Math.round(CFG.hoardTax * 100), bill.onHoard));

    const r = Math.max(0, Math.min(1, this.hp / this.maxHp));
    sty(ui.hpBar, 'transform', 'scaleX(' + r.toFixed(4) + ')');
    const hpCol = r > .5 ? '#5d9c41' : r > .25 ? '#cf8a24' : '#bf4433';
    sty(ui.hpBar, 'background', hpCol);
    sty(ui.hpBar, 'color', hpCol);

    dis(ui.buyBtn, !live || !!this.piece || this.coins < cost);
    // there is no pause in a match, so the button says so rather than
    // sitting there looking pressable
    dis(ui.pauseBtn, VS.live);
    cls(canvas, 'hold', !!this.piece && live);
    cls(ui.buyBtn, 'warn', this.nearLimit);
    put(ui.buyT, T('build') + ' (' + cost + ')');
    dis(ui.repairBtn, !live || this.coins < this.repairCost || this.hp >= this.maxHp);
    put(ui.repairT, T('repair') + ' (' + this.repairCost + ')');
    put(ui.sector, T('sector', T(this.sector.key)));
    sty(ui.sector, 'color', this.sector.accent);

    /* --- on-screen piece controls --- */
    const hasPiece = live && !!this.piece;
    dis(ui.tLeft, !hasPiece); dis(ui.tRight, !hasPiece);
    dis(ui.tRot, !hasPiece || this.piece.type === 'O');
    dis(ui.tSoft, !hasPiece); dis(ui.tDrop, !hasPiece);
    dis(ui.tHold, !hasPiece || this.holdUsed);

    /* --- hand-operated defences --- */
    const bellReady = this.cdBell <= 0;
    dis(ui.abBell, !live || !bellReady);
    cls(ui.abBell, 'ready', live && bellReady);
    put(ui.abBellN, T('ab_bell'));
    put(ui.abBellS, bellReady ? T('ab_bellS') : Math.ceil(this.cdBell) + 's');
    sty(ui.abBellCd, 'transform', 'scaleX(' + (this.cdBell / CFG.bellCd).toFixed(3) + ')');

    const rallyReady = this.cdRally <= 0;
    dis(ui.abRally, !live || !rallyReady);
    cls(ui.abRally, 'hot', this.rally > 0);
    cls(ui.abRally, 'ready', live && rallyReady && this.rally <= 0);
    put(ui.abRallyN, T('ab_rally'));
    put(ui.abRallyS, this.rally > 0 ? this.rally.toFixed(1) + 's'
      : (rallyReady ? T('ab_rallyS') : Math.ceil(this.cdRally) + 's'));
    sty(ui.abRallyCd, 'transform', 'scaleX(' + (this.cdRally / CFG.rallyCd).toFixed(3) + ')');

    const mc = this.mendCost;
    dis(ui.abMend, !live || mc <= 0 || this.coins < mc);
    cls(ui.abMend, 'ready', live && mc > 0 && this.coins >= mc);
    put(ui.abMendN, T('ab_mend') + (mc > 0 ? ' (' + mc + ')' : ''));
    put(ui.abMendS, mc > 0 ? T('ab_mendS') : T('ab_nothing'));

    /* --- the wave bar --- */
    const bar = ui.waveBar;
    if (over) {
      cls(bar, 'fight', false); cls(bar, 'over', true);
      dis(bar, false);
      put(ui.waveMain, T('coreLost'));
      put(ui.waveSub, TT('coreLostSub'));
      sty(ui.waveFill, 'transform', 'scaleX(0)');
    } else if (this.phase === 'prep') {
      const t = Math.max(0, this.prepTimer);
      cls(bar, 'fight', false); cls(bar, 'over', false);
      // in training the countdown is frozen on purpose, so the bar must not
      // promise a wave "in 7 seconds" that is never coming
      const frozen = !!this.tutorial && !this.canCallWave;
      dis(bar, !this.canCallWave);
      put(ui.waveMain, T('startNow', this.wave + 1, this.earlyBonus));
      put(ui.waveSub, frozen ? T('startHeld') : TT('startSub', t.toFixed(1)));
      sty(ui.waveFill, 'transform', 'scaleX(' + (frozen ? 0 : (1 - t / CFG.prepTime).toFixed(3)) + ')');
    } else {
      const left = this.enemiesLeft;
      cls(bar, 'fight', true); cls(bar, 'over', false);
      dis(bar, true);
      put(ui.waveMain, T('fight', this.wave, left));
      put(ui.waveSub, T('fightSub'));
      const done = this.waveTotal ? 1 - left / this.waveTotal : 0;
      sty(ui.waveFill, 'transform', 'scaleX(' + Math.max(0, Math.min(1, done)).toFixed(3) + ')');
    }

    this.announce();
  }

  /* The field itself is a canvas and says nothing to a screen reader. This is
     the text equivalent of what is drawn: state, not every frame of it — at
     most once a second, and only when the sentence actually changes. */
  announce() {
    if (this.time - (this._saidAt || -9) < 1) return;
    this._saidAt = this.time;
    const next = this.bag.peek(1)[0];
    const parts = [
      /* The held countdown has to be said as held. This line was promising a
         wave "in 7 seconds" through every step of training while the bar two
         inches above it said the clock was stopped. */
      this.gameOver ? T('coreLost')
        : this.phase !== 'prep' ? T('a_stateFight', this.wave, this.enemiesLeft)
        : this.tutorial && !this.canCallWave ? T('startHeld')
        : T('a_statePrep', this.wave + 1, Math.ceil(Math.max(0, this.prepTimer))),
      T('a_core', Math.ceil(this.hp), Math.round(this.maxHp)),
      T('a_stock', Math.floor(this.coins)),
      T('a_next', T('t_' + next), this.hold ? T('t_' + this.hold) : ''),
      T('a_stack', this.stackHeight, CFG.overheatRow),
    ];
    if (VS.active) parts.push(T('a_versus', VS.foe.nick || T('vs_foe'), VS.foe.held, VS.me.held));
    const line = parts.join('. ') + '.';
    if (line === this._said) return;
    this._said = line;
    if (ui.fieldState) ui.fieldState.textContent = line;
  }
}

/* Write-if-changed. Called from the frame loop, where an unconditional
   assignment to textContent or className is a layout invalidation the browser
   has to take seriously even when the value is identical. */
function put(el, v) { v = String(v); if (el && el.textContent !== v) el.textContent = v; }
function dis(el, v) { v = !!v; if (el && el.disabled !== v) el.disabled = v; }
function cls(el, name, on) { if (el && el.classList.contains(name) !== !!on) el.classList.toggle(name, !!on); }
function sty(el, prop, v) { if (el && el.style[prop] !== v) el.style[prop] = v; }
function att(el, name, v) { if (el && el.getAttribute(name) !== v) el.setAttribute(name, v); }

/* ==========================================================================
   SETTINGS THAT ARE NOT SOUND: motion and on-screen controls.
   ======================================================================== */
/* Reduced motion starts from the system setting and can be overridden here.
   CSS cannot reach the canvas, so the same flag also mutes screen shake and
   the impact flashes - see Game.draw. */
const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
const coarseQuery = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
let calm = STORE.raw('calm', null);
if (typeof calm !== 'boolean') calm = !!(motionQuery && motionQuery.matches);
let touchCtl = STORE.raw('touchctl', null);
if (typeof touchCtl !== 'boolean') touchCtl = !!(coarseQuery && coarseQuery.matches);

function applySettings() {
  document.documentElement.classList.toggle('calm', calm);
  document.documentElement.classList.toggle('touchctl', touchCtl);
  syncToggles();
  resize();
}
/* Follow the system until the player says otherwise: once either toggle has
   been touched, the stored answer wins and the query is ignored. */
function followSystem(q, key, set) {
  if (!q || !q.addEventListener) return;
  q.addEventListener('change', e => {
    if (typeof STORE.raw(key, null) === 'boolean') return;
    set(e.matches);
    applySettings();
  });
}
followSystem(motionQuery, 'calm', v => { calm = v; });
followSystem(coarseQuery, 'touchctl', v => { touchCtl = v; });
function syncToggles() {
  if (!ui.motionBtn) return;
  put(ui.motionBtn, T(calm ? 'onWord' : 'offWord'));
  att(ui.motionBtn, 'aria-pressed', calm ? 'true' : 'false');
  cls(ui.motionBtn, 'sel', calm);
  put(ui.touchBtn, T(touchCtl ? 'onWord' : 'offWord'));
  att(ui.touchBtn, 'aria-pressed', touchCtl ? 'true' : 'false');
  cls(ui.touchBtn, 'sel', touchCtl);
}

/* ==========================================================================
   SCREEN STATE. Exactly one context is reachable at a time: whatever is on
   top takes the focus and the Tab ring, and everything underneath goes inert.
   Without this the main menu's accessibility tree still held every HUD button
   sitting behind it, and Tab walked straight into an invisible game.
   ======================================================================== */
let focusReturn = null;
function topLayer() {
  if (APP === 'menu') return ui.menu;
  if (APP === 'codex') return ui.codex;
  if (APP === 'online') return ui.online;
  if (choiceOpen) return ui.choice;
  if (storyOpen) return ui.sectorCard;
  if (game && (game.paused || game.gameOver)) return ui.modal;
  return null;                                  // the field itself: no overlay
}
const FOCUSABLE = 'button:not([disabled]), [href], input:not([disabled]), summary, [tabindex]:not([tabindex="-1"])';
const visible = el => !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
function firstFocusable(root) {
  for (const el of root.querySelectorAll(FOCUSABLE)) if (visible(el)) return el;
  return null;
}
/* The game's own controls, listed because the overlays live inside the same
   .app element: marking .app inert would take the pause sheet with it, and
   marking only the overlays leaves every HUD button live behind them. */
const GAME_CHROME = [document.querySelector('.hud'), ui.waveBar,
                     document.querySelector('.abils'), ui.touchbar, canvas];
function applyLayers() {
  const top = topLayer();
  /* `inert` takes a subtree out of the tab order, out of hit testing and out of
     the accessibility tree in one attribute — the three things a modal has to
     do, and the three things `hidden` on a sibling never did. */
  for (const el of [ui.menu, ui.codex, ui.online]) if (el) el.inert = !!top && el !== top;
  for (const el of GAME_CHROME) if (el) el.inert = !!top;
  for (const el of [ui.modal, ui.sectorCard, ui.choice, ui.tut]) if (el) el.inert = !!top && el !== top;

  if (top && !top.contains(document.activeElement)) {
    const cur = document.activeElement;
    if (!focusReturn && cur && cur !== document.body) focusReturn = cur;
    const f = top.querySelector('[data-autofocus]') || firstFocusable(top);
    if (f) f.focus({ preventScroll: true });
  } else if (!top && focusReturn) {
    // closing the last overlay hands focus back to whatever opened it
    if (document.body.contains(focusReturn) && !focusReturn.disabled) focusReturn.focus({ preventScroll: true });
    focusReturn = null;
  }
}

/* ---- pause / game-over sheet ---- */
function syncModal() {
  // story cards and the menu own the screen while they are up
  // in a live match a player who is out keeps watching the other half; the
  // sheet waits until the match itself is decided
  const show = !!game && (game.paused || game.gameOver || VS.state === 'over')
               && !storyOpen && !choiceOpen && APP === 'game' && !VS.live;
  ui.modal.hidden = !show;
  /* The coach card used to be an overlay, so it had to be pulled off screen
     whenever a sheet came up or it would swallow the buttons underneath. It
     is a row under the field now: it keeps its place, syncOverlays marks it
     inert while a sheet is up, and the field no longer resizes twice every
     time somebody pauses. */
  if (game && game.tutorial) ui.tut.hidden = APP !== 'game';
  const held = !!(game && game.paused && !game.gameOver);
  cls(ui.pauseBtn, 'paused', held);
  att(ui.pauseBtn, 'aria-label', T(held ? 'resume' : 'pause'));
  if (show) {
    if (VS.state === 'over') {
      put(ui.modalTitle, T(VS.result === 'win' ? 'vs_win' : VS.result === 'draw' ? 'vs_draw' : 'vs_loss'));
      sty(ui.modalTitle, 'color', VS.result === 'win' ? 'var(--ink-good)'
        : VS.result === 'draw' ? 'var(--text)' : 'var(--ink-danger)');
      put(ui.modalSub, T('vs_sub', VS.me.nick, VS.me.held, VS.foe.nick, VS.foe.held));
      ui.resumeBtn.hidden = true;
    } else if (game.gameOver) {
      put(ui.modalTitle, T('coreLost'));
      sty(ui.modalTitle, 'color', 'var(--ink-danger)');
      put(ui.modalSub, T('overSub', game.wavesHeld, game.kills, game.linesCleared));
      ui.resumeBtn.hidden = true;
    } else {
      put(ui.modalTitle, T('paused'));
      sty(ui.modalTitle, 'color', 'var(--text)');
      put(ui.modalSub, TT('pausedSub'));
      ui.resumeBtn.hidden = false;
    }
    renderTally(ui.modalSummary, game.lastWave);
    renderMods(ui.modalMods, game);
    syncToggles();
  }
  applyLayers();
}

/* The wave receipt: reward, salvage, the bill and what is left. Both halves of
   the economy in one line, so "where did my stock go" has an answer. */
function renderTally(el, w) {
  if (!el) return;
  if (!w) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = T('tally', w.wave, w.bonus, w.tech, w.due, w.stock) +
    (w.short > 0 ? ' <span class="short">' + T('tallyShort', w.short) + '</span>' : '');
}

/* What the chosen cards add up to. The cards themselves vanish when picked, so
   after four waves there was no way to see what a run had turned into. */
function runMods(g) {
  const m = g.mods, out = [];
  const pct = (k, v, lowerIsBetter) => {
    if (Math.abs(v - 1) < 0.005) return;
    out.push([k, (v > 1 ? '+' : '\u2212') + Math.round(Math.abs(v - 1) * 100) + '%',
              lowerIsBetter ? v < 1 : v > 1]);
  };
  pct('fx_dmg', m.dmg, false);
  pct('fx_wear', m.wear, true);
  pct('fx_cost', m.cost, true);
  pct('fx_upkeep', m.upkeep, true);
  pct('fx_mend', m.mend, false);
  pct('fx_bounty', m.bounty, false);
  pct('fx_speed', m.speed, true);
  if (m.tech) out.push(['fx_tech', '+' + m.tech, true]);
  return out;
}
function renderMods(el, g) {
  if (!el) return;
  const rows = runMods(g);
  if (!rows.length && !g.taken.length) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = rows.map(([k, v, good]) =>
    '<span class="chip"><b style="color:' + (good ? 'var(--ink-good)' : 'var(--ink-danger)') + '">' +
    v + '</b> ' + T(k) + '</span>').join('') +
    (g.taken.length ? '<span class="chip">' + T('takenCount', g.taken.length) + '</span>' : '');
}

function toast(msg) {
  put(ui.toast, msg);
  ui.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => ui.toast.classList.remove('show'), 2600);
}
